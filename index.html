<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Financeiro — Escritório de Advocacia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#eef1f0; --surface:#fff; --surface2:#f7f9f8;
  --ink:#16201f; --ink2:#5a6a67; --ink3:#8b9895;
  --line:#d4dcd9; --line2:#e6ecea;
  --brand:#0b5d5a; --brand-d:#073f3d; --brand-l:#e2efee;
  --brass:#9a7b2f; --brass-l:#f6efdf;
  --pos:#1f7a5c; --pos-l:#e3f2ec;
  --neg:#a0392e; --neg-l:#fae9e6;
  --r:6px; --rail:224px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num,td.num,th.num,.money{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ── LOGIN ── */
#login{position:fixed;inset:0;background:var(--brand-d);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
#login .cx{background:#fff;border-radius:10px;padding:38px 34px;width:100%;max-width:370px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
#login h1{font-size:19px;letter-spacing:-.2px;margin-bottom:4px}
#login p{color:var(--ink2);font-size:13px;margin-bottom:22px}
.campo{margin-bottom:13px}
.campo label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px;font-weight:500}
.campo input,.campo select,.campo textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-l)}
.btn{background:var(--brand);color:#fff;border:0;border-radius:var(--r);padding:9px 16px;font-weight:600;font-size:13px}
.btn:hover{background:var(--brand-d)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:var(--surface2)}
.btn.per{background:var(--neg)}
.btn.ok{background:var(--pos)}
.btn.full{width:100%;padding:11px}
.btn.sm{padding:5px 10px;font-size:12px;font-weight:500}
.btn:disabled{opacity:.5;cursor:not-allowed}
.erro{background:var(--neg-l);color:var(--neg);padding:8px 11px;border-radius:var(--r);font-size:13px;margin-bottom:12px}

/* ── ESTRUTURA ── */
#app{display:none;min-height:100vh}
header{position:fixed;top:0;left:0;right:0;height:56px;background:var(--brand-d);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;z-index:60}
.logo{height:30px;width:auto;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.logo.grande{height:66px;display:block;margin:0 auto 16px;filter:none}
@media(max-width:900px){.logo{height:26px}}
header .marca{font-weight:600;letter-spacing:-.2px;font-size:15px}
header .marca small{display:block;font-size:11px;opacity:.62;font-weight:400;letter-spacing:.02em}
header .dir{margin-left:auto;display:flex;align-items:center;gap:10px}
header .quem{font-size:12px;opacity:.8;text-align:right}
.net{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.1);white-space:nowrap}
.net i{width:8px;height:8px;border-radius:50%;background:#8b9895;flex:none}
.net.on i{background:#5fd0a8}
.net.salvando i{background:#f0c14b;animation:pulsa 1s ease-in-out infinite}
.net.salvo i{background:#5fd0a8}
.net.off i,.net.erro i{background:#ff8b7a}
.net.off,.net.erro{background:rgba(255,120,100,.22)}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.3}}
.conc{display:grid;grid-template-columns:minmax(210px,270px) 1fr;gap:11px;align-items:start}
.conc .lado{border-right:1px solid var(--line2);padding-right:11px}
.conc .lado .topo{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.conc .lado .valor{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;letter-spacing:-.3px}
.conc .lado .hist{font-size:11.5px;line-height:1.35;color:var(--ink2);margin-top:2px;word-break:break-word}
.conc .lado .acoes{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.conc .lado .acoes button{padding:1px 7px;font-size:11px}
.card.fino{margin-bottom:5px}
.card.fino .corpo{padding:6px 10px}
.card.fino .sug{padding:2px 8px;margin-bottom:2px;gap:6px;align-items:center}
.card.fino .sug .info{display:flex;gap:6px;align-items:baseline;min-width:0;flex-wrap:wrap}
.card.fino .sug .info b{font-size:12.5px;flex:none}
.card.fino .sug .info .det{font-size:11px;color:var(--ink2)}
.card.fino .score{font-size:10.5px;padding:0 6px}
.card.fino .btn.sm{padding:2px 9px;font-size:11.5px}
.maisSug{background:none;border:0;color:var(--brand);font-size:11.5px;padding:2px 0;text-decoration:underline}
@media(max-width:760px){.conc{grid-template-columns:1fr;gap:8px}.conc .lado{border-right:0;border-bottom:1px solid var(--line2);padding:0 0 8px}}
.icobtn{width:34px;height:34px;border-radius:var(--r);border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;display:grid;place-items:center;font-size:16px}
.icobtn:hover{background:rgba(255,255,255,.13)}

nav{position:fixed;top:56px;bottom:0;left:0;width:var(--rail);background:var(--surface);border-right:1px solid var(--line);padding:12px 0;overflow-y:auto;z-index:50}
nav .grupo{font-size:10.5px;letter-spacing:.09em;color:var(--ink3);padding:14px 18px 6px;font-weight:600;text-transform:uppercase}
nav button{display:flex;width:100%;align-items:center;gap:9px;padding:9px 18px;background:none;border:0;border-left:3px solid transparent;text-align:left;font-size:13.5px;color:var(--ink2)}
nav button:hover{background:var(--surface2);color:var(--ink)}
nav button.on{background:var(--brand-l);border-left-color:var(--brand);color:var(--brand-d);font-weight:600}
nav button .bolha{margin-left:auto;background:var(--brass);color:#fff;border-radius:9px;font-size:10.5px;padding:1px 6px;font-weight:600;font-family:'IBM Plex Mono',monospace}

main{margin:56px 0 0 var(--rail);padding:22px 24px 60px}
.titulo{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.titulo h2{font-size:21px;letter-spacing:-.3px}
.titulo p{color:var(--ink2);font-size:13px;margin-top:2px}
.titulo .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:16px}
.card>h3{font-size:13px;font-weight:600;padding:11px 15px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
.card>h3 .acoes{margin-left:auto;display:flex;gap:7px}
.card .corpo{padding:15px}

.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.subtabs button{background:none;border:0;padding:9px 14px;font-size:13px;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.subtabs button.on{color:var(--brand-d);border-bottom-color:var(--brand);font-weight:600}

/* ── TABELAS ── */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.04em;color:var(--ink2);padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr:hover{background:var(--surface2)}
tr.grifo{background:var(--brass-l)}
.kpi.abrir:hover{border-color:var(--brand);background:var(--brand-l)}
td.abrir{cursor:pointer}
tr:hover td.abrir{color:var(--brand-d)}
.lupa{color:var(--ink3);font-weight:700}
tr:hover .lupa{color:var(--brand)}
table.dre tr:has(td.abrir):hover td{background:var(--brand-l)}
.barraSel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--brand-l);border:1px solid var(--brand);
  border-radius:var(--r);padding:9px 14px;margin-bottom:14px;font-size:13px;color:var(--brand-d)}
tr.sel{background:var(--brand-l)}
tr.sel:hover{background:var(--brand-l)}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 12px;font-size:12.5px}
.pill.off{opacity:.55}
.pill button{background:none;border:0;color:var(--ink3);width:22px;height:22px;border-radius:50%;font-size:12px;line-height:1}
.pill button:hover{background:var(--line2);color:var(--ink)}
.seg{display:inline-flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);margin-bottom:14px}
.seg button{background:none;border:0;border-right:1px solid var(--line);padding:8px 14px;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:7px}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface2);color:var(--ink)}
.seg button span{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;background:var(--line2);color:var(--ink2);border-radius:9px;padding:1px 6px}
.seg button.on{background:var(--brand-l);color:var(--brand-d);font-weight:600}
.seg button.on span{background:var(--brand);color:#fff}
.seg button.kok.on{background:var(--pos-l);color:var(--pos)}
.seg button.kok.on span{background:var(--pos)}
.seg button.knao.on{background:var(--neg-l);color:var(--neg)}
.seg button.knao.on span{background:var(--neg)}
.seg button.ksem.on{background:var(--brass-l);color:var(--brass)}
.seg button.ksem.on span{background:var(--brass)}
table.densa th{padding:5px 8px}
table.densa td{padding:3px 8px;font-size:12.5px;line-height:1.3;white-space:nowrap}
table.densa td div.mini{display:inline;margin-left:6px}
table.densa td b{font-weight:600}
table.densa .tag{padding:1px 6px;font-size:10.5px}
table.densa .btn.sm{padding:2px 8px;font-size:11px}
.vazio{padding:34px 16px;text-align:center;color:var(--ink3);font-size:13px}
.vazio strong{display:block;color:var(--ink2);font-size:14px;margin-bottom:3px}

.tag{display:inline-block;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.t-pend{background:var(--brass-l);color:var(--brass)}
.t-ok{background:var(--pos-l);color:var(--pos)}
.t-ni{background:var(--neg-l);color:var(--neg)}
.t-neutro{background:var(--line2);color:var(--ink2)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.selo{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:700;cursor:help}
.selo.ok{background:var(--pos-l);color:var(--pos);border:1px solid var(--pos)}
.selo.nao{background:var(--neg-l);color:var(--neg);border:1px solid var(--neg)}
.mini{font-size:11.5px;color:var(--ink3)}

/* ── FILTROS ── */
.filtros{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filtros .campo{margin:0;min-width:130px}
.filtros .campo.busca{flex:1;min-width:200px}

/* ── KPIs ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 15px}
.kpi .rot{font-size:11.5px;color:var(--ink2);margin-bottom:5px}
.kpi .val{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;letter-spacing:-.5px}
.kpi .sub{font-size:11.5px;color:var(--ink3);margin-top:3px}
.kpi.d{border-left:3px solid var(--brand)}
.kpi.p{border-left:3px solid var(--pos)}
.kpi.n{border-left:3px solid var(--neg)}
.kpi.b{border-left:3px solid var(--brass)}

/* ── MODAIS ── */
.overlay{position:fixed;inset:0;background:rgba(11,32,30,.5);display:none;align-items:flex-start;justify-content:center;z-index:150;padding:26px 16px;overflow-y:auto}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:9px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.modal.larga{max-width:1000px}
.modal.estreita{max-width:440px}
.modal h3{font-size:16px;padding:16px 20px;border-bottom:1px solid var(--line2);display:flex;align-items:center}
.modal h3 .x{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;color:var(--ink3)}
.modal .corpo{padding:20px;max-height:70vh;overflow-y:auto}
.modal .rodape{padding:13px 20px;border-top:1px solid var(--line2);display:flex;gap:9px;justify-content:flex-end;background:var(--surface2);border-radius:0 0 9px 9px}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.grade .full{grid-column:1/-1}
.secao-form{font-size:11px;letter-spacing:.07em;color:var(--ink3);font-weight:600;grid-column:1/-1;padding-top:6px;border-top:1px solid var(--line2);margin-top:4px;text-transform:uppercase}
.check{display:flex;align-items:center;gap:8px;font-size:13px;padding-top:20px}
.check input{width:16px;height:16px;accent-color:var(--brand)}

/* ── SUGESTÕES DE CONCILIAÇÃO ── */
.sug{border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;margin-bottom:7px;display:flex;gap:11px;align-items:center;background:#fff}
.sug:last-child{margin-bottom:0}
.sug .info{flex:1;min-width:0}
.sug .info b{font-size:13px}
.sug .porq{font-size:11.5px;color:var(--ink2);margin-top:2px}
.score{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--brand-l);color:var(--brand-d)}
.score.alto{background:var(--pos-l);color:var(--pos)}
.score.baixo{background:var(--line2);color:var(--ink2)}

/* ── DRE ── */
table.dre td:first-child{white-space:nowrap}
table.dre tr.nivel1 td{font-weight:600;background:var(--surface2)}
table.dre tr.total td{font-weight:700;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);font-size:14px}
table.dre tr.recuo td:first-child{padding-left:26px;color:var(--ink2)}
.barra{height:7px;background:var(--line2);border-radius:4px;overflow:hidden;margin-top:5px}
.barra i{display:block;height:100%;background:var(--brand)}

/* ── AVISO / TOAST ── */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:7px;font-size:13px;z-index:300;transition:transform .22s;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.erro{background:var(--neg)} #toast.ok{background:var(--pos)}
#carregando{position:fixed;inset:0;background:rgba(238,241,240,.85);display:none;place-items:center;z-index:250;font-size:13px;color:var(--ink2)}
#carregando.on{display:grid}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:g .8s linear infinite;margin:0 auto 10px}
@keyframes g{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(max-width:900px){
  :root{--rail:0px}
  nav{position:static;width:auto;height:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:0;margin-top:56px}
  nav .grupo{display:none}
  nav button{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:11px 14px}
  nav button.on{border-left:0;border-bottom-color:var(--brand)}
  main{margin:0;padding:16px 13px 50px}
  header .quem{display:none}
  .net span{display:none}
  .net{padding:6px}
}
</style>
</head>

<script>
/* ══════════════════════════════════════════════════════════
   CONFIGURAÇÃO — cole aqui a URL /exec do seu Apps Script
   ══════════════════════════════════════════════════════════ */
const API_URL = 'https://script.google.com/macros/s/AKfycbzNNoolgJTQ5fKDmQ9ieSdWoLQrdKpRZB_GrxGHqtFjAFagZYoZ5a7_cCzfuDnvk05h/exec';
const VERSAO_APP = 'v3.9';

/* ── ESTADO ── */
let DB = {}, USER = null, ABA = 'conciliacao', SUB = '', FILTROS = {};
const A = { CONFIG:'CONFIG', USUARIOS:'USUARIOS', SUBCLASSES:'SUBCLASSES',
  COMISSIONADOS:'COMISSIONADOS', REGRAS:'REGRAS_COMISSAO', LANC:'LANCAMENTOS', PARC:'PARCELAS',
  EXT:'EXTRATO', CP:'CONTAS_PAGAR', CR:'CONTAS_RECEBER', COM:'COMISSOES' };

/* ── UTILITÁRIOS ── */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => (p||'r') + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function n(v){
  if (typeof v === 'number') return v;
  if (v == null || v === '') return 0;
  let s = String(v).replace(/[^\d,.\-]/g,'').trim();
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const x = parseFloat(s);
  return isNaN(x) ? 0 : x;
}
const rd = v => Math.round(n(v)*100)/100;
/* percentual de uma parte sobre um total, para exibição */
function pctSobre(parte, total){
  if (!n(total)) return '—';
  const x = rd(n(parte) / n(total) * 100);
  return (x % 1 === 0 ? String(x) : nMoeda(x)) + '%';
}
function moeda(v){
  const x = rd(v);
  return (x<0?'-':'') + 'R$ ' + Math.abs(x).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function nMoeda(v){ return rd(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function hoje(){ return new Date().toISOString().slice(0,10); }
function dataBR(iso){
  if (!iso) return '—';
  const s = String(iso).slice(0,10), p = s.split('-');
  return p.length === 3 ? p[2]+'/'+p[1]+'/'+p[0] : s;
}
function isoDe(txt){
  if (!txt) return '';
  const s = String(txt).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[1]+'-'+m[2]+'-'+m[3];
  m = s.match(/(\d{2})[\/.-](\d{2})[\/.-](\d{4})/); if (m) return m[3]+'-'+m[2]+'-'+m[1];
  m = s.match(/(\d{2})[\/.-](\d{2})[\/.-](\d{2})$/); if (m) return '20'+m[3]+'-'+m[2]+'-'+m[1];
  m = s.match(/^(\d{4})(\d{2})(\d{2})/); if (m) return m[1]+'-'+m[2]+'-'+m[3];
  return '';
}
function diasEntre(a,b){
  if (!a || !b) return 999;
  return Math.abs((new Date(a+'T12:00') - new Date(b+'T12:00')) / 86400000);
}
const digitos = s => String(s||'').replace(/\D/g,'');

/* ── Padrão de escrita: nada entra em CAIXA ALTA ──
   Primeira letra de cada palavra maiúscula, o resto minúsculo.
   Preserva siglas conhecidas, palavras com número e conectores. */
const SIGLAS = new Set(['FGTS','INSS','CNPJ','CPF','PIS','PASEP','ISS','IRRF','IR','TST','TRT','STJ','STF',
  'CLT','RPV','OAB','DARF','GPS','DAS','ME','EPP','MEI','PJ','SA','EXEC','FGV','IPTU','IPVA','ICMS','TED','PIX','DOC']);
const CONECTORES = new Set(['de','da','do','das','dos','e','em','no','na','nos','nas','a','o','as','os',
  'para','com','por','sob','sobre','ao','aos','à','às','um','uma']);
function tit(txt){
  const s = String(txt == null ? '' : txt).trim().replace(/\s+/g,' ');
  if (!s) return '';
  return s.split(' ').map((p, i) => {
    if (/\d/.test(p)) return p;                                   // 1234-5, 0010543-12.2024…
    const limpo = p.replace(/[^A-Za-zÀ-ÿ]/g,'').toUpperCase();
    if (SIGLAS.has(limpo)) return p.toUpperCase();
    const min = p.toLocaleLowerCase('pt-BR');
    if (i > 0 && CONECTORES.has(min)) return min;
    return min.charAt(0).toLocaleUpperCase('pt-BR') + min.slice(1);
  }).join(' ');
}
const mesDe = iso => String(iso||'').slice(0,7);
function mesBR(ym){
  if (!ym) return '—';
  const M = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const p = ym.split('-'); return M[+p[1]-1] + '/' + p[0];
}
function toast(msg, tipo){
  const t = $('#toast'); t.textContent = msg; t.className = 'on ' + (tipo||'');
  clearTimeout(t._t); t._t = setTimeout(()=>t.className='', 3400);
}
function carregandoOn(msg){ $('#msgCarregando').textContent = msg || 'Carregando…'; $('#carregando').classList.add('on'); }
function carregandoOff(){ $('#carregando').classList.remove('on'); }
const cfg = (k, pad) => { const r = (DB.CONFIG||[]).find(c => c.CHAVE === k); return r ? r.VALOR : (pad||''); };

/* ── SITUAÇÃO DA CONEXÃO ── */
const NET = { pendentes:0, ultimo:'', erro:'' };
function pintarNet(){
  const el = document.getElementById('net'); if (!el) return;
  let cls = '', txt = '';
  if (!navigator.onLine){ cls = 'off'; txt = 'Offline'; }
  else if (NET.pendentes > 0){ cls = 'salvando'; txt = 'Salvando…'; }
  else if (NET.erro){ cls = 'erro'; txt = 'Não salvo'; }
  else if (NET.ultimo){ cls = 'salvo'; txt = 'Salvo ' + NET.ultimo; }
  else { cls = 'on'; txt = 'Online'; }
  el.className = 'net ' + cls;
  el.innerHTML = '<i></i><span>' + esc(txt) + '</span>';
  el.title = !navigator.onLine ? 'Sem internet. As alterações não estão indo para a nuvem.'
    : NET.erro ? 'A última gravação falhou: ' + NET.erro
    : NET.ultimo ? 'Última gravação na nuvem às ' + NET.ultimo : 'Conectado ao Google';
}
window.addEventListener('online', () => { NET.erro = ''; pintarNet(); toast('Conexão restabelecida.','ok'); });
window.addEventListener('offline', () => { pintarNet(); toast('Você está offline. Nada será salvo até a conexão voltar.','erro'); });
const agoraHM = () => new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

/* ── API ── */
async function api(payload){
  if (!API_URL || API_URL.indexOf('COLE_AQUI') === 0) throw new Error('Configure a API_URL no index.html antes de usar.');
  const escrita = ['salvar','salvarLote','excluir','excluirLote','upload'].includes(payload.action);
  if (escrita && !navigator.onLine){ NET.erro = 'sem conexão'; pintarNet(); throw new Error('Você está offline. Reconecte para salvar.'); }
  if (escrita){ NET.pendentes++; pintarNet(); }
  try{
    const r = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.erro || 'Falha na comunicação com o servidor.');
    if (escrita){ NET.erro = ''; NET.ultimo = agoraHM(); }
    return j;
  }catch(e){
    if (escrita) NET.erro = e.message || 'falha de rede';
    throw e;
  }finally{
    if (escrita){ NET.pendentes = Math.max(0, NET.pendentes - 1); pintarNet(); }
  }
}
async function salvar(aba, reg, silencio){
  const j = await api({action:'salvar', aba, registro:reg});
  const lista = DB[aba] || (DB[aba] = []);
  const i = lista.findIndex(x => x.ID === j.registro.ID);
  if (i >= 0) lista[i] = j.registro; else lista.push(j.registro);
  if (!silencio) toast('Salvo na nuvem às ' + NET.ultimo + '.','ok');
  return j.registro;
}
async function salvarLote(lote){
  lote.forEach(it => { if (!it.registro.ID) it.registro.ID = uid(); });
  await api({action:'salvarLote', lote});
  lote.forEach(it => {
    const lista = DB[it.aba] || (DB[it.aba] = []);
    const i = lista.findIndex(x => x.ID === it.registro.ID);
    if (i >= 0) lista[i] = it.registro; else lista.push(it.registro);
  });
}
/* grava aplicando primeiro na tela e depois na nuvem — a interface não trava */
async function salvarLoteRapido(lote){
  lote.forEach(it => { if (!it.registro.ID) it.registro.ID = uid(); });
  lote.forEach(it => {
    const L = DB[it.aba] || (DB[it.aba] = []);
    const i = L.findIndex(x => x.ID === it.registro.ID);
    if (i >= 0) L[i] = it.registro; else L.push(it.registro);
  });
  render();
  try{ await api({action:'salvarLote', lote}); }
  catch(e){ toast('Não foi possível salvar: ' + e.message + ' — recarregando da nuvem.','erro'); await carregar(); throw e; }
}
async function excluir(aba, id){
  await api({action:'excluir', aba, id});
  DB[aba] = (DB[aba]||[]).filter(x => x.ID !== id);
}
async function carregar(avisar){
  carregandoOn('Carregando dados…');
  try{
    const j = await api({action:'carregar'});
    DB = j.dados; DB._planilha = j.planilha; DB._pasta = j.pasta; DB._versao = j.versao;
    $('#hdEscritorio').textContent = cfg('NOME_ESCRITORIO','Escritório de advocacia');
    const marca = document.getElementById('hdMarca');
    if (marca) marca.title = 'Página ' + VERSAO_APP + ' · servidor ' + (DB._versao || '—');
    render(); pintarNet();
    if (avisar) toast('Dados atualizados.','ok');
  }catch(e){ toast(e.message,'erro'); }
  finally{ carregandoOff(); }
}

/* ── LOGIN ── */
async function entrar(){
  const login = $('#lgUser').value.trim(), senha = $('#lgSenha').value;
  if (!login || !senha){ $('#loginErro').innerHTML = '<div class="erro">Informe usuário e senha.</div>'; return; }
  carregandoOn('Entrando…');
  try{
    const j = await api({action:'login', login, senha});
    USER = j.usuario;
    sessionStorage.setItem('fin_user', JSON.stringify(USER));
    $('#login').style.display = 'none'; $('#app').style.display = 'block';

    if (m.g) return (visiveis[i+1] && !visiveis[i+1].g) ? '<div class="grupo">'+m.g+'</div>' : '';

async function gravarFavorecido(id, antigo){
  const nome = tit(val('fvNome'));
  if (!nome) return toast('Informe o nome do favorecido.','erro');
  if ((DB.FAVORECIDOS||[]).some(f => f.ID !== id && f.NOME.toLowerCase() === nome.toLowerCase()))
    return toast('Já existe um favorecido com esse nome.','erro');
  const lote = [{aba:'FAVORECIDOS', registro:{ID:id||'', NOME:nome, DOC:val('fvDoc'), CATEGORIA:val('fvCat'), ATIVO:val('fvAtivo')}}];
  if (id && antigo && antigo !== nome){
    (DB.CONTAS_PAGAR||[]).filter(c => c.FAVORECIDO === antigo).forEach(c =>
      lote.push({aba:'CONTAS_PAGAR', registro: Object.assign({}, c, {FAVORECIDO:nome})}));
  }
  carregandoOn('Salvando…');
  try{ await salvarLote(lote); abrirConfig('favorecidos'); render(); toast('Favorecido salvo.','ok'); }
  catch(e){ toast(e.message,'erro'); } finally{ carregandoOff(); }
}
/* cadastra na hora, sem sair do formulário que estiver aberto.
   A categoria escolhida no formulário já entra como categoria padrão do favorecido. */
async function addFavorecidoRapido(campoId, campoCat){
  const nome = val(campoId);
  if (!nome) return toast('Digite o nome do favorecido antes de adicionar.','erro');
  const cat = campoCat ? val(campoCat) : '';
  const item = garantirFavorecido(tit(nome), cat);
  if (!item) return toast('"'+nome+'" já está cadastrado.','ok');
  try{
    await salvarLoteRapido([item]);
    const dl = document.getElementById('dlFav');
    if (dl) dl.innerHTML = optsFavorecidos();
    toast('"'+nome+'" cadastrado' + (cat ? ' com a categoria padrão "'+cat+'".' : ' nos favorecidos.'), 'ok');
  }catch(e){}
}
/* devolve o registro a gravar quando o favorecido não existe, ou existe sem categoria padrão */
function garantirFavorecido(nome, categoria){
  const nm = tit(nome);
  if (!nm) return null;
  const f = (DB.FAVORECIDOS||[]).find(x => String(x.NOME).toLowerCase() === nm.toLowerCase());
  if (!f) return {aba:'FAVORECIDOS', registro:{ID:uid('fv'), NOME:nm, DOC:'', CATEGORIA:categoria||'', ATIVO:'SIM'}};
  if (categoria && !String(f.CATEGORIA||'').trim())
    return {aba:'FAVORECIDOS', registro: Object.assign({}, f, {CATEGORIA:categoria})};
  return null;
}
/* ao reconhecer o favorecido digitado, preenche a categoria padrão dele.
   Se o usuário já escolheu a categoria à mão, o preenchimento não sobrescreve. */
function aplicarCategoriaFavorecido(campoNome, campoCat){
  const campo = document.getElementById(campoCat);
  if (!campo || campo.dataset.tocado) return;
  const nome = String(val(campoNome)||'').trim().toLowerCase();
  if (!nome) return;
  const f = (DB.FAVORECIDOS||[]).find(x => String(x.NOME).trim().toLowerCase() === nome);
  if (!f || !f.CATEGORIA) return;
  const existe = [...campo.options].some(o => o.value === f.CATEGORIA);
  if (!existe) campo.add(new Option(f.CATEGORIA + ' (fora do cadastro)', f.CATEGORIA));
  campo.value = f.CATEGORIA;
}

async function gravarConta(id, antigo){

const ehDebitoCat = c => String((c && c.TIPO) || '').trim().toLowerCase().charAt(0) === 'd';
/* categoria de crédito que divide o valor com o cliente */
const catRateia = nome => (DB.SUBCLASSES||[]).some(c => c.NOME === nome && String(c.RATEIO||'').toUpperCase() === 'SIM');
/* grupo de DRE de uma categoria; vazio significa o DRE do escritório */
/* categoria de acordo parcelado: abre os campos do lançamento na conciliação */
const catAcordo = nome => (DB.SUBCLASSES||[]).some(c => c.NOME === nome && String(c.ACORDO||'').toUpperCase() === 'SIM');
const GRUPO_PADRAO = 'Escritório';
const grupoDaCat = nome => {
  const c = (DB.SUBCLASSES||[]).find(x => x.NOME === nome);
  return (c && String(c.GRUPO||'').trim()) || GRUPO_PADRAO;
};
function gruposDRE(){
  const s = new Set([GRUPO_PADRAO]);
  (DB.SUBCLASSES||[]).forEach(c => { const g = String(c.GRUPO||'').trim(); if (g) s.add(g); });
  return [...s];
}
const GRUPOS_SUGERIDOS = ['Receita Dra. Karla','Processos particulares Dra. Karla','Despesa Dra. Karla','Obra'];
function categorias(tipo){
  return (DB.SUBCLASSES||[])
    .filter(c => tipo === 'D' ? ehDebitoCat(c) : !ehDebitoCat(c))
    .map(c => c.NOME)
    .sort((a,b) => String(a).localeCompare(String(b),'pt-BR'));
}
/* lista para um <select>, preservando um valor gravado que já saiu do cadastro */
function opcoesCategorias(tipo, atual, vazio){
  const out = (vazio ? [['', vazio]] : []).concat(categorias(tipo).map(nome => [nome, nome]));
  if (atual && !out.some(o => o[0] === atual)) out.push([atual, atual + ' (fora do cadastro)']);
  return out;
}

async function gravarSubclasse(id, antigo){
  const nome = tit(val('sbNome')); if (!nome) return toast('Informe o nome da categoria.','erro');
  const lote = [{aba:'SUBCLASSES', registro:{ID:id, NOME:nome, TIPO:val('sbTipo'),
    RATEIO: (val('sbTipo').charAt(0).toLowerCase() !== 'd' && val('sbRateio')) ? 'SIM' : '',
    GRUPO: tit(val('sbGrupo')) === GRUPO_PADRAO ? '' : tit(val('sbGrupo')),
    ACORDO: (val('sbTipo').charAt(0).toLowerCase() !== 'd' && val('sbAcordo')) ? 'SIM' : ''}}];
  (DB.REGRAS_COMISSAO||[]).filter(r => r.SUBCLASSE === antigo).forEach(r =>
    lote.push({aba:'REGRAS_COMISSAO', registro: Object.assign({}, r, {SUBCLASSE:nome})}));
  (DB.LANCAMENTOS||[]).filter(l => l.SUBCLASSE === antigo).forEach(l =>
    lote.push({aba:'LANCAMENTOS', registro: Object.assign({}, l, {SUBCLASSE:nome})}));
  (DB.CONTAS_PAGAR||[]).filter(c => c.CATEGORIA === antigo).forEach(c =>
    lote.push({aba:'CONTAS_PAGAR', registro: Object.assign({}, c, {CATEGORIA:nome})}));
  (DB.CONTAS_RECEBER||[]).filter(c => c.CATEGORIA === antigo).forEach(c =>
    lote.push({aba:'CONTAS_RECEBER', registro: Object.assign({}, c, {CATEGORIA:nome})}));
  carregandoOn('Salvando…');
  try{ await salvarLote(lote); abrirConfig('subclasses'); render(); toast('Categoria atualizada.','ok'); }
  catch(e){ toast(e.message,'erro'); } finally{ carregandoOff(); }
}

/* praças de uma regra; lista vazia significa todas */
function pracasDaRegra(r){
  return String((r && r.PRACAS) || '').split('|').map(s => s.trim()).filter(Boolean);
}
/* percentual da regra: usa o próprio da EXEC quando o lançamento foi calculado por ela */
function pctDaRegra(r, usouExec){
  const alt = n(r && r.PCT_EXEC);
  return (usouExec && alt > 0) ? alt : n(r && r.PCT);
}
function regraCobrePraca(r, praca){
  const L = pracasDaRegra(r);
  return !L.length || L.indexOf(String(praca||'').trim()) > -1;
}
let PRACAS_REGRA = [];
function formRegra(id){
  const r = (DB.REGRAS_COMISSAO||[]).find(x => x.ID === id) || {};
  const coms = (DB.COMISSIONADOS||[]).filter(c => c.ATIVO !== 'NAO' || c.ID === r.COMISSIONADO_ID)
    .map(c => [c.ID, c.NOME]);
  const padrao = (DB.COMISSIONADOS||[]).find(c => c.ID === (r.COMISSIONADO_ID || (coms[0]||[])[0]));
  PRACAS_REGRA = pracasDaRegra(r);
  modal(id ? 'Editar regra de comissão' : 'Nova regra de comissão',
    '<div class="grade">'
    + sel('erSub','Categoria (crédito)', opcoesCategorias('C', r.SUBCLASSE), r.SUBCLASSE)
    + sel('erCom','Comissionado', coms, r.COMISSIONADO_ID)
    + inp('erPct','% da comissão', id ? n(r.PCT) : (n(padrao && padrao.PCT_PADRAO) || 5), '', 'number', 'step="0.01"')
    + inp('erPctExec','% da comissão quando usar a EXEC', n(r.PCT_EXEC) > 0 ? n(r.PCT_EXEC) : '', '', 'number', 'step="0.01" placeholder="mesmo %"')
    + '<p class="mini full" style="margin:-4px 0 2px">Em branco, vale o mesmo percentual nos dois casos. Preenchido, o sistema usa este quando o lançamento estiver marcado como calculado pela EXEC — ex.: 33% normal e 31% com EXEC.</p>'
    + inp('erBase','% do escritório usado como base', n(r.PCT_BASE) > 0 ? n(r.PCT_BASE) : '', '', 'number', 'step="0.01" placeholder="em branco"')
    + '<p class="mini full" style="margin:-4px 0 2px">Em branco, a comissão incide sobre o que realmente ficou para o escritório no processo. '
    + 'Preenchido, incide sempre sobre esse percentual do crédito — ex.: 30%, mesmo num processo em que o escritório ficou com 33%.</p>'
    + '<div class="secao-form">Praças em que esta regra vale</div>'
    + '<div class="full" id="boxPracasRegra"></div>'
    + '</div>',
    '<button class="btn sec" onclick="abrirConfig(\'regras\')">Cancelar</button>'
    + '<button class="btn" onclick="gravarRegra(\''+(id||'')+'\')">Salvar regra</button>');
  pintarPracasRegra();
}
function pintarPracasRegra(){
  const box = document.getElementById('boxPracasRegra'); if (!box) return;
  const L = (DB.PRACAS||[]).filter(p => p.ATIVO !== 'NAO').map(p => p.NOME);
  PRACAS_REGRA.forEach(p => { if (L.indexOf(p) < 0) L.push(p); });
  if (!L.length){ box.innerHTML = '<p class="mini">Nenhuma praça cadastrada — a regra valerá para todas.</p>'; return; }
  const todas = PRACAS_REGRA.length === 0;
  box.innerHTML = '<div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">'
    + '<button class="btn sm '+(todas?'':'sec')+'" onclick="marcarPracas(\'todas\')">Todas as praças</button>'
    + '<button class="btn sm sec" onclick="marcarPracas(\'nenhuma\')">Limpar seleção</button></div>'
    + '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px">'
    + L.sort((a,b) => String(a).localeCompare(String(b),'pt-BR')).map(p =>
      '<label style="display:flex;align-items:center;gap:7px;font-size:13px;padding:3px 0">'
      + '<input type="checkbox" style="width:16px;height:16px;accent-color:var(--brand)" '
      + (PRACAS_REGRA.indexOf(p) > -1 ? 'checked ' : '')
      + 'onchange="alternaPraca(this.checked,\''+esc(p).replace(/'/g,"\\'")+'\')">' + esc(p) + '</label>').join('')
    + '</div>'
    + '<p class="mini" style="margin-top:8px">'
    + (todas ? 'Nenhuma marcada: a regra vale para <b>todas</b> as praças.'
             : '<b>'+PRACAS_REGRA.length+'</b> praça(s) marcada(s): a comissão só é gerada nessas.') + '</p>';
}
function alternaPraca(marcado, nome){
  const i = PRACAS_REGRA.indexOf(nome);
  if (marcado && i < 0) PRACAS_REGRA.push(nome);
  if (!marcado && i > -1) PRACAS_REGRA.splice(i,1);
  pintarPracasRegra();
}
function marcarPracas(modo){
  PRACAS_REGRA = modo === 'todas' ? [] : [];
  pintarPracasRegra();
}
async function gravarRegra(id){
  if (!val('erSub') || !val('erCom')) return toast('Escolha a categoria e o comissionado.','erro');
  const repetida = (DB.REGRAS_COMISSAO||[]).some(r => r.ID !== id
    && r.SUBCLASSE === val('erSub') && r.COMISSIONADO_ID === val('erCom')
    && String(r.PRACAS||'') === PRACAS_REGRA.join('|'));
  if (repetida) return toast('Já existe uma regra igual para esse comissionado.','erro');
  const r = (DB.REGRAS_COMISSAO||[]).find(x => x.ID === id) || {};
  await salvar('REGRAS_COMISSAO', Object.assign({}, r, {ID:id||'', SUBCLASSE:val('erSub'),
    COMISSIONADO_ID:val('erCom'), PCT:val('erPct')||'0', PCT_EXEC:val('erPctExec')||'',
    PRACAS:PRACAS_REGRA.join('|'), PCT_BASE:val('erBase')||''}));
  abrirConfig('regras');
}

function espelhaPct(origem){
  const cli = document.getElementById('lcPctCli'), esce = document.getElementById('lcPctEsc');
  if (origem === 1) esce.value = rd(100 - n(cli.value)); else cli.value = rd(100 - n(esce.value));

const AUDIENCIAS = ['Inicial','Una','Instrução','Minuta','Conciliação execução'];
/* a sucumbência é cobrada junto com o acordo: as parcelas dividem o valor total
   e cada uma carrega a fatia proporcional de sucumbência, integral do escritório */
function sucDeCadaParcela(){
  const suc = rd(n(val('lcSuc'))), total = rd(n(val('lcTotal')));
  if (!suc || !total) return PARC_TMP.map(() => 0);
  const partes = PARC_TMP.map(p => rd(suc * n(p.VALOR) / total));
  const dif = rd(suc - partes.reduce((s,v) => s + v, 0));
  if (partes.length) partes[partes.length-1] = rd(partes[partes.length-1] + dif);
  return partes;
}
function recalcParcelas(){
  const qtd = Math.max(1, parseInt(val('lcQtd')) || 1);
  const total = rd(n(val('lcTotal')));
  const prim = val('lcPrim') || hoje();
  const base = total ? rd(total / qtd) : 0;
  const novas = [];
  for (let i=0;i<qtd;i++){
    const ant = PARC_TMP[i];
    if (ant && ant.STATUS === 'Recebida'){ novas.push(ant); continue; }
    const d = new Date(prim + 'T12:00'); d.setMonth(d.getMonth() + i);
    let v = base;
    if (i === qtd-1 && total) v = rd(total - base*(qtd-1));
    novas.push({ID: ant ? ant.ID : '', VENCIMENTO: d.toISOString().slice(0,10), VALOR: v, STATUS:'A receber'});
  }
  PARC_TMP = novas; pintarParcelas();
}
function pintarParcelas(){
  const box = document.getElementById('boxParcelas'); if (!box) return;
  if (!PARC_TMP.length){ box.innerHTML = '<p class="mini">Informe o valor total e a quantidade de parcelas.</p>'; return; }
  const soma = PARC_TMP.reduce((s,p) => s + n(p.VALOR), 0);
  const suc = rd(n(val('lcSuc'))), totalAcordo = rd(n(val('lcTotal')));
  const pctCli = n(val('lcPctCli')), pctEsc = n(val('lcPctEsc'));
  const sucs = sucDeCadaParcela();
  box.innerHTML = '<div class="tw"><table><thead><tr><th>#</th><th>Vencimento</th><th class="num">Valor (R$)</th>'
    + (suc ? '<th class="num">Sucumbência</th><th class="num">Cliente</th><th class="num">Escritório</th>' : '')
    + '<th>Situação</th></tr></thead><tbody>'
    + PARC_TMP.map((p,i) =>
      '<tr><td>'+(i+1)+'</td>'
      + '<td><input type="date" value="'+esc(p.VENCIMENTO)+'" '+(p.STATUS==='Recebida'?'disabled':'')+' onchange="PARC_TMP['+i+'].VENCIMENTO=this.value" style="padding:4px 6px;border:1px solid var(--line);border-radius:4px"></td>'
      + '<td class="num"><input value="'+nMoeda(p.VALOR)+'" '+(p.STATUS==='Recebida'?'disabled':'')+' oninput="PARC_TMP['+i+'].VALOR=n(this.value)" onblur="pintarParcelas()" style="width:110px;text-align:right;padding:4px 6px;border:1px solid var(--line);border-radius:4px;font-family:\'IBM Plex Mono\',monospace"></td>'
      + (suc ? '<td class="num">'+nMoeda(sucs[i])+'</td>'
             + '<td class="num">'+nMoeda(rd((n(p.VALOR)-sucs[i])*pctCli/100))+'</td>'
             + '<td class="num">'+nMoeda(rd(sucs[i] + (n(p.VALOR)-sucs[i])*pctEsc/100))+'</td>' : '')
      + '<td><span class="tag '+(p.STATUS==='Recebida'?'t-ok':'t-pend')+'">'+esc(p.STATUS||'A receber')+'</span></td></tr>').join('')
    + '</tbody><tfoot><tr><th colspan="2" style="text-align:right">Soma das parcelas</th><th class="num">'+nMoeda(soma)+'</th>'
    + (suc ? '<th class="num">'+nMoeda(sucs.reduce((s,v)=>s+v,0))+'</th><th></th><th></th>' : '')
    + '<th></th></tr></tfoot></table></div>'
    + (suc > 0
        ? '<p class="mini" style="margin-top:6px">A sucumbência de <b>'+moeda(suc)+'</b> é cobrada junto com o acordo e '
          + 'se dilui nas parcelas. Em cada parcela ela vai integralmente para o escritório, e só o que sobra é rateado: '
          + 'cliente '+pctCli+'% · escritório '+pctEsc+'%. No acordo todo o escritório fica com <b>'
          + moeda(rd(suc + (totalAcordo-suc)*pctEsc/100))+'</b> e o cliente com <b>'
          + moeda(rd((totalAcordo-suc)*pctCli/100))+'</b>.</p>'
        : '<p class="mini" style="margin-top:6px">Parcelas já recebidas não podem ser alteradas.</p>');
}
async function gravarLanc(id, opcoes){
  const op = opcoes || {};
  if (!val('lcCliente')) return toast('Informe o cliente.','erro');
  if (!PARC_TMP.length) return toast('Gere ao menos uma parcela.','erro');
  const pctCli = n(val('lcPctCli')), pctEsc = n(val('lcPctEsc'));
  if (rd(pctCli + pctEsc) !== 100) return toast('Os percentuais de cliente e escritório devem somar 100%.','erro');

  const lanc = {
    ID: id || uid('l'), PASTA: tit(val('lcPasta')), CLIENTE: tit(val('lcCliente')), DOC: val('lcDoc'),
    N_PROCESSO: val('lcProc'), PRACA: val('lcPraca'), FILIAL: '',
    VALOR_TOTAL: rd(PARC_TMP.reduce((s,p)=>s+n(p.VALOR),0)), QTD_PARCELAS: PARC_TMP.length,
    PCT_CLIENTE: pctCli, PCT_ESCRITORIO: pctEsc,
    TARIFA_ATIVA: val('lcTarifa') ? 'SIM' : 'NAO', TARIFA_VALOR: rd(n(val('lcTarifaV'))),
    SUCUMBENCIA: rd(n(val('lcSuc'))), SUBCLASSE: val('lcSub'), EXEC: val('lcExec') ? 'SIM' : 'NAO',
    OBS: val('lcObs'), STATUS: 'Ativo',
    DATA_ACORDO: val('lcDataAcordo'), AUDIENCIA: val('lcAudiencia'), ADVOGADO: tit(val('lcAdvogado')),
    CRIADO_EM: (id && lancDe(id).CRIADO_EM) || new Date().toISOString().slice(0,16).replace('T',' '),
    CRIADO_POR: (id && lancDe(id).CRIADO_POR) || (USER ? USER.NOME : '')
  };

  const excluirCP = [];
  const sucs = sucDeCadaParcela();
  const lote = [{aba:'LANCAMENTOS', registro:lanc}];
  PARC_TMP.forEach((p,i) => {
    const antiga = p.ID ? parcDe(p.ID) : null;
    if (antiga && antiga.STATUS === 'Recebida') return;
    const parcId = p.ID || uid('p');
    const tarifa = lanc.TARIFA_ATIVA === 'SIM' ? rd(n(lanc.TARIFA_VALOR) || tarifaPadrao()) : 0;
    const vCli = rd((n(p.VALOR) - sucs[i]) * pctCli / 100 - tarifa);
    const cpAntigo = (DB.CONTAS_PAGAR||[]).find(c => c.ID === (antiga||{}).CP_ID)
                  || (DB.CONTAS_PAGAR||[]).find(c => c.PARCELA_ID === parcId && c.CATEGORIA === 'Repasse a cliente');
    const cpId = vCli > 0 ? (cpAntigo ? cpAntigo.ID : uid('cp')) : '';
    lote.push({aba:'PARCELAS', registro: Object.assign({}, antiga || {}, {
      ID: parcId, LANC_ID: lanc.ID, TIPO:'Parcela', NUM: i+1,
      VENCIMENTO: p.VENCIMENTO, VALOR: rd(p.VALOR), STATUS:'A receber',
      DATA_CREDITO:'', VALOR_CREDITADO:'', MOV_ID:'', VALOR_CLIENTE:'', VALOR_ESCRITORIO:'', TARIFA:'',
      CP_ID: cpId, OBS:'', SUCUMBENCIA: sucs[i] || ''
    })});
    // repasse ao cliente já entra em contas a pagar, bloqueado até a conciliação
    if (vCli > 0){
      lote.push({aba:'CONTAS_PAGAR', registro: Object.assign({}, cpAntigo || {}, {
        ID: cpId, DESCRICAO:'Repasse ao cliente — pasta '+(lanc.PASTA||'—')+' · parcela '+(i+1)+'/'+PARC_TMP.length,
        FAVORECIDO: lanc.CLIENTE || '', CATEGORIA:'Repasse a cliente', VENCIMENTO: p.VENCIMENTO, VALOR: vCli,
        STATUS: (cpAntigo && cpAntigo.STATUS) || 'Em aberto', DATA_PGTO: (cpAntigo && cpAntigo.DATA_PGTO) || '',
        ORIGEM:'Repasse de parcela', PARCELA_ID: parcId, ANEXO_URL:'',
        OBS:'Valor previsto sobre a parcela de '+moeda(p.VALOR)+' · '
            + memoriaRateio(n(p.VALOR), lanc, tarifa, sucs[i])
            + ' · aguardando o crédito da parcela'
      })});
    } else if (cpAntigo){
      excluirCP.push({aba:'CONTAS_PAGAR', id: cpAntigo.ID});
    }
  });

  // a sucumbência agora vem dentro das parcelas: a linha separada antiga é removida
  const sucAtual = (DB.PARCELAS||[]).find(p => p.LANC_ID === lanc.ID && p.TIPO === 'Sucumbência');
  const excluir_ = [];
  if (sucAtual && sucAtual.STATUS !== 'Recebida') excluir_.push({aba:'PARCELAS', id: sucAtual.ID});

  // parcelas removidas (redução da quantidade)
  const idsMantidos = new Set(lote.filter(x => x.aba === 'PARCELAS').map(x => x.registro.ID));
  (DB.PARCELAS||[]).filter(p => p.LANC_ID === lanc.ID && p.TIPO !== 'Sucumbência'
      && !idsMantidos.has(p.ID) && p.STATUS !== 'Recebida')
    .forEach(p => {
      excluir_.push({aba:'PARCELAS', id:p.ID});
      const cp = (DB.CONTAS_PAGAR||[]).find(c => c.PARCELA_ID === p.ID && c.CATEGORIA === 'Repasse a cliente');
      if (cp && cp.STATUS !== 'Pago') excluir_.push({aba:'CONTAS_PAGAR', id:cp.ID});
    });
  excluirCP.forEach(x => excluir_.push(x));

  carregandoOn('Salvando lançamento…');
  try{
    await salvarLote(lote);
    if (excluir_.length){
      await api({action:'excluirLote', lote: excluir_});
      const ids = new Set(excluir_.map(e => e.id));
      DB.PARCELAS = (DB.PARCELAS||[]).filter(p => !ids.has(p.ID));
    }
    if (!op.semFechar){
      fecharModal(); render();
      toast('Lançamento salvo. O repasse ao cliente já está em contas a pagar, bloqueado até a conciliação.','ok');
    }
    return lanc;
  }catch(e){ toast(e.message,'erro'); return null; }
  finally{ carregandoOff(); }
}

/* ══════════════════ MONTAGEM DE UM ACORDO ══════════════════
   Usado pela importação de planilha. A sucumbência fica inteira
   com o escritório; o restante é rateado entre cliente e escritório. */
function loteAcordo(d){
  const lancId = uid('l');
  const suc = rd(n(d.sucumbencia));
  const totalAcordo = rd(n(d.valorTotal));
  const base = totalAcordo;                     // as parcelas dividem o acordo inteiro
  const qtd = Math.max(1, parseInt(d.qtd) || 1);
  const vp = n(d.valorParcela) ? rd(n(d.valorParcela)) : rd(base / qtd);
  const pctCli = n(d.pctCli), pctEsc = n(d.pctEsc);
  const tar = d.tarifaAtiva === false ? 0 : rd(n(d.tarifaValor) || tarifaPadrao());
  const lote = [];

  const p0 = new Date((d.primeiro || hoje()) + 'T12:00');
  const parcelas = [];
  for (let i = 0; i < qtd; i++){
    const dt = new Date(p0.getFullYear(), p0.getMonth() + i, 1, 12);
    const ultimo = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
    dt.setDate(Math.min(p0.getDate(), ultimo));
    let v = vp;
    if (i === qtd - 1) v = rd(base - rd(vp * (qtd - 1)));   // a última fecha a conta
    parcelas.push({venc: dt.toISOString().slice(0,10), valor: v});
  }

  lote.push({aba:'LANCAMENTOS', registro:{
    ID:lancId, PASTA:tit(d.pasta), CLIENTE:tit(d.cliente), DOC:'', N_PROCESSO:d.processo || '',
    PRACA:d.praca || '', FILIAL:'', VALOR_TOTAL:totalAcordo, QTD_PARCELAS:parcelas.length,
    PCT_CLIENTE:pctCli, PCT_ESCRITORIO:pctEsc, TARIFA_ATIVA: tar ? 'SIM' : 'NAO', TARIFA_VALOR:tar,
    SUCUMBENCIA:suc, SUBCLASSE:d.categoria || '', EXEC:'NAO', OBS:d.obs || '', STATUS:'Ativo',
    CRIADO_EM:new Date().toISOString().slice(0,16).replace('T',' '), CRIADO_POR:(USER ? USER.NOME : ''),
    DATA_ACORDO:d.dataAcordo || '', AUDIENCIA:d.audiencia || '', ADVOGADO:tit(d.advogado),
    LOTE_IMP:d.loteImp || '', ARQUIVO_IMP:d.arquivoImp || ''}});

  // fatia de sucumbência de cada parcela, proporcional ao valor, com a última fechando a soma
  const sucs = parcelas.map(p => totalAcordo ? rd(suc * n(p.valor) / totalAcordo) : 0);
  if (suc && sucs.length) sucs[sucs.length-1] = rd(sucs[sucs.length-1] + rd(suc - sucs.reduce((s,v)=>s+v,0)));

  parcelas.forEach((p, i) => {
    const parcId = uid('p');
    const vCli = rd((n(p.valor) - sucs[i]) * pctCli / 100 - tar);
    const cpId = vCli > 0 ? uid('cp') : '';
    lote.push({aba:'PARCELAS', registro:{ID:parcId, LANC_ID:lancId, TIPO:'Parcela', NUM:i+1,
      VENCIMENTO:p.venc, VALOR:rd(p.valor), STATUS:'A receber', DATA_CREDITO:'', VALOR_CREDITADO:'',
      MOV_ID:'', VALOR_CLIENTE:'', VALOR_ESCRITORIO:'', TARIFA:'', CP_ID:cpId, OBS:'',
      SUCUMBENCIA: sucs[i] || ''}});
    if (vCli > 0){
      lote.push({aba:'CONTAS_PAGAR', registro:{ID:cpId,
        DESCRICAO:'Repasse ao cliente — pasta ' + (tit(d.pasta) || '—') + ' · parcela ' + (i+1) + '/' + parcelas.length,
        FAVORECIDO:tit(d.cliente), CATEGORIA:'Repasse a cliente', VENCIMENTO:p.venc, VALOR:vCli,
        STATUS:'Em aberto', DATA_PGTO:'', ORIGEM:'Repasse de parcela', PARCELA_ID:parcId, ANEXO_URL:'',
        OBS:'Valor previsto sobre a parcela de ' + moeda(p.valor) + ' · '
            + memoriaRateio(n(p.valor), {PCT_CLIENTE:pctCli, PCT_ESCRITORIO:pctEsc}, tar, sucs[i])
            + ' · aguardando o crédito da parcela'}});
    }
  });

  return lote;
}
/* ══════════════════ CONCILIAÇÃO BANCÁRIA ══════════════════
   Regra do sistema: nada é recebido nem pago manualmente.
   Uma parcela só vira "recebida" e uma conta só vira "paga"
   quando o movimento correspondente do extrato é conciliado.
   ═══════════════════════════════════════════════════════════ */
function pendentesReceber(){
  return (DB.PARCELAS||[]).filter(p => p.STATUS !== 'Recebida');
}
function trechosNum(txt, min){
  const out = new Set();
  (String(txt||'').match(/\d{4,}/g) || []).forEach(s => { if (s.length >= (min||6)) out.add(s); });
  return [...out];
}
const pct = v => { const x = n(v); return (x % 1 === 0 ? String(x) : nMoeda(x)) + '%'; };
/* memória de cálculo do rateio, gravada nas observações da conta a pagar */
function memoriaRateio(valor, l, tarifa, suc){
  const s = rd(n(suc));
  if (s >= rd(valor)) return 'honorários de sucumbência, 100% para o escritório = ' + moeda(valor);
  const base = rd(valor - s);
  const bruCli = rd(base * n(l.PCT_CLIENTE) / 100);
  const bruEsc = rd(base * n(l.PCT_ESCRITORIO) / 100);
  return (s ? 'sucumbência de ' + moeda(s) + ' integral do escritório · rateio sobre ' + moeda(base) + ' · ' : '')
    + pct(l.PCT_CLIENTE) + ' para o cliente = ' + moeda(bruCli)
    + (tarifa ? ', menos a tarifa de ' + moeda(tarifa) + ' revertida ao escritório' : '')
    + ', total para o cliente ' + moeda(rd(bruCli - tarifa))
    + ' · ' + pct(l.PCT_ESCRITORIO) + ' para o escritório = ' + moeda(bruEsc)
    + (tarifa ? ', mais a tarifa de ' + moeda(tarifa) : '')
    + ', total para o escritório ' + moeda(rd(s + bruEsc + tarifa));
}
/* parte da sucumbência que cabe a uma parcela, proporcional ao valor dela */
function sucDaParcela(p, valorCreditado){
  const s = n(p.SUCUMBENCIA);
  if (!s) return 0;
  const v = n(valorCreditado), base = n(p.VALOR);
  return (v && base && Math.abs(v - base) > 0.01) ? rd(s * v / base) : rd(s);
}
/* candidatos para um crédito na conta: parcelas em aberto e recebimentos avulsos */
function candidatosCredito(){
  const out = [];
  pendentesReceber().forEach(p => {
    const l = lancDe(p.LANC_ID);
    out.push({ tipo:'parcela', id:p.ID, valor:n(p.VALOR), venc:p.VENCIMENTO,
      titulo:l.CLIENTE || '—', sub:p.TIPO + (p.NUM>0?' '+p.NUM:''),
      detalhe:'Pasta ' + (l.PASTA||'—') + ' · proc. ' + (l.N_PROCESSO||'—'),
      doc:l.DOC, proc:l.N_PROCESSO, nome:l.CLIENTE, pasta:l.PASTA });
  });
  (DB.CONTAS_RECEBER||[]).filter(c => c.STATUS !== 'Recebido').forEach(c => {
    out.push({ tipo:'receber', id:c.ID, valor:n(c.VALOR), venc:c.VENCIMENTO,
      titulo:c.CLIENTE || c.DESCRICAO || '—', sub:c.CATEGORIA || 'Avulso',
      detalhe:c.DESCRICAO || '', doc:'', proc:'', nome:c.CLIENTE, pasta:'' });
  });
  return out;
}
/* candidatos para um débito na conta: contas a pagar em aberto e já liberadas */
function candidatosDebito(){
  // contas sem valor (boleto ainda não recebido) não entram como sugestão
  return (DB.CONTAS_PAGAR||[]).filter(c => c.STATUS !== 'Pago' && n(c.VALOR) > 0 && liberacao(c).tipo !== 'nao').map(c => ({
    tipo:'pagar', id:c.ID, valor:n(c.VALOR), venc:c.VENCIMENTO,
    titulo:c.FAVORECIDO || c.DESCRICAO || '—', sub:c.CATEGORIA || '',
    detalhe:c.DESCRICAO || '', doc:'', proc:'', nome:c.FAVORECIDO, pasta:'' }));
}
const ehDebito = mov => n(mov.VALOR) < 0;

function sugestoes(mov, ignorarData){
  const desc = String(mov.IDENTIFICACAO||''), descNum = digitos(desc), vm = Math.abs(n(mov.VALOR));
  const res = [];
  (ehDebito(mov) ? candidatosDebito() : candidatosCredito()).forEach(c => {
    let s = 0; const por = [];
    const dif = Math.abs(c.valor - vm);
    // acima de R$ 1,00 de diferença o registro nem é sugerido
    if (dif > 1) return;
    if (dif <= 0.01){ s += 50; por.push('valor idêntico'); }
    else { s += 28; por.push('valor próximo (dif. '+moeda(dif)+')'); }

    const doc = digitos(c.doc);
    if (doc.length >= 11 && descNum.includes(doc)){ s += 40; por.push('CNPJ/CPF do cliente na descrição'); }

    const proc = digitos(c.proc);
    if (proc.length >= 6){
      const achou = trechosNum(desc, 6).some(t => proc.includes(t) || t.includes(proc.slice(0,9)));
      if (achou){ s += 45; por.push('número do processo (parcial) na descrição'); }
    }
    const nomes = String(c.nome||'').toUpperCase().split(/\s+/).filter(w => w.length > 3);
    if (nomes.length && nomes.some(w => desc.toUpperCase().includes(w))){ s += 15; por.push('nome na descrição'); }
    if (c.pasta && desc.toUpperCase().includes(String(c.pasta).toUpperCase())){ s += 20; por.push('pasta na descrição'); }

    if (!ignorarData){
      const d = diasEntre(c.venc, mov.DATA);
      if (d <= 3){ s += 12; por.push('vencimento na mesma semana'); }
      else if (d <= 15){ s += 6; }
    }
    if (s > 0) res.push({c, score:s, por});
  });
  return res.sort((a,b) => b.score - a.score).slice(0,6);
}
let SUG_ABERTAS = new Set();
function alternarSugestoes(id){
  if (SUG_ABERTAS.has(id)) SUG_ABERTAS.delete(id); else SUG_ABERTAS.add(id);
  render();
}
function boxSugestoes(mov, ignorarData, vazioTxt){
  const sg = sugestoes(mov, ignorarData);
  const deb = ehDebito(mov);
  if (!sg.length) return '<p class="mini">'
    + esc(vazioTxt || (deb ? 'Nenhuma conta a pagar em aberto compatível com este débito.'
                           : 'Sem correspondência em contas a receber.')) + '</p>';
  const abertas = SUG_ABERTAS.has(mov.ID);
  const mostra = abertas ? sg : sg.slice(0, 3);
  return mostra.map(x => {
    const det = [x.c.sub, 'venc. ' + dataBR(x.c.venc), x.c.detalhe, x.por.join('; ')].filter(Boolean).join(' · ');
    return '<div class="sug"><div class="info" title="'+esc(det)+'">'
      + '<b>'+esc(x.c.titulo)+'</b><span class="num">'+moeda(x.c.valor)+'</span>'
      + '<span class="det">'+esc(det)+'</span></div>'
      + '<span class="score '+(x.score>=80?'alto':x.score<40?'baixo':'')+'">'+x.score+'</span>'
      + '<button class="btn sm ok" onclick="conciliar(\''+mov.ID+'\',\''+x.c.id+'\')">Conciliar</button></div>';
  }).join('')
    + (sg.length > 3
        ? '<button class="maisSug" onclick="alternarSugestoes(\''+mov.ID+'\')">'
          + (abertas ? 'mostrar menos' : 'mais ' + (sg.length - 3) + ' sugestão(ões)') + '</button>'
        : '');
}

function telaConciliacao(){
  const sub = SUB || 'pendentes';
  const conta = FILTROS.fConta || '';

  const pend = M.filter(m => m.STATUS === 'Pendente');
  const naoId = M.filter(m => m.STATUS === 'Nao identificado');
  const conc = M.filter(m => m.STATUS === 'Conciliado');
  const dup = duplicidades(M);

  const topo = cabec('Conciliação bancária',
      'Recebimentos e pagamentos só se efetivam aqui. Nada é baixado manualmente.',
      '<button class="btn" onclick="formImportar()">Importar extrato</button>'
    + '<button class="btn sec" onclick="historicoImportacoes()">Histórico de importações</button>'
    + '<button class="btn sec" onclick="abrirConfig(\'contas\')">Contas bancárias</button>')
    + ((DB.CONTAS_BANCO||[]).length

          + '<div class="campo" style="min-width:0"><label>&nbsp;</label>'
          + '<button class="btn sec" onclick="abrirConfig(\'contas\')">Adicionar conta</button></div></div>'
        : '<div class="card" style="border-left:3px solid var(--brass)"><div class="corpo">'
          + '<b>Nenhuma conta bancária cadastrada.</b> <span class="mini">Cadastre as contas do escritório para separar os extratos e filtrar a conciliação por conta.</span> '
          + '<button class="btn sm" onclick="abrirConfig(\'contas\')">Cadastrar conta</button></div></div>')
    + (naoId.length
        ? '<div class="card" style="border-left:3px solid var(--brass)"><div class="corpo">'
          + '<b>'+naoId.length+' depósito(s) não identificado(s).</b> '
          + '<span class="mini">Ficam agora em contas recebidas.</span> '
          + '<button class="btn sm sec" onclick="irPara(\'recebidas\',\'naoid\')">Abrir</button></div></div>'
        : '')
    + subtabs([['pendentes','Pendentes ('+pend.length+')'],
               ['conciliados','Conciliados ('+conc.length+')'],
               ['divergencias','Duplicidades e divergências ('+dup.length+')']]);

  if (sub === 'pendentes') return topo + listaPendentes(pend);
  if (sub === 'conciliados') return topo + listaConciliados(conc);
  return topo + listaDivergencias(dup);
}
function kpi(rot, val, sub, cls){
  return '<div class="kpi '+(cls||'d')+'"><div class="rot">'+esc(rot)+'</div><div class="val">'+esc(String(val))+'</div><div class="sub">'+esc(sub||'')+'</div></div>';
}
function duplicidades(M){
  const mapa = {}, out = [];
  M.forEach(m => {
    const k = (m.BANCO||'') + '|' + m.DATA + '|' + rd(m.VALOR) + '|' + String(m.IDENTIFICACAO||'').slice(0,40).toUpperCase();
    (mapa[k] = mapa[k] || []).push(m);
  });
  Object.values(mapa).forEach(g => { if (g.length > 1) out.push(...g); });
  return out;
}

/* descreve o destino de um movimento já conciliado */
function alvoDe(mov){
  const id = mov.PARCELA_ID;
  const p = parcDe(id);
  if (p){ const l = lancDe(p.LANC_ID);
    return {tipo:'parcela', p, l, quem:pastaCliente(l.PASTA, l.CLIENTE),
            cli:n(p.VALOR_CLIENTE), esc:n(p.VALOR_ESCRITORIO)}; }
  const cp = (DB.CONTAS_PAGAR||[]).find(x => x.ID === id);
  if (cp) return {tipo:'pagar', cp, quem:'<b>'+esc(cp.FAVORECIDO||cp.DESCRICAO||'—')+'</b>'
            + '<div class="mini">'+esc(cp.CATEGORIA||'')+'</div>', cli:0, esc:0};
  const cr = (DB.CONTAS_RECEBER||[]).find(x => x.ID === id);
  if (cr) return {tipo:'receber', cr,
    quem: cr.PASTA ? pastaCliente(cr.PASTA, cr.CLIENTE) : '<b>'+esc(cr.CLIENTE||cr.DESCRICAO||'—')+'</b>',
    cli:n(cr.VALOR_CLIENTE), esc:n(cr.VALOR_ESCRITORIO) || n(cr.VALOR)};
  return {tipo:'', quem:'<span class="mini">—</span>', cli:0, esc:0};
}
function listaConciliados(L){
  const t = (FILTROS.busca||'').toLowerCase();
  const de = FILTROS.cnDe || '', ate = FILTROS.cnAte || '';
  const vmin = FILTROS.cnMin, vmax = FILTROS.cnMax;
  const F = L
    .filter(m => !de || String(m.DATA) >= de)
    .filter(m => !ate || String(m.DATA) <= ate)
    .filter(m => { const v = Math.abs(n(m.VALOR)); return (!vmin || v >= n(vmin)) && (!vmax || v <= n(vmax)); })
    .filter(m => { if (!t) return true;
      const a = alvoDe(m);
      const quem = a.tipo === 'parcela' ? [a.l.CLIENTE, a.l.PASTA].join(' ')
                 : a.tipo === 'pagar' ? [a.cp.FAVORECIDO, a.cp.DESCRICAO].join(' ')
                 : a.tipo === 'receber' ? [a.cr.CLIENTE, a.cr.DESCRICAO].join(' ') : '';
      return (String(m.IDENTIFICACAO||'') + ' ' + quem).toLowerCase().includes(t); })
    .sort((a,b) => String(b.DATA).localeCompare(String(a.DATA)));
  const filtros = '<div class="filtros">' + campoBusca('Identificação, cliente, favorecido…')
    + '<div class="campo"><label for="cnDe">De</label><input type="date" id="cnDe" value="'+esc(de)+'" onchange="setF(\'cnDe\',this.value)"></div>'
    + '<div class="campo"><label for="cnAte">Até</label><input type="date" id="cnAte" value="'+esc(ate)+'" onchange="setF(\'cnAte\',this.value)"></div>'
    + '<div class="campo"><label for="cnMin">Valor de</label><input id="cnMin" value="'+esc(vmin||'')+'" placeholder="0,00" onchange="setF(\'cnMin\',this.value)"></div>'
    + '<div class="campo"><label for="cnMax">Valor até</label><input id="cnMax" value="'+esc(vmax||'')+'" placeholder="0,00" onchange="setF(\'cnMax\',this.value)"></div>'
    + '<div class="campo" style="min-width:0"><label>&nbsp;</label><button class="btn sec" onclick="limparFiltrosConc()">Limpar</button></div>'
    + '</div>';
  if (!F.length) return filtros + '<div class="card">'
    + vazio('Nada conciliado neste filtro','Ajuste as datas, o valor ou a busca — ou confirme os vínculos na aba de pendentes.')+'</div>';
  return filtros + '<div class="card"><div class="tw"><table class="densa">'
    + '<thead><tr><th>Data</th><th>Identificação</th><th class="num">Valor</th><th>Baixou</th>'
    + '<th class="num">Cliente</th><th class="num">Escritório</th><th></th></tr></thead><tbody>'
    + F.map(m => { const a = alvoDe(m);
        return '<tr>' + linhaMov(m) + '<td>'+a.quem+'</td>'
          + '<td class="num">'+(a.cli?nMoeda(a.cli):'—')+'</td><td class="num">'+(a.esc?nMoeda(a.esc):'—')+'</td>'
          + '<td style="text-align:right"><button class="btn sm sec" onclick="desfazer(\''+m.ID+'\')">Desfazer</button></td></tr>'; }).join('')
    + '</tbody></table></div></div>';
}

/* ── Conciliar ── */
async function conciliar(movId, alvoId){
  const m = (DB.EXTRATO||[]).find(x => x.ID === movId);
  if (!m) return toast('Movimento não encontrado.','erro');
  const p = parcDe(alvoId);
  const cp = (DB.CONTAS_PAGAR||[]).find(x => x.ID === alvoId);
  const cr = (DB.CONTAS_RECEBER||[]).find(x => x.ID === alvoId);
  if (p) return conciliarParcela(m, p);
  if (cp) return conciliarPagamento(m, cp);
  if (cr) return conciliarRecebimento(m, cr);
  toast('Registro de destino não encontrado.','erro');
}

async function conciliarParcela(m, p){
  const l = lancDe(p.LANC_ID);
  const valor = Math.abs(n(m.VALOR));
  const suc = p.TIPO === 'Sucumbência';
  const sucP = suc ? valor : sucDaParcela(p, valor);          // fatia de sucumbência desta parcela
  const rateavel = rd(valor - sucP);
  const tarifa = (!suc && l.TARIFA_ATIVA !== 'NAO') ? rd(n(l.TARIFA_VALOR) || tarifaPadrao()) : 0;
  // base de comissão = parte do escritório SEM a tarifa; a tarifa sai do cliente e entra no escritório
  const baseCom = rd(sucP + rateavel * n(l.PCT_ESCRITORIO) / 100);
  const vEsc = rd(baseCom + tarifa);
  const vCli = rd(rateavel * n(l.PCT_CLIENTE) / 100 - tarifa);

  const lote = [];
  const cpAntigo = (DB.CONTAS_PAGAR||[]).find(c => c.ID === p.CP_ID)
                || (DB.CONTAS_PAGAR||[]).find(c => c.PARCELA_ID === p.ID && c.CATEGORIA === 'Repasse a cliente');
  const cpId = vCli > 0 ? (cpAntigo ? cpAntigo.ID : uid('cp')) : '';

  lote.push({aba:'PARCELAS', registro: Object.assign({}, p, {
    STATUS:'Recebida', DATA_CREDITO:m.DATA, VALOR_CREDITADO:valor, MOV_ID:m.ID,
    VALOR_CLIENTE:vCli, VALOR_ESCRITORIO:vEsc, TARIFA:tarifa, CP_ID:cpId })});
  lote.push({aba:'EXTRATO', registro: Object.assign({}, m, {STATUS:'Conciliado', PARCELA_ID:p.ID})});

  if (vCli > 0){
    // o repasse já existe desde o lançamento: aqui ele é liberado e ajustado ao valor creditado
    lote.push({aba:'CONTAS_PAGAR', registro: Object.assign({}, cpAntigo || {}, {
      ID:cpId, DESCRICAO:(cpAntigo && cpAntigo.DESCRICAO) || ('Repasse ao cliente — pasta '+(l.PASTA||'—')+(p.NUM>0?' · parcela '+p.NUM:'')),
      FAVORECIDO:l.CLIENTE||'', CATEGORIA:'Repasse a cliente', VENCIMENTO:m.DATA, VALOR:vCli,
      STATUS:(cpAntigo && cpAntigo.STATUS) || 'Em aberto', DATA_PGTO:(cpAntigo && cpAntigo.DATA_PGTO) || '',
      ORIGEM:'Repasse de parcela', PARCELA_ID:p.ID, ANEXO_URL:(cpAntigo && cpAntigo.ANEXO_URL) || '',
      OBS:'Liberado — crédito de '+moeda(valor)+' conciliado em '+dataBR(m.DATA)
          +' · '+memoriaRateio(valor, l, tarifa, sucP) })});
  }
  (DB.REGRAS_COMISSAO||[])
    .filter(r => r.SUBCLASSE && r.SUBCLASSE === l.SUBCLASSE)
    .filter(r => regraCobrePraca(r, l.PRACA))
    .forEach(r => {
      // base própria: % fixo do crédito, independente do rateio do processo
      const base = n(r.PCT_BASE) > 0 ? rd(valor * n(r.PCT_BASE) / 100) : baseCom;
      const pctAplicado = pctDaRegra(r, l.EXEC === 'SIM');
      const v = rd(base * pctAplicado / 100);
      if (v <= 0) return;
      lote.push({aba:'COMISSOES', registro:{ ID:uid('co'), PARCELA_ID:p.ID, LANC_ID:l.ID, CLIENTE:l.CLIENTE||'',
        COMISSIONADO_ID:r.COMISSIONADO_ID, BASE:base, PCT:pctAplicado, VALOR:v, STATUS:'A pagar', DATA:m.DATA, CP_ID:'' }});
    });

  try{
    await salvarLoteRapido(lote);
    toast('Recebimento conciliado e salvo. ' + (vCli > 0 ? moeda(vCli)+' liberado para o cliente · '+moeda(vEsc)+' para o escritório.'
                                                         : 'Valor integral do escritório.'), 'ok');
  }catch(e){}
}

async function conciliarPagamento(m, cp){
  if (liberacao(cp).tipo === 'nao')
    return toast('A parcela deste cliente ainda não foi conciliada. Concilie o crédito antes de baixar o pagamento.','erro');
  const valor = Math.abs(n(m.VALOR));
  const lote = [
    {aba:'CONTAS_PAGAR', registro: Object.assign({}, cp, {STATUS:'Pago', DATA_PGTO:m.DATA, VALOR:valor,
      OBS:'Pago pelo débito de '+moeda(valor)+' conciliado em '+dataBR(m.DATA)})},
    {aba:'EXTRATO', registro: Object.assign({}, m, {STATUS:'Conciliado', PARCELA_ID:cp.ID})}
  ];
  (DB.COMISSOES||[]).filter(c => c.CP_ID === cp.ID).forEach(c =>
    lote.push({aba:'COMISSOES', registro: Object.assign({}, c, {STATUS:'Paga'})}));
  try{ await salvarLoteRapido(lote); toast('Pagamento de '+moeda(valor)+' baixado e salvo.','ok'); }catch(e){}
}

async function conciliarRecebimento(m, cr){
  const valor = Math.abs(n(m.VALOR));
  const lote = [
    {aba:'CONTAS_RECEBER', registro: Object.assign({}, cr, {STATUS:'Recebido', DATA_RECEB:m.DATA, VALOR:valor,
      OBS:'Recebido pelo crédito conciliado em '+dataBR(m.DATA)})},
    {aba:'EXTRATO', registro: Object.assign({}, m, {STATUS:'Conciliado', PARCELA_ID:cr.ID})}
  ];
  comissoesDoRecebimento(cr, valor, m.DATA).forEach(c => lote.push(c));
  try{ await salvarLoteRapido(lote); toast('Recebimento de '+moeda(valor)+' conciliado e salvo.','ok'); }catch(e){}
}
/* comissões do recebimento avulso: mesmas regras das parcelas — categoria, praça e o % próprio da EXEC */
function comissoesDoRecebimento(cr, valor, data){
  const baseCom = rd((n(cr.VALOR_ESCRITORIO) || 0) - n(cr.TARIFA));
  if (baseCom <= 0) return [];
  return (DB.REGRAS_COMISSAO||[])
    .filter(r => r.SUBCLASSE && r.SUBCLASSE === cr.CATEGORIA)
    .filter(r => regraCobrePraca(r, cr.PRACA))
    .map(r => {
      const base = n(r.PCT_BASE) > 0 ? rd(n(valor) * n(r.PCT_BASE) / 100) : baseCom;
      const pctAplicado = pctDaRegra(r, cr.EXEC === 'SIM');
      const v = rd(base * pctAplicado / 100);
      if (v <= 0) return null;
      return {aba:'COMISSOES', registro:{ ID:uid('co'), PARCELA_ID:cr.ID, LANC_ID:'', CLIENTE:cr.CLIENTE||'',
        COMISSIONADO_ID:r.COMISSIONADO_ID, BASE:base, PCT:pctAplicado, VALOR:v,
        STATUS:'A pagar', DATA:data, CP_ID:'' }};
    }).filter(Boolean);
}

/* ── Desfazer ── */
async function desfazer(movId){
  const m = (DB.EXTRATO||[]).find(x => x.ID === movId); if (!m) return;
  const a = alvoDe(m);
  const apagar = [], lote = [];

  if (a.tipo === 'parcela'){
    const p = a.p, l = a.l;
    const cp = (DB.CONTAS_PAGAR||[]).find(c => c.ID === p.CP_ID || (c.PARCELA_ID === p.ID && c.CATEGORIA === 'Repasse a cliente'));
    if (cp && cp.STATUS === 'Pago')
      return toast('O repasse ao cliente já foi pago. Desfaça primeiro a conciliação desse pagamento.','erro');
    if (!confirm('Desfazer? A parcela volta para contas a receber, o repasse ao cliente volta a ficar bloqueado e as comissões geradas são removidas.')) return;
    if (cp){
      const tar = (p.TIPO !== 'Sucumbência' && l.TARIFA_ATIVA !== 'NAO') ? rd(n(l.TARIFA_VALOR) || tarifaPadrao()) : 0;
      const rate = rd(n(p.VALOR) - (p.TIPO === 'Sucumbência' ? n(p.VALOR) : n(p.SUCUMBENCIA)));
      lote.push({aba:'CONTAS_PAGAR', registro: Object.assign({}, cp, {
        VENCIMENTO:p.VENCIMENTO, VALOR:rd(rate * n(l.PCT_CLIENTE) / 100 - tar),
        STATUS:'Em aberto', DATA_PGTO:'',
        OBS:'Valor previsto sobre a parcela de '+moeda(p.VALOR)+' · '
            +memoriaRateio(n(p.VALOR), l, tar, p.TIPO === 'Sucumbência' ? n(p.VALOR) : n(p.SUCUMBENCIA))
            +' · aguardando o crédito da parcela' })});
    }
    (DB.COMISSOES||[]).filter(c => c.PARCELA_ID === p.ID && c.STATUS !== 'Paga')
      .forEach(c => apagar.push({aba:'COMISSOES', id:c.ID}));
    lote.push({aba:'PARCELAS', registro: Object.assign({}, p, {STATUS:'A receber', DATA_CREDITO:'', VALOR_CREDITADO:'',
      MOV_ID:'', VALOR_CLIENTE:'', VALOR_ESCRITORIO:'', TARIFA:''})});

  } else if (a.tipo === 'pagar'){
    if (!confirm('Desfazer a baixa deste pagamento? A conta volta para "em aberto".')) return;
    lote.push({aba:'CONTAS_PAGAR', registro: Object.assign({}, a.cp, {STATUS:'Em aberto', DATA_PGTO:'',
      OBS:'Baixa desfeita em '+dataBR(hoje())})});
    (DB.COMISSOES||[]).filter(c => c.CP_ID === a.cp.ID).forEach(c =>
      lote.push({aba:'COMISSOES', registro: Object.assign({}, c, {STATUS:'Enviada'})}));

  } else if (a.tipo === 'receber'){
    if (!confirm('Desfazer? A conta volta para contas a receber e as comissões geradas são removidas.')) return;
    lote.push({aba:'CONTAS_RECEBER', registro: Object.assign({}, a.cr, {STATUS:'Em aberto', DATA_RECEB:''})});
    (DB.COMISSOES||[]).filter(c => c.PARCELA_ID === a.cr.ID && c.STATUS !== 'Paga')
      .forEach(c => apagar.push({aba:'COMISSOES', id:c.ID}));

  } else if (!confirm('Este movimento não aponta para nenhum registro. Voltar para pendentes?')) return;

  lote.push({aba:'EXTRATO', registro: Object.assign({}, m, {STATUS:'Pendente', PARCELA_ID:''})});
  try{
    if (apagar.length){
      apagar.forEach(x => { DB[x.aba] = (DB[x.aba]||[]).filter(y => y.ID !== x.id); });
      await api({action:'excluirLote', lote:apagar});
    }
    await salvarLoteRapido(lote);
    toast('Conciliação desfeita.','ok');
  }catch(e){}
}

function escolherManual(movId){

    .sort((a,b) => String(a.venc).localeCompare(String(b.venc)))

  if (!ops.length) return toast(deb ? 'Não há contas a pagar liberadas para vincular.' : 'Não há parcelas em aberto para vincular.','erro');

    + sel('mnParc', deb ? 'Conta a pagar em aberto' : 'Registro em aberto', ops, '', 'full')
    + '<p class="mini">'+(deb ? 'A conta é baixada com o valor e a data do débito.'
        : 'O rateio usa os percentuais do lançamento, mesmo que o crédito seja diferente do valor da parcela.')+'</p>',
    '<button class="btn sec" onclick="fecharModal()">Cancelar</button>'
    + '<button class="btn ok" onclick="const p=val(\'mnParc\');fecharModal();conciliar(\''+movId+'\',p)">Conciliar</button>',
    'estreita');

/* Lança uma conta a pagar (débito) ou um recebimento (crédito) direto na conciliação
   e já concilia o movimento com ele. Em categorias que dividem com o cliente,
   pede o rateio e monta o repasse em contas a pagar. */
function formNovoNaConciliacao(movId){
  const m = (DB.EXTRATO||[]).find(x => x.ID === movId); if (!m) return;
  const deb = ehDebito(m);

/* a tarifa sai da parte do cliente e entra na do escritório, como nas parcelas de acordo */
function tarifaDoRateio(){
  return val('ncTarifaOn') ? rd(n(val('ncTarifaV'))) : 0;
}
function sincronizaRateio(origem){
  const total = rd(n(val('ncValor')));
  const eEsc = document.getElementById('ncEsc'), eCli = document.getElementById('ncCli');
  if (!eEsc || !eCli) return;
  if (origem === 'esc') eCli.value = nMoeda(rd(total - n(eEsc.value)));
  else if (origem === 'cli') eEsc.value = nMoeda(rd(total - n(eCli.value)));
  const cli = rd(n(eCli.value)), esc = rd(n(eEsc.value));
  const tar = tarifaDoRateio();
  const escF = rd(esc + tar), cliF = rd(cli - tar);
  const campoTar = document.getElementById('ncTarifaV');
  if (campoTar) campoTar.disabled = !val('ncTarifaOn');

  const aviso = document.getElementById('avisoRateio');
  if (aviso) aviso.innerHTML = 'Total do crédito: <b>'+moeda(total)+'</b> — escritório <b>'+pctSobre(esc, total)+'</b> = '+moeda(esc)
    + (tar ? ' + tarifa = <b>'+moeda(escF)+'</b>' : '')
    + ' · cliente <b>'+pctSobre(cli, total)+'</b> = '+moeda(cli)
    + (tar ? ' − tarifa = <b>'+moeda(cliF)+'</b>' : '')
    + (tar ? '<br>Tarifa de '+moeda(tar)+' deduzida do cliente e revertida ao escritório.' : '')
    + (escF < 0 || cliF < 0 ? ' <span class="neg">— um dos lados ficou negativo</span>' : '');

  const rep = document.getElementById('boxRepasse');
  if (rep){
    rep.style.display = cliF > 0 ? 'block' : 'none';
    const campoValor = document.getElementById('rpValor');
    if (campoValor && document.activeElement !== campoValor) campoValor.value = nMoeda(cliF);
  }
}

async function gravarNovoNaConciliacao(movId){
  const m = (DB.EXTRATO||[]).find(x => x.ID === movId); if (!m) return;
  const deb = ehDebito(m);
  if (!val('ncDesc')) return toast('Informe a descrição.','erro');
  const valor = rd(n(val('ncValor')));
  if (!valor) return toast('Informe o valor.','erro');
  const id = uid(deb ? 'cp' : 'cr');
  const lote = [];

  if (deb){
    const fav = garantirFavorecido(tit(val('ncQuem')), val('ncCat'));
    if (fav) lote.push(fav);
    lote.push({aba:'CONTAS_PAGAR', registro:{ID:id, DESCRICAO:tit(val('ncDesc')), FAVORECIDO:tit(val('ncQuem')),
      CATEGORIA:val('ncCat'), VENCIMENTO:val('ncVenc'), VALOR:valor, STATUS:'Em aberto', DATA_PGTO:'',
      ORIGEM:'Lançado na conciliação', PARCELA_ID:'', ANEXO_URL:'', OBS:val('ncObs')}});
  } else if (catAcordo(val('ncCat'))){
    espelharCamposAcordo();
    const lanc = await gravarLanc('', {semFechar:true});
    if (!lanc) return;
    const ps = (DB.PARCELAS||[]).filter(p => p.LANC_ID === lanc.ID && p.STATUS !== 'Recebida')
      .sort((a,b) => String(a.VENCIMENTO).localeCompare(String(b.VENCIMENTO)));
    const alvo = ps.find(p => Math.abs(n(p.VALOR) - valor) <= 1) || ps[0];
    fecharModal();
    if (!alvo) return toast('Lançamento salvo, mas não há parcela para conciliar.','erro');
    return conciliar(movId, alvo.ID);

  } else {
    const rateia = catRateia(val('ncCat'));
    const tar = rateia ? tarifaDoRateio() : 0;
    const escBruto = rateia ? rd(n(val('ncEsc'))) : valor;
    const cliBruto = rateia ? rd(n(val('ncCli'))) : 0;
    const esc = rd(escBruto + tar), cli = rd(cliBruto - tar);
    if (rateia){
      if (Math.abs(rd(escBruto + cliBruto) - valor) > 0.01)
        return toast('A soma do escritório com o cliente ('+moeda(rd(escBruto+cliBruto))+') tem que fechar com o valor do crédito ('+moeda(valor)+').','erro');
      if (esc < 0 || cli < 0) return toast('Com a tarifa, um dos lados ficou negativo. Revise os valores.','erro');
    }
    const dadosCR = {DESCRICAO:tit(val('ncDesc')), CLIENTE:tit(val('ncQuem')), PASTA:tit(val('ncPasta')),
      PRACA:val('ncPraca'), FILIAL:'', EXEC: val('ncExec') ? 'SIM' : 'NAO'};
    let cpId = '';
    if (cli > 0){
      const vRep = rd(n(val('rpValor'))) || cli;
      if (!val('rpFav')) return toast('Informe o favorecido do repasse ao cliente.','erro');
      cpId = uid('cp');
      const favRep = garantirFavorecido(tit(val('rpFav')), val('rpCat') || 'Repasse a cliente');
      // o vínculo com o recebimento fica no CP_ID da conta a receber, gravada logo abaixo
      if (favRep) lote.push(favRep);
      lote.push({aba:'CONTAS_PAGAR', registro:{ID:cpId,
        DESCRICAO: descricaoRepasse(dadosCR),
        FAVORECIDO:tit(val('rpFav')), CATEGORIA:val('rpCat') || 'Repasse a cliente', VENCIMENTO:val('rpVenc') || m.DATA,
        VALOR:vRep, STATUS:'Em aberto', DATA_PGTO:'', ORIGEM:'Repasse de recebimento', PARCELA_ID:id, ANEXO_URL:'',
        OBS: (val('rpObs') ? val('rpObs') + ' · ' : '')
             + obsRepasse(dadosCR, valor, esc, cli, tar, m.DATA)}});
    }
    lote.push({aba:'CONTAS_RECEBER', registro: Object.assign({}, dadosCR, {ID:id,
      CATEGORIA:val('ncCat'), VENCIMENTO:val('ncVenc'), VALOR:valor, STATUS:'Em aberto', DATA_RECEB:'',
      ORIGEM:'Lançado na conciliação', ANEXO_URL:'', OBS:val('ncObs'),
      VALOR_ESCRITORIO:esc, VALOR_CLIENTE:cli, CP_ID:cpId, TARIFA:tar})});
  }

  fecharModal();
  try{
    await salvarLoteRapido(lote);
    await conciliar(movId, id);
  }catch(e){}
}

/* movimentos antigos não têm lote: são agrupados pela data e conta da importação */
const chaveLote = m => m.LOTE || ('antigo|' + (m.IMPORTADO_EM||'') + '|' + (m.BANCO||''));
function lotesImportados(){
  const mapa = {};
  (DB.EXTRATO||[]).forEach(m => {
    const k = chaveLote(m);
    const g = mapa[k] || (mapa[k] = { chave:k, arquivo:m.ARQUIVO || '', banco:m.BANCO || '',
      quando:m.IMPORTADO_EM || '', movs:[] });
    g.movs.push(m);
    if (m.ARQUIVO && !g.arquivo) g.arquivo = m.ARQUIVO;
  });
  return Object.values(mapa).map(g => {
    g.total = g.movs.reduce((s,m) => s + n(m.VALOR), 0);
    g.conciliados = g.movs.filter(m => m.STATUS === 'Conciliado').length;
    g.pendentes = g.movs.filter(m => m.STATUS === 'Pendente').length;
    g.naoId = g.movs.filter(m => m.STATUS === 'Nao identificado').length;
    const datas = g.movs.map(m => m.DATA).filter(Boolean).sort();
    g.de = datas[0] || ''; g.ate = datas[datas.length-1] || '';
    return g;
  }).sort((a,b) => String(b.quando).localeCompare(String(a.quando)));
}
function historicoImportacoes(){
  const L = lotesImportados();
  const corpo = L.length
    ? '<div class="tw"><table class="densa"><thead><tr><th>Importado em</th><th>Arquivo</th><th>Conta</th>'
      + '<th>Período</th><th class="num">Movs.</th><th class="num">Soma</th><th>Situação</th><th></th></tr></thead><tbody>'
      + L.map(g => '<tr><td>'+esc(g.quando ? dataBR(g.quando) + (g.quando.length > 10 ? ' ' + g.quando.slice(11) : '') : '—')+'</td>'
        + '<td><b>'+esc(g.arquivo || 'Importação anterior')+'</b></td>'
        + '<td>'+esc(g.banco || '—')+'</td>'
        + '<td class="mini">'+dataBR(g.de)+' a '+dataBR(g.ate)+'</td>'
        + '<td class="num">'+g.movs.length+'</td>'
        + '<td class="num">'+nMoeda(g.total)+'</td>'
        + '<td>'+(g.conciliados ? '<span class="tag t-ok">'+g.conciliados+' conciliados</span> ' : '')
              + (g.pendentes ? '<span class="tag t-pend">'+g.pendentes+' pendentes</span> ' : '')
              + (g.naoId ? '<span class="tag t-ni">'+g.naoId+' não identificados</span>' : '')+'</td>'
        + '<td style="text-align:right"><button class="btn sm per" onclick="excluirImportacao(\''+esc(g.chave).replace(/'/g,"\\'")+'\')">Excluir</button></td></tr>').join('')
      + '</tbody></table></div>'
      + '<p class="mini" style="margin-top:10px">Excluir uma importação apaga os movimentos dela. '
      + 'Movimentos já conciliados travam a exclusão — desfaça a conciliação antes.</p>'
    : vazio('Nenhuma importação','Os extratos importados aparecem aqui, com a opção de excluir cada arquivo.');
  modal('Histórico de importações', corpo, '<button class="btn sec" onclick="fecharModal()">Fechar</button>', 'larga');
}
async function excluirImportacao(chave){
  const g = lotesImportados().find(x => x.chave === chave);
  if (!g) return toast('Importação não encontrada.','erro');
  if (g.conciliados)
    return toast('Esta importação tem '+g.conciliados+' movimento(s) já conciliado(s). Desfaça a conciliação deles antes de excluir.','erro');
  if (!confirm('Excluir a importação de "'+(g.arquivo || 'arquivo anterior')+'" e seus '+g.movs.length+' movimento(s)?')) return;
  carregandoOn('Excluindo importação…');
  try{
    const ids = g.movs.map(m => m.ID);
    for (let i=0;i<ids.length;i+=200){
      await api({action:'excluirLote', lote: ids.slice(i,i+200).map(id => ({aba:'EXTRATO', id}))});
    }
    const set = new Set(ids);
    DB.EXTRATO = (DB.EXTRATO||[]).filter(m => !set.has(m.ID));
    render(); historicoImportacoes();
    toast(ids.length + ' movimento(s) excluído(s).','ok');
  }catch(e){ toast(e.message,'erro'); } finally{ carregandoOff(); }
}
