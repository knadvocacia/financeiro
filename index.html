async function lerArquivo(inp){
  const f = inp.files[0]; if (!f) return;
  $('#impPrevia').innerHTML = '<p class="mini">Lendo arquivo…</p>';
  try{
    const nome = f.name.toLowerCase();
    let linhas = [];
    if (/\.(ofx|ofc|qfx)$/.test(nome)) linhas = parseOFX(await f.text());
    else if (/\.pdf$/.test(nome)) linhas = parseLinhas(await textoPDF(f));
    else if (/\.(csv|txt)$/.test(nome)) linhas = parseTabela(await tabelaDeCSV(await f.text()));
    else linhas = parseTabela(await tabelaDeExcel(f));
    if (!linhas.length){ $('#impPrevia').innerHTML = '<div class="erro">Nenhum movimento reconhecido. Confira se o arquivo traz data, identificação e valor.</div>'; return; }
    IMP_BRUTO = linhas; IMP_NOME = f.name; previaImport();
  }catch(e){
    $('#impPrevia').innerHTML = '<div class="erro">Não foi possível ler o arquivo: '+esc(e.message)+'</div>';
  }
}
function parseOFX(txt){
  const out = [];
  const blocos = txt.split(/<STMTTRN>/i).slice(1);
  blocos.forEach(b => {
    const g = tag => { const m = b.match(new RegExp('<'+tag+'>([^<\\r\\n]*)','i')); return m ? m[1].trim() : ''; };
    const data = isoDe(g('DTPOSTED').slice(0,8));
    const valor = n(g('TRNAMT').replace(',', '.'));
    const desc = [g('MEMO'), g('NAME'), g('CHECKNUM')].filter(Boolean).join(' — ');

async function tabelaDeExcel(f){

async function tabelaDeCSV(txt){
  const sep = (txt.split('\n')[0].match(/;/g)||[]).length >= (txt.split('\n')[0].match(/,/g)||[]).length ? ';' : ',';
  return txt.split(/\r?\n/).filter(l => l.trim()).map(l => l.split(sep).map(c => c.replace(/^"|"$/g,'').trim()));
}
function parseTabela(rows){
  if (!rows || !rows.length) return [];
  let iD = -1, iI = -1, iV = -1, ini = 0;
  for (let r=0; r<Math.min(12, rows.length); r++){
    const cab = rows[r].map(c => String(c||'').toLowerCase());
    const acha = alvos => cab.findIndex(c => alvos.some(a => c.includes(a)));
    const d = acha(['data','dt ','lançamento','lancamento']);
    const i = acha(['identific','descri','histór','histor','memo','detalhe']);
    const v = acha(['valor','montante','crédito','credito','r$']);
    if (d >= 0 && v >= 0){ iD = d; iI = i; iV = v; ini = r+1; break; }
  }
  if (iD < 0){ iD = 0; iI = 1; iV = 2; ini = 0; }
  const out = [];
  for (let r=ini; r<rows.length; r++){
    const row = rows[r] || [];
    const data = isoDe(row[iD]);
    const valor = n(row[iV]);
    if (!data || !valor) continue;
    out.push({DATA:data, IDENTIFICACAO:String(iI >= 0 ? (row[iI]||'') : '').trim(), VALOR:rd(valor)});
  }
  return out;
}
async function textoPDF(f){
  if (typeof pdfjsLib === 'undefined') throw new Error('leitor de PDF indisponível — verifique a conexão.');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise;
  let txt = '';
  for (let p=1; p<=doc.numPages; p++){
    const c = await (await doc.getPage(p)).getTextContent();
    let y = null, linha = [];
    c.items.forEach(it => {
      const ny = Math.round(it.transform[5]);
      if (y !== null && Math.abs(ny - y) > 3){ txt += linha.join(' ') + '\n'; linha = []; }
      y = ny; linha.push(it.str);
    });
    txt += linha.join(' ') + '\n';
  }
  return txt;
}
function parseLinhas(txt){
  const out = [];
  txt.split(/\r?\n/).forEach(l => {
    const linha = l.replace(/\s+/g,' ').trim(); if (!linha) return;
    const md = linha.match(/(\d{2}[\/.-]\d{2}[\/.-]\d{2,4})/); if (!md) return;
    const valores = linha.match(/-?\s?R?\$?\s?\d{1,3}(?:\.\d{3})*,\d{2}(?:\s?[DC])?/g);
    if (!valores) return;
    const bruto = valores[valores.length-1];
    let v = n(bruto);
    if (/D\s*$/.test(bruto.trim()) || /^-/.test(bruto.trim())) v = -Math.abs(v);
    const desc = linha.replace(md[0],'').replace(bruto,'').replace(/\s+/g,' ').trim();
    const data = isoDe(md[0]);
    if (data && v) out.push({DATA:data, IDENTIFICACAO:desc.slice(0,120), VALOR:rd(v)});
  });
  return out;
}

function parseColado(txt){
  const linhas = txt.split(/\r?\n/).filter(l => l.trim());
  const sep = linhas.filter(l => l.includes('\t')).length >= linhas.length/2 ? '\t'
            : linhas.filter(l => l.includes(';')).length >= linhas.length/2 ? ';' : null;
  if (sep){
    const rows = linhas.map(l => l.split(sep).map(c => c.replace(/^"|"$/g,'').trim()));
    const r = parseTabela(rows);
    if (r.length) return r;
  }
  const r2 = parseLinhas(txt);
  if (r2.length) return r2;
  // último recurso: separado por 2+ espaços
  const rows = linhas.map(l => l.trim().split(/\s{2,}/));
  return parseTabela(rows);
}

/* acha as colunas pelo cabeçalho, em qualquer ordem */
function mapaColunasCP(rows){
  const alvos = [
    ['venc',  ['vencimento','vence','data de venc','data']],
    ['valor', ['valor','montante','r$','total']],
    ['fav',   ['favorecido','fornecedor','beneficiario','credor','pagar a','nome']],
    ['cat',   ['categoria','classificacao','classe','tipo','conta']],
    ['desc',  ['descricao','historico','discriminacao']],
    ['obs',   ['observacao','observacoes','obs']]
  ];
  for (let r = 0; r < Math.min(12, rows.length); r++){
    const cab = (rows[r]||[]).map(semAcento);
    const mapa = {}, usadas = new Set();
    alvos.forEach(([chave, termos]) => {
      for (const termo of termos){
        const i = cab.findIndex((c, idx) => !usadas.has(idx) && c && c.includes(termo));
        if (i >= 0){ mapa[chave] = i; usadas.add(i); return; }
      }
    });
    if (mapa.valor !== undefined && (mapa.venc !== undefined || mapa.fav !== undefined))
      return {mapa, inicio: r + 1};
  }
  return null;
}
function parseTabelaCP(rows){
  const m = mapaColunasCP(rows);
  if (!m) throw new Error('cabeçalho não reconhecido. Confira se há colunas de vencimento, favorecido, categoria, valor e observações.');
  const pega = (linha, chave) => m.mapa[chave] === undefined ? '' : String(linha[m.mapa[chave]] || '').trim();
  const out = [];
  for (let r = m.inicio; r < rows.length; r++){
    const linha = rows[r] || [];
    const valor = n(pega(linha, 'valor'));
    const venc = isoDe(pega(linha, 'venc'));
    const fav = tit(pega(linha, 'fav'));
    if (!valor && !fav) continue;
    const cat = tit(pega(linha, 'cat'));
    const desc = tit(pega(linha, 'desc'));
    out.push({ VENCIMENTO: venc, FAVORECIDO: fav, CATEGORIA: cat, VALOR: rd(valor),
               DESCRICAO: desc || cat || 'Conta a pagar', OBS: pega(linha, 'obs') });
  }
  return out;
}

function parseTabelaAcordos(rows){
  // a ordem importa: as colunas mais específicas são reservadas antes das genéricas
  const alvos = [
    ['primeiro',     ['data primeira','primeira parcela','1a parcela','inicio das parcelas','vencimento']],
    ['valorParcela', ['valor da parcela','valor parcela','parcela r$']],
    ['valorTotal',   ['valor acordo','valor do acordo','valor total','acordo r$','valor']],
    ['qtd',          ['parcelas','qtd','quantidade','n de parcelas']],
    ['sucumbencia',  ['sucumb','honorarios sucumb']],
    ['dataAcordo',   ['data do acordo','data acordo','data']],
    ['audiencia',    ['audi']],
    ['advogado',     ['advog','responsavel']],
    ['praca',        ['praca','comarca','vara']],
    ['pasta',        ['pasta']],
    ['cliente',      ['cliente','reclamante','autor','nome']],
    ['pctCli',       ['% cliente','pct cliente','percentual cliente']],
    ['categoria',    ['categoria','classe']],
    ['processo',     ['processo']],
    ['obs',          ['observ','obs']]
  ];
  let mapa = null, inicio = 0;
  for (let r = 0; r < Math.min(12, rows.length); r++){
    const cab = (rows[r]||[]).map(semAcento);
    const m = {}, usadas = new Set();
    alvos.forEach(([chave, termos]) => {
      for (const termo of termos){
        const i = cab.findIndex((c, idx) => !usadas.has(idx) && c && c.includes(termo));
        if (i >= 0){ m[chave] = i; usadas.add(i); return; }
      }
    });
    if (m.valorTotal !== undefined && (m.cliente !== undefined || m.pasta !== undefined)){
      mapa = m; inicio = r + 1; break;
    }
  }
  if (!mapa) throw new Error('cabeçalho não reconhecido. Confira se há colunas de pasta, cliente e valor do acordo.');

  const pega = (linha, chave) => mapa[chave] === undefined ? '' : String(linha[mapa[chave]] || '').trim();
  const out = [];
  for (let r = inicio; r < rows.length; r++){
    const linha = rows[r] || [];
    const valorTotal = n(pega(linha,'valorTotal'));
    const cliente = pega(linha,'cliente'), pasta = pega(linha,'pasta');
    if (!valorTotal && !cliente && !pasta) continue;
    const pctCli = n(pega(linha,'pctCli')) || pctClientePadrao();
    out.push({
      pasta, cliente, processo: pega(linha,'processo'),
      praca: tit(pega(linha,'praca')), advogado: pega(linha,'advogado'),
      audiencia: tit(pega(linha,'audiencia')),
      dataAcordo: isoDe(pega(linha,'dataAcordo')),
      primeiro: isoDe(pega(linha,'primeiro')) || isoDe(pega(linha,'dataAcordo')) || hoje(),
      valorTotal: rd(valorTotal), sucumbencia: rd(n(pega(linha,'sucumbencia'))),
      qtd: Math.max(1, parseInt(n(pega(linha,'qtd'))) || 1),
      valorParcela: rd(n(pega(linha,'valorParcela'))),
      pctCli, pctEsc: rd(100 - pctCli),
      categoria: tit(pega(linha,'categoria')) || catAcordoPadrao(),
      obs: pega(linha,'obs')
    });
  }
  return out;
}
function previaImportAcordos(linhas){
  IMPAC = []; IMPAC_AVISOS = [];
  const pastas = new Set((DB.LANCAMENTOS||[]).map(l => semAcento(l.PASTA) + '|' + rd(l.VALOR_TOTAL)));
  let repetidos = 0;
  linhas.forEach(l => {
    const chave = semAcento(l.pasta) + '|' + rd(l.valorTotal);
    if (l.pasta && pastas.has(chave)){ repetidos++; return; }
    pastas.add(chave);
    const base = rd(l.valorTotal - l.sucumbencia);
    if (base < 0) { IMPAC_AVISOS.push('Pasta ' + (l.pasta||'—') + ': sucumbência maior que o valor do acordo.'); return; }
    if (l.valorParcela && Math.abs(rd(l.valorParcela * l.qtd) - base) > 0.05)
      IMPAC_AVISOS.push('Pasta ' + (l.pasta||'—') + ': ' + l.qtd + ' x ' + moeda(l.valorParcela)
        + ' não fecha com ' + moeda(base) + ' — a última parcela será ajustada.');
    IMPAC.push(l);
  });

  const total = IMPAC.reduce((s,l) => s + l.valorTotal, 0);
  $('#iacPrevia').innerHTML =
    '<div class="kpis" style="margin:14px 0 10px">'
    + '<div class="kpi d"><div class="rot">Acordos novos</div><div class="val">'+IMPAC.length+'</div></div>'
    + '<div class="kpi b"><div class="rot">Já cadastrados (ignorados)</div><div class="val">'+repetidos+'</div></div>'
    + '<div class="kpi p"><div class="rot">Soma dos acordos</div><div class="val" style="font-size:17px">'+moeda(total)+'</div></div></div>'
    + (IMPAC_AVISOS.length ? '<div class="erro">' + IMPAC_AVISOS.slice(0,6).map(esc).join('<br>')
        + (IMPAC_AVISOS.length > 6 ? '<br>e mais ' + (IMPAC_AVISOS.length-6) + '…' : '') + '</div>' : '')
    + '<div class="tw" style="max-height:280px;overflow:auto"><table class="densa"><thead><tr>'
    + '<th>Pasta / cliente</th><th>Acordo</th><th>Audiência</th><th>Advogado</th><th>Praça</th>'
    + '<th class="num">Valor</th><th class="num">Sucumbência</th><th>Parcelas</th>'
    + '<th class="num">Escritório</th><th class="num">Cliente</th><th>Observações</th></tr></thead><tbody>'
    + IMPAC.slice(0,150).map(l => {
        const base = rd(l.valorTotal - l.sucumbencia);
        const esc2 = rd(l.sucumbencia + base * l.pctEsc / 100), cli = rd(base * l.pctCli / 100);
        return '<tr><td>'+pastaCliente(tit(l.pasta), tit(l.cliente))+'</td>'
          + '<td>'+dataBR(l.dataAcordo)+'</td><td>'+esc(l.audiencia||'—')+'</td>'
          + '<td>'+esc(tit(l.advogado)||'—')+'</td><td>'+esc(l.praca||'—')+'</td>'
          + '<td class="num">'+nMoeda(l.valorTotal)+'</td><td class="num">'+nMoeda(l.sucumbencia)+'</td>'
          + '<td>'+l.qtd+'x a partir de '+dataBR(l.primeiro)+'</td>'
          + '<td class="num">'+nMoeda(esc2)+'</td><td class="num">'+nMoeda(cli)+'</td>'
          + '<td class="mini">'+esc(l.obs||'')+'</td></tr>';
      }).join('')
    + '</tbody></table></div>' + (IMPAC.length > 150 ? '<p class="mini">Mostrando os 150 primeiros.</p>' : '');
  $('#btnImpAc').disabled = IMPAC.length === 0;
}

/* ══════════════════ CONTAS A RECEBER ══════════════════ */
/* ══════════════════════════════════════════════════════════
   Exclusão com retorno à conciliação.
   Excluir um registro já conciliado devolve o movimento do
   extrato para "pendente", pronto para ser conciliado de novo.
   ══════════════════════════════════════════════════════════ */
const movsConciliadosDe = refId => (DB.EXTRATO||[]).filter(m => m.PARCELA_ID === refId && m.STATUS === 'Conciliado');

function planoExclusao(refs, opcoes){
  const op = opcoes || {};
  const apagar = [], vistos = new Set(), movs = new Set(), limparCR = new Set();
  const soltarCP = [];
  const add = (aba, id) => {
    const k = aba + '|' + id;
    if (!id || vistos.has(k)) return false;
    vistos.add(k); apagar.push({aba, id}); return true;
  };
  const incluirCP = cp => {
    if (!cp) return;
    if (op.manterRepasse && cp.CATEGORIA === 'Repasse a cliente'){ soltarCP.push(cp); return; }
    if (!add('CONTAS_PAGAR', cp.ID)) return;
    movsConciliadosDe(cp.ID).forEach(m => movs.add(m.ID));       // o pagamento também volta
    (DB.COMISSOES||[]).filter(c => c.CP_ID === cp.ID).forEach(c => add('COMISSOES', c.ID));
  };

  (refs||[]).forEach(r => {
    if (r.aba === 'LANCAMENTOS'){
      add('LANCAMENTOS', r.id);
      (DB.PARCELAS||[]).filter(p => p.LANC_ID === r.id).forEach(p => refs.push({aba:'PARCELAS', id:p.ID}));

    } else if (r.aba === 'PARCELAS'){
      const p = parcDe(r.id); if (!p) return;
      add('PARCELAS', p.ID);
      movsConciliadosDe(p.ID).forEach(m => movs.add(m.ID));
      (DB.COMISSOES||[]).filter(c => c.PARCELA_ID === p.ID).forEach(c => add('COMISSOES', c.ID));
      incluirCP((DB.CONTAS_PAGAR||[]).find(c => c.ID === p.CP_ID
        || (c.PARCELA_ID === p.ID && c.CATEGORIA === 'Repasse a cliente')));

    } else if (r.aba === 'CONTAS_RECEBER'){
      const cr = (DB.CONTAS_RECEBER||[]).find(x => x.ID === r.id); if (!cr) return;
      add('CONTAS_RECEBER', cr.ID);
      movsConciliadosDe(cr.ID).forEach(m => movs.add(m.ID));
      incluirCP((DB.CONTAS_PAGAR||[]).find(c => c.ID === cr.CP_ID));

    } else if (r.aba === 'CONTAS_PAGAR'){
      const cp = (DB.CONTAS_PAGAR||[]).find(x => x.ID === r.id); if (!cp) return;
      incluirCP(cp);
      const cr = (DB.CONTAS_RECEBER||[]).find(x => x.CP_ID === cp.ID);
      if (cr && !vistos.has('CONTAS_RECEBER|' + cr.ID)) limparCR.add(cr.ID);
    }
  });

  // movimentos voltam para pendentes; contas a receber que perderam o repasse ficam sem vínculo
  const atualizar = [];
  [...movs].forEach(id => {
    const m = (DB.EXTRATO||[]).find(x => x.ID === id);
    if (m) atualizar.push({aba:'EXTRATO', registro: Object.assign({}, m, {STATUS:'Pendente', PARCELA_ID:''})});
  });
  [...limparCR].forEach(id => {
    const cr = (DB.CONTAS_RECEBER||[]).find(x => x.ID === id);
    if (cr) atualizar.push({aba:'CONTAS_RECEBER', registro: Object.assign({}, cr, {CP_ID:''})});
  });
  // repasses mantidos perdem o vínculo com o lançamento apagado, senão ficariam apontando para o vazio
  soltarCP.forEach(cp => atualizar.push({aba:'CONTAS_PAGAR', registro: Object.assign({}, cp, {
    PARCELA_ID:'', ORIGEM:'Repasse avulso',
    OBS:(cp.OBS ? cp.OBS + ' · ' : '') + 'lançamento de origem excluído em ' + dataBR(hoje())})}));
  return {apagar, atualizar, movs:[...movs], repasses: soltarCP.length};
}

async function excluirComRetorno(refs, rotulo, opcoes){
  const plano = planoExclusao(refs, opcoes);
  if (!plano.apagar.length) return toast('Nada a excluir.','erro');
  const qtdMov = plano.movs.length;
  if (!confirm('Excluir ' + (rotulo || plano.apagar.length + ' registro(s)') + '?'
      + (qtdMov ? '\n\n' + qtdMov + ' movimento(s) do extrato voltam para a conciliação, prontos para serem conciliados de novo.' : ''))) return;
  carregandoOn('Excluindo…');
  try{
    if (plano.atualizar.length) await salvarLoteRapido(plano.atualizar);
    for (let i=0;i<plano.apagar.length;i+=150){
      await api({action:'excluirLote', lote: plano.apagar.slice(i, i+150)});
    }
    plano.apagar.forEach(a => { DB[a.aba] = (DB[a.aba]||[]).filter(x => x.ID !== a.id); });
    SELR = new Set();
    render();
    toast('Excluído.' + (qtdMov ? ' ' + qtdMov + ' movimento(s) voltaram para a conciliação.' : ''), 'ok');
  }catch(e){ toast(e.message,'erro'); } finally{ carregandoOff(); }
}

/* exclui parcelas e recebimentos; pergunta o que fazer com o repasse ao cliente */
function excluirReceber(ids){
  const refs = ids.map(id => parcDe(id) ? {aba:'PARCELAS', id} : {aba:'CONTAS_RECEBER', id});
  const rotulo = ids.length + ' lançamento(s)';
  const repasses = planoExclusao(refs.slice()).apagar.filter(a => a.aba === 'CONTAS_PAGAR');
  if (!repasses.length) return excluirComRetorno(refs, rotulo);

  const total = repasses.reduce((s,a) => {
    const cp = (DB.CONTAS_PAGAR||[]).find(x => x.ID === a.id);
    return s + (cp ? n(cp.VALOR) : 0); }, 0);
  modal('Excluir o repasse ao cliente também?',
    '<p>Este(s) lançamento(s) gerou(aram) <b>'+repasses.length+' conta(s) a pagar</b> de repasse ao cliente, '
    + 'somando <b>'+moeda(total)+'</b>.</p>'
    + '<p class="mini" style="margin-top:10px">Mantendo o repasse, ele fica em contas a pagar como lançamento avulso, '
    + 'sem vínculo com o lançamento excluído.</p>',
    '<button class="btn sec" onclick="fecharModal()">Cancelar</button>'
    + '<button class="btn sec" onclick="fecharModal();excluirReceberConfirmado(true)">Manter o repasse</button>'
    + '<button class="btn per" onclick="fecharModal();excluirReceberConfirmado(false)">Excluir os dois</button>',
    'estreita');
  EXCL_PENDENTE = {refs, rotulo};
}
let EXCL_PENDENTE = null;
function excluirReceberConfirmado(manter){
  if (!EXCL_PENDENTE) return;
  const p = EXCL_PENDENTE; EXCL_PENDENTE = null;
  return excluirComRetorno(p.refs, p.rotulo + (manter ? ' (mantendo o repasse)' : ' e o repasse ao cliente'),
    {manterRepasse: manter});

function excluirSelecionadosReceber(){ excluirReceber([...SELR]); }

/* tarifa aplicável a uma parcela (sai do cliente e vai para o escritório) */
function tarifaDe(p, l){
  if (p.TIPO === 'Sucumbência') return 0;
  if (!l || l.TARIFA_ATIVA === 'NAO') return 0;
  return rd(n(l.TARIFA_VALOR) || tarifaPadrao());
}

  if (cr.PRACA) p.push('praça ' + cr.PRACA);
  if (cr.EXEC === 'SIM') p.push('cálculo pela EXEC');
  return p.join(' · ');
}
function descricaoRepasse(cr){
  return 'Repasse ao cliente — ' + (cr.PASTA ? 'pasta ' + cr.PASTA + ' · ' : '') + (cr.DESCRICAO || '');
}
function obsRepasse(cr, total, esc2, cli2, tar, data){
  const dados = dadosDoRecebimento(cr);
  return (dados ? dados + ' · ' : '')
    + 'crédito de ' + moeda(total) + ' em ' + dataBR(data)
    + ' · escritório ' + moeda(esc2) + ' (' + pctSobre(rd(esc2 - tar), total) + ')'

function sincronizaRecebida(origem, totalFixo){
  const c = (DB.CONTAS_RECEBER||[]).find(x => x.ID === RECEBIDA_ID);
  const total = totalFixo != null ? totalFixo : (c ? n(c.VALOR) : 0);
  const eEsc = document.getElementById('reEsc'), eCli = document.getElementById('reCli');
  if (!eEsc || !eCli) return;
  if (origem === 'esc') eCli.value = nMoeda(rd(total - n(eEsc.value)));
  else if (origem === 'cli') eEsc.value = nMoeda(rd(total - n(eCli.value)));
  const tar = val('reTarifaOn') ? rd(n(val('reTarifaV'))) : 0;
  const campoTar = document.getElementById('reTarifaV');
  if (campoTar) campoTar.disabled = !val('reTarifaOn');
  const escB = rd(n(eEsc.value)), cliB = rd(n(eCli.value));
  const esc2 = rd(escB + tar), cli2 = rd(cliB - tar);
  const aviso = document.getElementById('avisoRecebida');
  if (aviso) aviso.innerHTML = 'Escritório <b>'+pctSobre(escB, total)+'</b> = '+moeda(escB)
    + (tar ? ' + tarifa = <b>'+moeda(esc2)+'</b>' : '')
    + ' · cliente <b>'+pctSobre(cliB, total)+'</b> = '+moeda(cliB)
    + (tar ? ' − tarifa = <b>'+moeda(cli2)+'</b>' : '')
    + (tar ? '<br>Tarifa de '+moeda(tar)+' deduzida do cliente e revertida ao escritório.' : '')
    + (esc2 < 0 || cli2 < 0 ? ' <span class="neg">— um dos lados ficou negativo</span>' : '');
}
let RECEBIDA_ID = '';
async function gravarRecebida(id, total){
  RECEBIDA_ID = id;
  const c = (DB.CONTAS_RECEBER||[]).find(x => x.ID === id); if (!c) return;
  const tar = val('reTarifaOn') ? rd(n(val('reTarifaV'))) : 0;
  const escB = rd(n(val('reEsc'))), cliB = rd(n(val('reCli')));
  if (Math.abs(rd(escB + cliB) - rd(total)) > 0.01)
    return toast('A soma tem que fechar com o valor recebido ('+moeda(total)+').','erro');
  const esc2 = rd(escB + tar), cli2 = rd(cliB - tar);
  if (esc2 < 0 || cli2 < 0) return toast('Com a tarifa, um dos lados ficou negativo. Revise os valores.','erro');

  const cp = (DB.CONTAS_PAGAR||[]).find(x => x.ID === c.CP_ID);
  if (cp && cp.STATUS === 'Pago' && rd(n(cp.VALOR)) !== cli2)
    return toast('O repasse ao cliente já foi pago. Desfaça a baixa dele antes de mudar a divisão.','erro');

  const lote = [], apagar = [];
  let cpId = c.CP_ID || '';
  if (cli2 > 0 && !cpId) cpId = uid('cp');
  if (cli2 <= 0 && cp && cp.STATUS !== 'Pago'){
    apagar.push({aba:'CONTAS_PAGAR', id:cp.ID});
    cpId = '';
  }
  const atualizado = Object.assign({}, c, {
    DESCRICAO:tit(val('reDesc')), CLIENTE:tit(val('reCliente')), CATEGORIA:val('reCat'),
    PASTA:tit(val('rePasta')), PRACA:val('rePraca'), FILIAL:'',
    EXEC: val('reExec') ? 'SIM' : 'NAO',
    VALOR_ESCRITORIO:esc2, VALOR_CLIENTE:cli2, CP_ID:cpId, TARIFA:tar, OBS:val('reObs')});
  lote.push({aba:'CONTAS_RECEBER', registro: atualizado});

  // o repasse acompanha o recebimento: pasta, cliente, descrição, valor e memória de cálculo
  if (cli2 > 0){
    const fav = garantirFavorecido(atualizado.CLIENTE, (cp && cp.CATEGORIA) || 'Repasse a cliente');
    if (fav) lote.push(fav);
    lote.push({aba:'CONTAS_PAGAR', registro: Object.assign({}, cp || {}, {
      ID:cpId, DESCRICAO:descricaoRepasse(atualizado), FAVORECIDO:atualizado.CLIENTE,
      CATEGORIA:(cp && cp.CATEGORIA) || 'Repasse a cliente', VENCIMENTO:(cp && cp.VENCIMENTO) || c.DATA_RECEB,
      VALOR:cli2, STATUS:(cp && cp.STATUS) || 'Em aberto', DATA_PGTO:(cp && cp.DATA_PGTO) || '',
      ORIGEM:'Repasse de recebimento', PARCELA_ID:c.ID, ANEXO_URL:(cp && cp.ANEXO_URL) || '',
      OBS:obsRepasse(atualizado, total, esc2, cli2, tar, c.DATA_RECEB)})});
  }

  // a divisão e a praça mudam a comissão: refaz as que ainda não foram pagas
  if (c.STATUS === 'Recebido'){
    (DB.COMISSOES||[]).filter(x => x.PARCELA_ID === c.ID).forEach(x => {
      if (x.STATUS === 'Paga') return;
      apagar.push({aba:'COMISSOES', id:x.ID});
    });
    const jaPagas = (DB.COMISSOES||[]).filter(x => x.PARCELA_ID === c.ID && x.STATUS === 'Paga')
      .map(x => x.COMISSIONADO_ID);
    comissoesDoRecebimento(atualizado, total, c.DATA_RECEB)
      .filter(it => jaPagas.indexOf(it.registro.COMISSIONADO_ID) < 0)
      .forEach(it => lote.push(it));
  }

  fecharModal();
  try{
    if (apagar.length){
      apagar.forEach(a => { DB[a.aba] = (DB[a.aba]||[]).filter(x => x.ID !== a.id); });
      await api({action:'excluirLote', lote:apagar});
    }
    await salvarLoteRapido(lote);
    toast('Recebimento atualizado.','ok');
  }catch(e){}
}

/* ══════════════════ CONTAS A PAGAR ══════════════════ */
/* Um repasse ao cliente só pode ser pago depois que a parcela correspondente for conciliada.
   O sinal é lido da própria parcela, então nunca sai do lugar. */
function liberacao(c){
  const p = c.PARCELA_ID ? parcDe(c.PARCELA_ID) : null;
  if (p) return p.STATUS === 'Recebida'
    ? {tipo:'ok', p, quando:p.DATA_CREDITO, titulo:'Recebido em ' + dataBR(p.DATA_CREDITO) + ' — liberado para pagamento'}
    : {tipo:'nao', p, quando:'', titulo:'Parcela ainda não conciliada — aguardando o crédito de ' + moeda(p.VALOR)};
  const cr = recebimentoDoRepasse(c);
  if (cr) return cr.STATUS === 'Recebido'
    ? {tipo:'ok', cr, quando:cr.DATA_RECEB, titulo:'Recebido em ' + dataBR(cr.DATA_RECEB) + ' — liberado para pagamento'}
    : {tipo:'nao', cr, quando:'', titulo:'Recebimento ainda não conciliado — aguardando o crédito de ' + moeda(cr.VALOR)};
  return {tipo:'na'};
}
/* Acha o recebimento que originou um repasse.
   Tenta os dois vínculos gravados e, para os repasses criados antes de existir
   esse vínculo, casa pelo valor e pelo nome do cliente. */
function recebimentoDoRepasse(c){
  const L = DB.CONTAS_RECEBER || [];
  if (c.PARCELA_ID){
    const direto = L.find(x => x.ID === c.PARCELA_ID);
    if (direto) return direto;
  }
  const porCp = L.find(x => x.CP_ID && x.CP_ID === c.ID);
  if (porCp) return porCp;
  if (c.CATEGORIA !== 'Repasse a cliente' && c.ORIGEM !== 'Repasse de recebimento') return null;
  const valor = rd(n(c.VALOR)), quem = String(c.FAVORECIDO||'').trim().toLowerCase();
  return L.find(x => rd(n(x.VALOR_CLIENTE)) === valor && valor > 0
    && (!quem || String(x.CLIENTE||'').trim().toLowerCase() === quem)) || null;
}
function selo(c){
  const s = liberacao(c);
  if (s.tipo === 'na') return '<span class="mini">—</span>';
  return s.tipo === 'ok'
    ? '<span class="selo ok" title="'+esc(s.titulo)+'">✓</span>'
    : '<span class="selo nao" title="'+esc(s.titulo)+'">✕</span>';
}
/* conta recorrente ainda sem boleto: valor em branco */
const semValorCP = c => c.STATUS !== 'Pago' && !n(c.VALOR);
function filtraLib(c, f){
  if (!f) return true;
  if (f === 'sem') return semValorCP(c);
  const t = liberacao(c).tipo;
  return f === 'nao' ? t === 'nao' : t !== 'nao';
}
/* botões de recebido / não recebido / todos, com a contagem de cada um */
function botoesLib(base){
  const f = FILTROS.fLib || '';
  const op = [
    ['',    'Todos',            base.length],
    ['ok',  '✓ Recebidos',      base.filter(c => filtraLib(c,'ok')).length],
    ['nao', '✕ Não recebidos',  base.filter(c => filtraLib(c,'nao')).length],
    ['sem', 'Sem boleto',       base.filter(c => filtraLib(c,'sem')).length]
  ];
  return '<div class="seg" role="group" aria-label="Filtrar por recebimento">'
    + op.map(([k,rot,qtd]) => '<button class="'+(f===k?'on':'')+' k'+(k||'todos')+'" onclick="setF(\'fLib\',\''+k+'\')">'
        + esc(rot) + '<span>'+qtd+'</span></button>').join('')
    + '</div>';
}
/* envia um arquivo para a pasta do sistema no Google Drive e devolve a URL */
async function enviarAnexo(arquivo, refTipo, refId){
  const limite = 8 * 1024 * 1024;
  if (arquivo.size > limite) throw new Error('o arquivo tem ' + Math.round(arquivo.size/1048576) + ' MB; o limite é 8 MB.');
  carregandoOn('Enviando ' + arquivo.name + '…');
  try{
    const base64 = await new Promise((ok, falha) => {
      const r = new FileReader();
      r.onload = () => ok(String(r.result).split(',')[1]);
      r.onerror = () => falha(new Error('falha ao ler o arquivo.'));
      r.readAsDataURL(arquivo);
    });
    const j = await api({action:'upload', base64, mime:arquivo.type || 'application/octet-stream',
                         nome:arquivo.name, refTipo, refId});
    return j.url;
  } finally { carregandoOff(); }
}
async function removerAnexoCP(id){
  const c = (DB.CONTAS_PAGAR||[]).find(x => x.ID === id); if (!c) return;
  if (!confirm('Remover o boleto desta conta? O arquivo continua no Google Drive.')) return;
  fecharModal();
  try{ await salvarLoteRapido([{aba:'CONTAS_PAGAR', registro: Object.assign({}, c, {ANEXO_URL:''})}]);
       toast('Boleto removido da conta.','ok'); }catch(e){}
}
function origemCP(c){
  const partes = [];
  if (c.ORIGEM && c.ORIGEM !== 'Manual') partes.push(c.ORIGEM);
  const lb = liberacao(c);
  if (lb.tipo === 'ok') partes.push('recebido em ' + dataBR(lb.quando));
  else if (lb.tipo === 'nao') partes.push('aguardando recebimento');
  return partes.length ? '<div class="mini">'+esc(partes.join(' · '))+'</div>' : '';
}
function telaPagar(){
  const hj = hoje();
  // contas pagas saem daqui e vão para a aba Contas pagas
  const base = (DB.CONTAS_PAGAR||[])
    .filter(c => c.STATUS !== 'Pago')
    .filter(c => entreDatas(c.VENCIMENTO, FILTROS.apDe, FILTROS.apAte))
    .filter(c => contem(c.DESCRICAO, FILTROS.apDesc))
    .filter(c => contem(c.FAVORECIDO, FILTROS.apFav))
    .filter(c => !FILTROS.apCat || c.CATEGORIA === FILTROS.apCat)
    .filter(c => entreValores(c.VALOR, FILTROS.apMin, FILTROS.apMax));
  const L = base.filter(c => filtraLib(c, FILTROS.fLib))
    .sort((a,b) => String(a.VENCIMENTO).localeCompare(String(b.VENCIMENTO)));
  const abertas = L;

function gerarRec(){
  const dia = Math.min(31, Math.max(1, parseInt(val('recDia')) || 1));

  const ini = (val('recInicio') || String(hoje()).slice(0,7)) + '-01';
  const base = n(val('cpValor'));
  const d0 = new Date(ini + 'T12:00');
  const novas = [];
  for (let i=0;i<meses;i++){
    const d = new Date(d0.getFullYear(), d0.getMonth() + i, 1, 12);
    const ultimo = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();

async function gravarCP(id){
  const recorrente = !id && val('cpRec') && REC_TMP.length;
  if (!val('cpDesc')) return toast('Informe a descrição.','erro');
  if (!recorrente && !n(val('cpValor'))) return toast('Informe o valor.','erro');
  const atual = (DB.CONTAS_PAGAR||[]).find(x => x.ID === id) || {};
  const comum = { DESCRICAO:tit(val('cpDesc')), FAVORECIDO:tit(val('cpFav')), CATEGORIA:val('cpCat'), OBS:val('cpObs') };

  const fav = garantirFavorecido(tit(val('cpFav')), val('cpCat'));
  // o boleto sobe para o Drive antes de gravar a conta
  let anexo = atual.ANEXO_URL || '';
  const arq = document.getElementById('cpArq');
  if (arq && arq.files && arq.files[0]){
    try{ anexo = await enviarAnexo(arq.files[0], 'CONTAS_PAGAR', id || ''); }
    catch(e){ return toast('Não foi possível enviar o boleto: ' + e.message,'erro'); }
  }
  if (recorrente){
    const lote = REC_TMP.map((r,i) => ({aba:'CONTAS_PAGAR', registro: Object.assign({}, comum, {
      ID:uid('cp'), VENCIMENTO:r.venc, VALOR: n(r.valor) ? rd(n(r.valor)) : '',
      STATUS:'Em aberto', DATA_PGTO:'', ORIGEM:'Recorrente', PARCELA_ID:'',
      ANEXO_URL: i === 0 ? anexo : '' })}));
    if (fav) lote.push(fav);
    fecharModal();
    try{ await salvarLoteRapido(lote); toast(lote.length + ' contas recorrentes lançadas e salvas.','ok'); }catch(e){}
    return;
  }
  const novoValor = rd(n(val('cpValor')));
  // mudar o valor de um repasse redistribui o crédito de origem
  const ajuste = ajustarOrigemDoRepasse(atual, novoValor);
  if (ajuste && ajuste.erro) return toast(ajuste.erro,'erro');

  fecharModal();
  try{
    const cp = {aba:'CONTAS_PAGAR', registro: Object.assign({}, atual, comum, {ID:id||uid('cp'),
      VENCIMENTO:val('cpVenc'), VALOR:novoValor,
      STATUS: atual.STATUS || 'Em aberto', DATA_PGTO: atual.DATA_PGTO || '',
      ORIGEM: atual.ORIGEM || 'Manual', PARCELA_ID: atual.PARCELA_ID || '', ANEXO_URL: anexo})};
    if (ajuste) cp.registro.OBS = ajuste.obs;
    await salvarLoteRapido((fav ? [fav] : []).concat(ajuste ? ajuste.lote : []).concat([cp]));
    toast(ajuste ? 'Repasse alterado e divisão do crédito recalculada.' : 'Conta salva na nuvem.','ok');
  }catch(e){}
}

/* Ao mudar o valor de um repasse, a diferença vai para o escritório:
   a parcela ou o recebimento de origem são reescritos e a memória de cálculo é refeita. */
function ajustarOrigemDoRepasse(cp, novoValor){
  if (!cp || !cp.ID || cp.CATEGORIA !== 'Repasse a cliente') return null;
  if (rd(n(cp.VALOR)) === novoValor) return null;
  if (cp.STATUS === 'Pago') return {erro:'Este repasse já foi pago. Desfaça a baixa antes de alterar o valor.'};

  const p = cp.PARCELA_ID ? parcDe(cp.PARCELA_ID) : null;
  const cr = p ? null : recebimentoDoRepasse(cp);
  if (!p && !cr) return null;

  const total = p ? rd(n(p.VALOR_CREDITADO) || n(p.VALOR)) : rd(n(cr.VALOR));
  const tar = p ? n(p.TARIFA) : n(cr.TARIFA);
  const data = p ? p.DATA_CREDITO : cr.DATA_RECEB;
  const cli = novoValor, esc = rd(total - cli);
  if (cli < 0) return {erro:'O valor do repasse não pode ser negativo.'};
  if (esc < 0) return {erro:'O repasse ('+moeda(cli)+') não pode passar do crédito recebido ('+moeda(total)+').'};

  const baseAntiga = rd((p ? n(p.VALOR_ESCRITORIO) : (n(cr.VALOR_ESCRITORIO) || total)) - tar);
  const baseNova = rd(esc - tar);
  const lote = [];

  if (p){
    lote.push({aba:'PARCELAS', registro: Object.assign({}, p, {VALOR_CLIENTE:cli, VALOR_ESCRITORIO:esc})});
  } else {
    lote.push({aba:'CONTAS_RECEBER', registro: Object.assign({}, cr, {VALOR_CLIENTE:cli, VALOR_ESCRITORIO:esc})});
  }
  ajustarComissoes(p ? p.ID : cr.ID, baseAntiga, baseNova).forEach(it => lote.push(it));

  const l = p ? lancDe(p.LANC_ID) : {};
  const dados = p
    ? {PASTA:l.PASTA, PRACA:l.PRACA, EXEC:l.EXEC, DESCRICAO:'parcela ' + (p.NUM || '')}
    : cr;
  return {lote, obs: obsRepasse(dados, total, esc, cli, tar, data)};
}
/* comissões em aberto que incidiam sobre a parte do escritório acompanham a nova base;
   as de percentual próprio (base fixa) e as já pagas não são tocadas */
function ajustarComissoes(refId, baseAntiga, baseNova){
  return (DB.COMISSOES||[])
    .filter(c => c.PARCELA_ID === refId && c.STATUS !== 'Paga' && rd(n(c.BASE)) === rd(baseAntiga))
    .map(c => ({aba:'COMISSOES', registro: Object.assign({}, c, {
      BASE: baseNova, VALOR: rd(baseNova * n(c.PCT) / 100) })}));
}

/* ══════════════════ COMISSÕES ══════════════════ */
function telaComissoes(){
  const mes = FILTROS.fMesC || '', t = FILTROS.busca;
  const coms = (DB.COMISSIONADOS||[]).filter(c => c.ATIVO !== 'NAO');
  const todas = (DB.COMISSOES||[]).filter(c => !mes || mesDe(c.DATA) === mes);

  // uma linha por recebimento conciliado
  let recs = (DB.PARCELAS||[]).filter(p => p.STATUS === 'Recebida').map(p => {
    const l = lancDe(p.LANC_ID);
    return {p, l, data:p.DATA_CREDITO, cliente:l.CLIENTE||'—', pasta:l.PASTA||'—',
            sub:(l.SUBCLASSE||'—') + (l.EXEC === 'SIM' ? ' · EXEC' : ''),
            caiu:n(p.VALOR_CREDITADO||p.VALOR), esc:n(p.VALOR_ESCRITORIO),
            base:rd(n(p.VALOR_ESCRITORIO) - n(p.TARIFA)),
            itens:(DB.COMISSOES||[]).filter(c => c.PARCELA_ID === p.ID)};
  });
  // recebimentos avulsos conciliados também geram comissão
  (DB.CONTAS_RECEBER||[]).filter(c => c.STATUS === 'Recebido').forEach(c => {
    const esc2 = n(c.VALOR_ESCRITORIO) || n(c.VALOR);
    recs.push({p:null, l:{}, data:c.DATA_RECEB, cliente:c.CLIENTE || c.DESCRICAO || '—',
      pasta:c.PASTA || '—', sub:(c.CATEGORIA||'—') + (c.EXEC === 'SIM' ? ' · EXEC' : ''),
      caiu:n(c.VALOR), esc:esc2, base:rd(esc2 - n(c.TARIFA)),
      itens:(DB.COMISSOES||[]).filter(x => x.PARCELA_ID === c.ID)});
  });
  recs = recs.filter(r => !mes || mesDe(r.data) === mes)
    .filter(r => casa(r, ['cliente','pasta','sub'], t))
    .sort((a,b) => String(b.data).localeCompare(String(a.data)));

  const porCom = {};
  todas.forEach(c => { porCom[c.COMISSIONADO_ID] = porCom[c.COMISSIONADO_ID] || {t:0, ab:0};
    porCom[c.COMISSIONADO_ID].t += n(c.VALOR);
    if (c.STATUS !== 'Paga') porCom[c.COMISSIONADO_ID].ab += n(c.VALOR); });

  const cabecalho = '<tr><th>Crédito</th><th>Pasta / cliente</th><th>Categoria</th>'
    + '<th class="num">Caiu na conta</th><th class="num">Para o escritório</th><th class="num">Base padrão</th>'
    + coms.map(c => '<th class="num">'+esc(c.NOME)+'</th>').join('') + '</tr>';

  const linhas = recs.length ? recs.map(r =>
    '<tr><td>'+dataBR(r.data)+'</td><td>'+pastaCliente(r.pasta, r.cliente)+'</td>'
    + '<td>'+esc(r.sub)+'</td><td class="num">'+nMoeda(r.caiu)+'</td><td class="num">'+nMoeda(r.esc)+'</td>'
    + '<td class="num">'+nMoeda(r.base)+'</td>'
    + coms.map(c => { const it = r.itens.find(x => x.COMISSIONADO_ID === c.ID);
        return '<td class="num">' + (it ? nMoeda(it.VALOR) + '<div class="mini">' + nMoeda(it.PCT) + '% de ' + moeda(it.BASE)
          + (it.STATUS === 'Paga' ? ' · paga' : '') + '</div>' : '<span class="mini">—</span>') + '</td>'; }).join('')
    + '</tr>').join('')
    : '<tr><td colspan="'+(6+coms.length)+'">'+vazio('Sem comissões no período','As comissões são geradas na conciliação, conforme as regras por categoria.')+'</td></tr>';

  const rodape = recs.length ? '<tfoot><tr><th colspan="3" style="text-align:right">Totais</th>'
    + '<th class="num">'+nMoeda(recs.reduce((s,r)=>s+r.caiu,0))+'</th>'
    + '<th class="num">'+nMoeda(recs.reduce((s,r)=>s+r.esc,0))+'</th>'
    + '<th class="num">'+nMoeda(recs.reduce((s,r)=>s+r.base,0))+'</th>'
    + coms.map(c => '<th class="num">'+nMoeda(recs.reduce((s,r)=>s+n((r.itens.find(x=>x.COMISSIONADO_ID===c.ID)||{}).VALOR),0))+'</th>').join('')
    + '</tr></tfoot>' : '';

  const aPagar = todas.filter(c => c.STATUS !== 'Paga');
  return cabec('Comissões', 'Base de cálculo: a parte do escritório sem a tarifa bancária.',
      '<button class="btn sec" onclick="abrirConfig(\'regras\')">Comissionados e regras</button>'
    + (aPagar.length ? '<button class="btn" onclick="gerarCPComissoes()">Enviar '+aPagar.length+' para contas a pagar</button>' : ''))
    + '<div class="kpis">'
    + coms.slice(0,4).map(c => kpi(c.NOME, moeda((porCom[c.ID]||{}).t || 0), moeda((porCom[c.ID]||{}).ab || 0) + ' em aberto', 'b')).join('')
    + '</div>'
    + '<div class="filtros">' + campoBusca('Cliente, pasta, subclasse…') + selMes('fMesC', mes) + '</div>'
    + (coms.length
      ? '<div class="card"><div class="tw"><table><thead>'+cabecalho+'</thead><tbody>'+linhas+'</tbody>'+rodape+'</table></div></div>'
      : '<div class="card">'+vazio('Nenhum comissionado cadastrado','Cadastre os comissionados e as regras por categoria na engrenagem, em Regras de comissão.')+'</div>');
}

/* ══════════════════ PAINEL E DRE ══════════════════ */
/* Apura um mês de um grupo. Categorias sem grupo formam o DRE do escritório;
   categorias com grupo preenchido formam um DRE próprio. */
function dadosDRE(mes, grupo){
  const noMes = d => !mes || mesDe(d) === mes;
  const doGrupo = cat => grupoDaCat(cat) === grupo;
  const catParcela = p => p.TIPO === 'Sucumbência' ? 'Sucumbência' : (lancDe(p.LANC_ID).SUBCLASSE || '—');

  const receitas = {}, despesas = {}, repasses = {};
  let tarifas = 0;
  const soma = (obj, k, v) => { if (!v) return; obj[k] = rd((obj[k] || 0) + v); };

  (DB.PARCELAS||[]).filter(p => p.STATUS === 'Recebida' && noMes(p.DATA_CREDITO))
    .filter(p => doGrupo(catParcela(p)))
    .forEach(p => {
      const sp = p.TIPO === 'Sucumbência' ? 0 : sucDaParcela(p, n(p.VALOR_CREDITADO) || n(p.VALOR));
      soma(receitas, catParcela(p), rd(n(p.VALOR_ESCRITORIO) - n(p.TARIFA) - sp));
      if (sp) soma(receitas, 'Sucumbência', sp);      // a fatia de sucumbência vira linha própria
      soma(repasses, catParcela(p), n(p.VALOR_CLIENTE));
      tarifas = rd(tarifas + n(p.TARIFA));
    });

  (DB.CONTAS_RECEBER||[]).filter(c => c.STATUS === 'Recebido' && noMes(c.DATA_RECEB))
    .filter(c => doGrupo(c.CATEGORIA))
    .forEach(c => {
      const cat = c.CATEGORIA || '—';
      soma(receitas, cat, rd((n(c.VALOR_ESCRITORIO) || n(c.VALOR)) - n(c.TARIFA)));
      soma(repasses, cat, n(c.VALOR_CLIENTE));
      tarifas = rd(tarifas + n(c.TARIFA));
    });

  (DB.CONTAS_PAGAR||[]).filter(c => c.CATEGORIA !== 'Repasse a cliente' && noMes(c.VENCIMENTO))
    .filter(c => doGrupo(c.CATEGORIA))
    .forEach(c => soma(despesas, c.CATEGORIA || 'Outras despesas', n(c.VALOR)));

  const bruta = rd(Object.values(receitas).reduce((s,v) => s + v, 0) + tarifas);
  const totDesp = rd(Object.values(despesas).reduce((s,v) => s + v, 0));
  return { receitas, despesas, repasses, tarifas, bruta, totDesp, resultado: rd(bruta - totDesp),
           totRepasses: rd(Object.values(repasses).reduce((s,v) => s + v, 0)) };
}

/* O que estava previsto para o mês, esteja conciliado ou não. */
function agendadoDRE(mes, grupo){
  const noMes = d => !mes || mesDe(d) === mes;
  const doGrupo = cat => grupoDaCat(cat) === grupo;
  const receitas = {}, despesas = {};
  const soma = (obj, k, v) => { if (!v) return; obj[k] = rd((obj[k] || 0) + v); };

  (DB.PARCELAS||[]).filter(p => noMes(p.STATUS === 'Recebida' ? p.DATA_CREDITO : p.VENCIMENTO))
    .forEach(p => {
      const l = lancDe(p.LANC_ID);
      const cat = p.TIPO === 'Sucumbência' ? 'Sucumbência' : (l.SUBCLASSE || '—');
      if (!doGrupo(cat)) return;
      const tar = p.STATUS === 'Recebida' ? n(p.TARIFA) : tarifaDe(p, l);
      const sucP = p.TIPO === 'Sucumbência' ? n(p.VALOR) : n(p.SUCUMBENCIA);
      const esc2 = p.STATUS === 'Recebida' ? rd(n(p.VALOR_ESCRITORIO) - n(p.TARIFA))
                                           : rd(sucP + (n(p.VALOR) - sucP) * n(l.PCT_ESCRITORIO) / 100);
      soma(receitas, cat, esc2);
      soma(receitas, 'Tarifas bancárias', tar);
    });
  (DB.CONTAS_RECEBER||[]).filter(c => noMes(c.STATUS === 'Recebido' ? c.DATA_RECEB : c.VENCIMENTO))
    .filter(c => doGrupo(c.CATEGORIA))
    .forEach(c => {
      soma(receitas, c.CATEGORIA || '—', rd((n(c.VALOR_ESCRITORIO) || n(c.VALOR)) - n(c.TARIFA)));
      soma(receitas, 'Tarifas bancárias', n(c.TARIFA));
    });
  (DB.CONTAS_PAGAR||[]).filter(c => c.CATEGORIA !== 'Repasse a cliente' && noMes(c.VENCIMENTO))
    .filter(c => doGrupo(c.CATEGORIA))
    .forEach(c => soma(despesas, c.CATEGORIA || 'Outras despesas', n(c.VALOR)));

  const bruta = rd(Object.values(receitas).reduce((s,v) => s + v, 0));
  const totDesp = rd(Object.values(despesas).reduce((s,v) => s + v, 0));
  return { receitas, despesas, bruta, totDesp, resultado: rd(bruta - totDesp) };
}

/* categorias que devem aparecer sempre, mesmo zeradas */
function categoriasDoGrupo(tipo, grupo){
  return (DB.SUBCLASSES||[])
    .filter(c => (tipo === 'D' ? ehDebitoCat(c) : !ehDebitoCat(c)))
    .filter(c => grupoDaCat(c.NOME) === grupo)
    .map(c => c.NOME)
    .sort((a,b) => String(a).localeCompare(String(b),'pt-BR'));
}
function linhasCategoria(fixas, movimentadas){
  return [...new Set(fixas.concat(Object.keys(movimentadas)))]
    .sort((a,b) => String(a).localeCompare(String(b),'pt-BR'));
}

/* ══════════════════ INDICADORES DA CONTA CORRENTE ══════════════════ */
const catsFolha = () => String(cfg('CATEGORIAS_FOLHA','Folha, Audiencistas'))
  .split(/[,;|]/).map(s => s.trim().toLowerCase()).filter(Boolean);
const ehFolha = cat => catsFolha().indexOf(String(cat||'').trim().toLowerCase()) > -1;
const pctNaoIdent = () => n(cfg('PCT_NAO_IDENT','30')) || 0;

function indicadoresPainel(mes){
  const noMes = d => !mes || mesDe(d) === mes;
  const conc = (DB.EXTRATO||[]).filter(m => m.STATUS === 'Conciliado' && noMes(m.DATA));

  let receitaTotal = 0, despesaTotal = 0, despEscritorio = 0, despFolha = 0, repassesPagos = 0;
  conc.forEach(m => {
    const v = Math.abs(n(m.VALOR));
    if (!ehDebito(m)){ receitaTotal = rd(receitaTotal + v); return; }
    despesaTotal = rd(despesaTotal + v);
    const a = alvoDe(m);
    const cat = a.tipo === 'pagar' ? (a.cp.CATEGORIA || '') : '';
    if (cat === 'Repasse a cliente') repassesPagos = rd(repassesPagos + v);
    else if (ehFolha(cat)) despFolha = rd(despFolha + v);
    else despEscritorio = rd(despEscritorio + v);
  });

  // parte do escritório dentro dos créditos recebidos
  const receitaEscritorio = rd(
    (DB.PARCELAS||[]).filter(p => p.STATUS === 'Recebida' && noMes(p.DATA_CREDITO))
      .reduce((s,p) => s + n(p.VALOR_ESCRITORIO), 0)
    + (DB.CONTAS_RECEBER||[]).filter(c => c.STATUS === 'Recebido' && noMes(c.DATA_RECEB))
      .reduce((s,c) => s + (n(c.VALOR_ESCRITORIO) || n(c.VALOR)), 0));

  // estoques: não dependem do mês
  const abertas = (DB.CONTAS_PAGAR||[]).filter(c => c.STATUS !== 'Pago');
  const repassesARealizar = rd(abertas
    .filter(c => c.CATEGORIA === 'Repasse a cliente' && liberacao(c).tipo === 'ok')
    .reduce((s,c) => s + n(c.VALOR), 0));
  const repassesTravados = rd(abertas
    .filter(c => c.CATEGORIA === 'Repasse a cliente' && liberacao(c).tipo !== 'ok')
    .reduce((s,c) => s + n(c.VALOR), 0));
  const contasAbertas = rd(abertas
    .filter(c => c.CATEGORIA !== 'Repasse a cliente')
    .reduce((s,c) => s + n(c.VALOR), 0));

  const naoIdent = rd((DB.EXTRATO||[])
    .filter(m => m.STATUS === 'Nao identificado' && !ehDebito(m) && noMes(m.DATA))
    .reduce((s,m) => s + n(m.VALOR), 0));

  const resultado = rd(receitaTotal - despesaTotal);
  const parteNaoIdent = rd(naoIdent * pctNaoIdent() / 100);
  const resultadoReal = rd(resultado - repassesARealizar - contasAbertas + parteNaoIdent);

  return { receitaTotal, receitaEscritorio, despesaTotal, despEscritorio, despFolha,
           repassesPagos, repassesARealizar, repassesTravados, contasAbertas,
           naoIdent, parteNaoIdent, resultado, resultadoReal, qtdConc: conc.length };
}

function detalhePainel(chave){
  const mes = FILTROS.fMesD || mesDe(hoje());
  const noMes = d => !mes || mesDe(d) === mes;
  const conc = (DB.EXTRATO||[]).filter(m => m.STATUS === 'Conciliado' && noMes(m.DATA));
  let titulo = '', cols = [], linhas = [], total = 0;

  const linhaMovimento = m => { const a = alvoDe(m), v = Math.abs(n(m.VALOR)); total += v;
    return [dataBR(m.DATA), esc(m.IDENTIFICACAO||'—'), esc(m.BANCO||'—'), a.quem, nMoeda(v)]; };
  const colsMov = ['Data','Histórico','Conta','Baixou','Valor'];

  if (chave === 'creditos'){
    titulo = 'Créditos conciliados'; cols = colsMov;
    linhas = conc.filter(m => !ehDebito(m)).map(linhaMovimento);

  } else if (chave === 'debitos' || chave === 'despEscritorio' || chave === 'despFolha' || chave === 'repassesPagos'){
    const filtro = m => {
      if (!ehDebito(m)) return false;
      const a = alvoDe(m), cat = a.tipo === 'pagar' ? (a.cp.CATEGORIA || '') : '';
      if (chave === 'debitos') return true;
      if (chave === 'repassesPagos') return cat === 'Repasse a cliente';
      if (chave === 'despFolha') return ehFolha(cat);
      return cat !== 'Repasse a cliente' && !ehFolha(cat);
    };
    titulo = {debitos:'Débitos conciliados', despEscritorio:'Despesas do escritório',
              despFolha:'Despesas de folha e audiencistas', repassesPagos:'Repasses pagos aos clientes'}[chave];
    cols = colsMov;
    linhas = conc.filter(filtro).map(linhaMovimento);

  } else if (chave === 'recEscritorio'){
    titulo = 'Parte do escritório nos créditos';
    cols = ['Crédito','Pasta / cliente','Descrição','Valor do crédito','Parte do escritório'];
    (DB.PARCELAS||[]).filter(p => p.STATUS === 'Recebida' && noMes(p.DATA_CREDITO)).forEach(p => {
      const l = lancDe(p.LANC_ID); total += n(p.VALOR_ESCRITORIO);
      linhas.push([dataBR(p.DATA_CREDITO), pastaCliente(l.PASTA, l.CLIENTE),
                   esc(p.TIPO + (p.NUM>0?' '+p.NUM:'')), nMoeda(p.VALOR_CREDITADO||p.VALOR), nMoeda(p.VALOR_ESCRITORIO)]);
    });
    (DB.CONTAS_RECEBER||[]).filter(c => c.STATUS === 'Recebido' && noMes(c.DATA_RECEB)).forEach(c => {
      const v = n(c.VALOR_ESCRITORIO) || n(c.VALOR); total += v;
      linhas.push([dataBR(c.DATA_RECEB), pastaCliente(c.PASTA, c.CLIENTE), esc(c.DESCRICAO||'—'),
                   nMoeda(c.VALOR), nMoeda(v)]);
    });

  } else if (chave === 'repassesRealizar'){
    titulo = 'Repasses a realizar — já recebidos, falta pagar o cliente';
    cols = ['Vencimento','Descrição','Favorecido','Recebido em','Valor'];
    (DB.CONTAS_PAGAR||[]).filter(c => c.STATUS !== 'Pago' && c.CATEGORIA === 'Repasse a cliente')
      .filter(c => liberacao(c).tipo === 'ok')
      .sort((a,b) => String(a.VENCIMENTO).localeCompare(String(b.VENCIMENTO)))
      .forEach(c => { total += n(c.VALOR);
        linhas.push([dataBR(c.VENCIMENTO), esc(c.DESCRICAO||'—'), esc(c.FAVORECIDO||'—'),
                     dataBR(liberacao(c).quando), nMoeda(c.VALOR)]); });

  } else if (chave === 'naoIdent'){
    titulo = 'Depósitos não identificados';
    cols = ['Data','Histórico','Conta','Valor'];
    (DB.EXTRATO||[]).filter(m => m.STATUS === 'Nao identificado' && !ehDebito(m) && noMes(m.DATA))
      .forEach(m => { total += n(m.VALOR);
        linhas.push([dataBR(m.DATA), esc(m.IDENTIFICACAO||'—'), esc(m.BANCO||'—'), nMoeda(m.VALOR)]); });
  }

  modal(titulo + ' — ' + (mes ? mesBR(mes) : 'todo o período'),
    tabelaDetalhe(cols, linhas, total),
    '<button class="btn sec" onclick="fecharModal()">Fechar</button>', 'larga');
}

function dreComparativo(grupo){
  const qtd = parseInt(FILTROS.fComp) || 6;
  const meses = [];
  const base = new Date(); base.setDate(1);
  for (let i = qtd - 1; i >= 0; i--){
    const dt = new Date(base.getFullYear(), base.getMonth() - i, 1);
    meses.push(dt.toISOString().slice(0,7));
  }
  const dados = meses.map(m => dadosDRE(m, grupo));
  const catsRec = linhasCategoria(categoriasDoGrupo('C', grupo),
    Object.assign({}, ...dados.map(d => d.receitas)));
  const catsDesp = linhasCategoria(categoriasDoGrupo('D', grupo).filter(c => c !== 'Repasse a cliente'),
    Object.assign({}, ...dados.map(d => d.despesas)));

  const varia = vals => {
    const a = vals[vals.length-2], b = vals[vals.length-1];
    if (!a) return b ? '<span class="pos">novo</span>' : '—';
    const p = rd((b - a) / Math.abs(a) * 100);
    return '<span class="'+(p>=0?'pos':'neg')+'">'+(p>0?'+':'')+nMoeda(p)+'%</span>';
  };
  const linha = (rot, vals, cls, drill) => {
    const cel = (v,i) => '<td class="num'+(v<0?' neg':'')+'"'
      + (drill ? ' style="cursor:pointer" onclick="verMesDRE(\''+meses[i]+'\',\''+esc(drill).replace(/'/g,"\\'")+'\')"' : '')
      + '>'+nMoeda(v)+'</td>';
    return '<tr class="'+(cls||'')+'"><td>'+esc(rot)+'</td>' + vals.map(cel).join('')
      + '<td class="num">'+varia(vals)+'</td></tr>';
  };

  return '<div class="filtros">'
    + sel('fComp','Meses comparados', [[3,'Últimos 3'],[6,'Últimos 6'],[12,'Últimos 12']], String(qtd), '', 'onchange="setF(\'fComp\',this.value)"')
    + '</div>'
    + '<div class="card"><h3>' + esc(grupo) + ' — evolução mês a mês</h3><div class="tw">'
    + '<table class="dre densa"><thead><tr><th></th>'
    + meses.map(m => '<th class="num">'+mesBR(m)+'</th>').join('')
    + '<th class="num">Variação</th></tr></thead><tbody>'
    + linha('Receita bruta', dados.map(d => d.bruta), 'nivel1')
    + catsRec.map(c => linha(c, dados.map(d => d.receitas[c] || 0), 'recuo', 'receita|'+c)).join('')
    + linha('Tarifas bancárias', dados.map(d => d.tarifas), 'recuo', 'tarifas')
    + linha('Despesas operacionais', dados.map(d => -d.totDesp), 'nivel1')
    + catsDesp.map(c => linha(c, dados.map(d => -(d.despesas[c] || 0)), 'recuo', 'despesa|'+c)).join('')
    + linha('Resultado', dados.map(d => d.resultado), 'total')
    + '</tbody></table></div></div>'
    + '<p class="mini">A coluna de variação compara o último mês com o anterior. Clique em qualquer valor para ver as contas daquele mês.</p>';
}
function verMesDRE(mes, chave){
  FILTROS.fMesD = mes;
  detalheDRE(chave);
}

function dreAgendado(mes, grupo){
  const real = dadosDRE(mes, grupo);
  const prev = agendadoDRE(mes, grupo);
  const catsRec = linhasCategoria(categoriasDoGrupo('C', grupo),
    Object.assign({}, real.receitas, prev.receitas));
  const catsDesp = linhasCategoria(categoriasDoGrupo('D', grupo).filter(c => c !== 'Repasse a cliente'),
    Object.assign({}, real.despesas, prev.despesas));

  const linha = (rot, agendado, realizado, cls) => {
    const dif = rd(realizado - agendado);
    const pct = agendado ? rd(realizado / agendado * 100) : (realizado ? 100 : 0);
    return '<tr class="'+(cls||'')+'"><td>'+esc(rot)+'</td>'
      + '<td class="num">'+nMoeda(agendado)+'</td>'
      + '<td class="num">'+nMoeda(realizado)+'</td>'
      + '<td class="num '+(dif<0?'neg':dif>0?'pos':'')+'">'+(dif>0?'+':'')+nMoeda(dif)+'</td>'
      + '<td class="num">'+(agendado ? nMoeda(pct)+'%' : '—')+'</td>'
      + '<td><div class="barra"><i style="width:'+Math.max(0,Math.min(100,pct))+'%"></i></div></td></tr>';
  };
  const tarPrev = prev.receitas['Tarifas bancárias'] || 0;

  return '<div class="kpis">'
    + kpi('Receita agendada', moeda(prev.bruta), mes ? mesBR(mes) : 'período', 'b')
    + kpi('Receita realizada', moeda(real.bruta), pctSobre(real.bruta, prev.bruta) + ' do previsto', 'p')
    + kpi('Despesa agendada', moeda(prev.totDesp), 'contas do mês', 'b')
    + kpi('Despesa paga', moeda(real.totDesp), 'lançadas no mês', 'n')
    + '</div>'
    + '<div class="card"><h3>Realizado x agendado — ' + esc(grupo) + ' · ' + (mes ? mesBR(mes) : 'todo o período') + '</h3><div class="tw">'
    + '<table class="dre densa"><thead><tr><th></th><th class="num">Agendado</th><th class="num">Realizado</th>'
    + '<th class="num">Diferença</th><th class="num">%</th><th style="width:90px"></th></tr></thead><tbody>'
    + linha('Receita bruta', prev.bruta, real.bruta, 'nivel1')
    + catsRec.filter(c => c !== 'Tarifas bancárias')
        .map(c => linha(c, prev.receitas[c] || 0, real.receitas[c] || 0, 'recuo')).join('')
    + linha('Tarifas bancárias', tarPrev, real.tarifas, 'recuo')
    + linha('Despesas operacionais', prev.totDesp, real.totDesp, 'nivel1')
    + catsDesp.map(c => linha(c, prev.despesas[c] || 0, real.despesas[c] || 0, 'recuo')).join('')
    + linha('Resultado', prev.resultado, real.resultado, 'total')
    + '</tbody></table></div></div>'
    + '<p class="mini"><b>Agendado</b> é o que estava previsto para o mês: parcelas e contas com vencimento no período. '
    + '<b>Realizado</b> é o que foi efetivamente conciliado no extrato. '
    + 'Uma parcela vencida em setembro e recebida em outubro entra como agendada em setembro e realizada em outubro.</p>';
}

function graficoMeses(grupo){
  const meses = {};
  (DB.PARCELAS||[]).filter(p => p.STATUS === 'Recebida' && p.DATA_CREDITO).forEach(p => {
    const cat = p.TIPO === 'Sucumbência' ? 'Sucumbência' : (lancDe(p.LANC_ID).SUBCLASSE || '—');
    if (grupo && grupoDaCat(cat) !== grupo) return;
    const m = mesDe(p.DATA_CREDITO); meses[m] = (meses[m] || 0) + n(p.VALOR_ESCRITORIO);
  });
  const ks = Object.keys(meses).sort().slice(-12);
  if (!ks.length) return '';
  const max = Math.max(...ks.map(k => meses[k]));
  return '<div class="card"><h3>Receita do escritório por mês</h3><div class="corpo">'
    + ks.map(k => '<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12px">'
      + '<span>'+mesBR(k)+'</span><span class="num">'+moeda(meses[k])+'</span></div>'
      + '<div class="barra"><i style="width:'+Math.round(meses[k]/max*100)+'%"></i></div></div>').join('')
    + '</div></div>';
}

/* ── Detalhe de uma linha do DRE ── */
function detalheDRE(chave){
  const mes = FILTROS.fMesD || mesDe(hoje());
  const grupo = FILTROS.fGrupo || GRUPO_PADRAO;
  const noMes = d => !mes || mesDe(d) === mes;
  const partes = String(chave).split('|');
  const tipo = partes[0], cat = partes.slice(1).join('|');
  const catParcela = p => p.TIPO === 'Sucumbência' ? 'Sucumbência' : (lancDe(p.LANC_ID).SUBCLASSE || '—');
  const recb = (DB.PARCELAS||[]).filter(p => p.STATUS === 'Recebida' && noMes(p.DATA_CREDITO));
  const crRec = (DB.CONTAS_RECEBER||[]).filter(c => c.STATUS === 'Recebido' && noMes(c.DATA_RECEB));
  let titulo = '', cols = [], linhas = [], total = 0;

  if (tipo === 'receita' || tipo === 'tarifas' || tipo === 'repasse'){
    const casaCat = c => tipo === 'tarifas' ? grupoDaCat(c) === grupo : c === cat;
    const valorP = p => tipo === 'tarifas' ? n(p.TARIFA)
                      : tipo === 'repasse' ? n(p.VALOR_CLIENTE)
                      : rd(n(p.VALOR_ESCRITORIO) - n(p.TARIFA));
    titulo = tipo === 'tarifas' ? 'Tarifas bancárias' : (tipo === 'repasse' ? 'Repasses — ' : 'Receita — ') + cat;
    cols = ['Crédito','Pasta / cliente','Descrição','Valor do crédito','Entrou nesta linha'];
    recb.filter(p => casaCat(catParcela(p))).forEach(p => {
      const v = valorP(p); if (!v) return; total += v; const l = lancDe(p.LANC_ID);
      linhas.push([dataBR(p.DATA_CREDITO), pastaCliente(l.PASTA, l.CLIENTE),
                   esc(p.TIPO + (p.NUM>0 ? ' ' + p.NUM : '')), nMoeda(p.VALOR_CREDITADO||p.VALOR), nMoeda(v)]);
    });
    crRec.filter(c => casaCat(c.CATEGORIA || '—')).forEach(c => {
      const v = tipo === 'tarifas' ? n(c.TARIFA) : tipo === 'repasse' ? n(c.VALOR_CLIENTE)
              : rd((n(c.VALOR_ESCRITORIO) || n(c.VALOR)) - n(c.TARIFA));
      if (!v) return; total += v;
      linhas.push([dataBR(c.DATA_RECEB), pastaCliente(c.PASTA, c.CLIENTE), esc(c.DESCRICAO||'—'),
                   nMoeda(c.VALOR), nMoeda(v)]);
    });

  } else {
    const contas = (DB.CONTAS_PAGAR||[])
      .filter(c => c.CATEGORIA !== 'Repasse a cliente' && noMes(c.VENCIMENTO))
      .filter(c => (c.CATEGORIA || 'Outras despesas') === cat)
      .sort((a,b) => String(a.VENCIMENTO).localeCompare(String(b.VENCIMENTO)));
    titulo = 'Despesas — ' + cat;
    cols = ['Vencimento','Descrição','Favorecido','Categoria','Situação','Valor'];
    linhas = contas.map(c => { total += n(c.VALOR);
      return [dataBR(c.VENCIMENTO), esc(c.DESCRICAO||'—'), esc(c.FAVORECIDO||'—'), esc(c.CATEGORIA||'—'),
              '<span class="tag '+(c.STATUS==='Pago'?'t-ok':'t-pend')+'">'+esc(c.STATUS)
              + (c.DATA_PGTO ? ' ' + dataBR(c.DATA_PGTO) : '')+'</span>', nMoeda(c.VALOR)]; });
  }

  modal(titulo + ' — ' + (mes ? mesBR(mes) : 'todo o período'),
    tabelaDetalhe(cols, linhas, total),
    '<button class="btn sec" onclick="fecharModal()">Fechar</button>', 'larga');
}
function tabelaDetalhe(cols, linhas, total){
  if (!linhas.length) return vazio('Nada neste período','Nenhum lançamento compõe este total.');
  const ultima = cols.length - 1;
  return '<div class="tw"><table class="densa"><thead><tr>'
    + cols.map((c,i) => '<th'+(i===ultima?' class="num"':'')+'>'+esc(c)+'</th>').join('')
    + '</tr></thead><tbody>'
    + linhas.map(l => '<tr>' + l.map((v,i) => '<td'+(i===ultima?' class="num"':'')+'>'+v+'</td>').join('') + '</tr>').join('')
    + '</tbody><tfoot><tr><th colspan="'+ultima+'" style="text-align:right">Total — '+linhas.length+' lançamento(s)</th>'
    + '<th class="num">'+nMoeda(total)+'</th></tr></tfoot></table></div>';
}



/* ══════════════════ EXPORTAÇÃO ══════════════════ */
function exportarCSV(qual){
  let cab = [], linhas = [];
  if (qual === 'contas-a-receber'){
    cab = ['Vencimento','Pasta','Cliente','Processo','Descrição','Valor','Cliente R$','Escritório R$'];
    pendentesReceber().sort((a,b)=>String(a.VENCIMENTO).localeCompare(String(b.VENCIMENTO))).forEach(p => {
      const l = lancDe(p.LANC_ID);
      const tf = tarifaDe(p, l);
      const sp = p.TIPO === 'Sucumbência' ? n(p.VALOR) : n(p.SUCUMBENCIA);
      const rateavel = rd(n(p.VALOR) - sp);
      linhas.push([dataBR(p.VENCIMENTO), l.PASTA, l.CLIENTE, l.N_PROCESSO, p.TIPO+(p.NUM>0?' '+p.NUM:''),
        nMoeda(p.VALOR), nMoeda(rd(rateavel*n(l.PCT_CLIENTE)/100 - tf)),
        nMoeda(rd(sp + rateavel*n(l.PCT_ESCRITORIO)/100 + tf))]);
    });
  } else if (qual === 'contas-recebidas'){
    cab = ['Crédito','Pasta','Cliente','Descrição','Valor','Cliente','Tarifa','Escritório'];
    (DB.PARCELAS||[]).filter(p => p.STATUS === 'Recebida').forEach(p => {
      const l = lancDe(p.LANC_ID);
      linhas.push([dataBR(p.DATA_CREDITO), l.PASTA, l.CLIENTE, p.TIPO+(p.NUM>0?' '+p.NUM:''),
        nMoeda(p.VALOR_CREDITADO||p.VALOR), nMoeda(p.VALOR_CLIENTE), nMoeda(p.TARIFA), nMoeda(p.VALOR_ESCRITORIO)]);
    });
  } else if (qual === 'contas-a-pagar'){
    cab = ['Recebido do cliente','Vencimento','Descrição','Favorecido','Categoria','Valor'];
    (DB.CONTAS_PAGAR||[]).filter(c => c.STATUS !== 'Pago').forEach(c => { const lb = liberacao(c);
      linhas.push([lb.tipo === 'na' ? '' : (lb.tipo === 'ok' ? 'SIM' : 'NAO'), dataBR(c.VENCIMENTO), c.DESCRICAO,
        c.FAVORECIDO, c.CATEGORIA, semValorCP(c) ? 'boleto nao recebido' : nMoeda(c.VALOR)]); });
  } else if (qual === 'contas-pagas'){
    cab = ['Pagamento','Vencimento','Descrição','Favorecido','Categoria','Valor','Origem'];
    (DB.CONTAS_PAGAR||[]).filter(c => c.STATUS === 'Pago')
      .sort((a,b) => String(b.DATA_PGTO).localeCompare(String(a.DATA_PGTO)))
      .forEach(c => linhas.push([dataBR(c.DATA_PGTO), dataBR(c.VENCIMENTO), c.DESCRICAO,
        c.FAVORECIDO, c.CATEGORIA, nMoeda(c.VALOR), c.ORIGEM]));
  } else if (qual === 'conta-corrente'){
    cab = ['Data','Histórico','Baixou','Conta','Entrada','Saída','Saldo acumulado'];
    const L = linhasCorrente();
    let acum = 0;
    L.forEach(r => { acum = rd(acum + n(r.m.VALOR)); r.saldo = acum; });
    L.slice().reverse().forEach(r => {
      const v = n(r.m.VALOR), d = ehDebito(r.m);
      linhas.push([dataBR(r.m.DATA), r.m.IDENTIFICACAO, r.nome, r.m.BANCO,
        d ? '' : nMoeda(v), d ? nMoeda(Math.abs(v)) : '', nMoeda(r.saldo)]);
    });
  } else {
    cab = ['Mês','Receita escritório','Repasses a clientes','Tarifas'];
    const M = {};
    (DB.PARCELAS||[]).filter(p => p.STATUS === 'Recebida').forEach(p => {
      const m = mesDe(p.DATA_CREDITO); M[m] = M[m] || [0,0,0];
      M[m][0] += n(p.VALOR_ESCRITORIO); M[m][1] += n(p.VALOR_CLIENTE); M[m][2] += n(p.TARIFA);
    });
    Object.keys(M).sort().forEach(m => linhas.push([mesBR(m), nMoeda(M[m][0]), nMoeda(M[m][1]), nMoeda(M[m][2])]));
  }
  const csv = [cab].concat(linhas).map(l => l.map(c => '"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'}));
  a.download = qual + '-' + hoje() + '.csv'; a.click(); URL.revokeObjectURL(a.href);
  toast('Arquivo gerado.','ok');
}

/* ══════════════════ CONTA CORRENTE ══════════════════
   Todos os movimentos já conciliados, em formato de extrato:
   a data mais recente primeiro, a mais antiga por último.
   ═══════════════════════════════════════════════════════ */
function linhasCorrente(){
  const conta = FILTROS.ccConta || '', de = FILTROS.ccDe || '', ate = FILTROS.ccAte || '';
  const vmin = FILTROS.ccMin, vmax = FILTROS.ccMax, tipo = FILTROS.ccTipo || '';
  const t = (FILTROS.busca||'').toLowerCase();
  return (DB.EXTRATO||[])
    .filter(m => m.STATUS === 'Conciliado')
    .filter(m => !conta || m.BANCO === conta)
    .filter(m => !de || String(m.DATA) >= de)
    .filter(m => !ate || String(m.DATA) <= ate)
    .filter(m => !tipo || (tipo === 'D' ? ehDebito(m) : !ehDebito(m)))
    .filter(m => { const v = Math.abs(n(m.VALOR));
      return (!vmin || v >= n(vmin)) && (!vmax || v <= n(vmax)); })
    .map(m => { const a = alvoDe(m);
      const nome = a.tipo === 'parcela' ? [a.l.CLIENTE, a.l.PASTA].filter(Boolean).join(' ')
                 : a.tipo === 'pagar' ? [a.cp.FAVORECIDO, a.cp.DESCRICAO].filter(Boolean).join(' ')
                 : a.tipo === 'receber' ? [a.cr.CLIENTE, a.cr.DESCRICAO].filter(Boolean).join(' ') : '';
      return {m, a, nome}; })
    .filter(r => !t || (String(r.m.IDENTIFICACAO||'') + ' ' + r.nome).toLowerCase().includes(t))
    .sort((a,b) => String(a.m.DATA).localeCompare(String(b.m.DATA)) || String(a.m.ID).localeCompare(String(b.m.ID)));
}
function telaContaCorrente(){
  const L = linhasCorrente();                       // ordem antiga → recente, para o saldo acumulado
  let acum = 0;
  L.forEach(r => { acum = rd(acum + n(r.m.VALOR)); r.saldo = acum; });
  const vis = L.slice().reverse();                  // exibição: mais recente primeiro

  const cred = L.filter(r => !ehDebito(r.m)).reduce((s,r) => s + n(r.m.VALOR), 0);
  const deb = L.filter(r => ehDebito(r.m)).reduce((s,r) => s + n(r.m.VALOR), 0);

  return cabec('Conta corrente', 'Extrato dos movimentos já conciliados, do mais recente para o mais antigo.',
      '<button class="btn sec" onclick="limparFiltrosCC()">Limpar filtros</button>'
    + '<button class="btn sec" onclick="exportarCSV(\'conta-corrente\')">Exportar CSV</button>')
    + '<div class="kpis">'
    + kpi('Entradas', moeda(cred), L.filter(r => !ehDebito(r.m)).length + ' crédito(s)', 'p')
    + kpi('Saídas', moeda(deb), L.filter(r => ehDebito(r.m)).length + ' débito(s)', 'n')
    + kpi('Resultado do período', moeda(rd(cred + deb)), 'entradas menos saídas', rd(cred+deb) >= 0 ? 'p' : 'n')
    + kpi('Movimentos', L.length, 'no filtro atual', 'd')
    + '</div>'
    + '<div class="filtros">'
    + campoBusca('Nome, favorecido, histórico…')
    + sel('ccConta','Conta bancária', opcoesContas(true), FILTROS.ccConta||'', '', 'onchange="setF(\'ccConta\',this.value)"')
    + '<div class="campo"><label for="ccDe">De</label><input type="date" id="ccDe" value="'+esc(FILTROS.ccDe||'')+'" onchange="setF(\'ccDe\',this.value)"></div>'
    + '<div class="campo"><label for="ccAte">Até</label><input type="date" id="ccAte" value="'+esc(FILTROS.ccAte||'')+'" onchange="setF(\'ccAte\',this.value)"></div>'
    + '<div class="campo"><label for="ccMin">Valor de</label><input id="ccMin" value="'+esc(FILTROS.ccMin||'')+'" placeholder="0,00" onchange="setF(\'ccMin\',this.value)"></div>'
    + '<div class="campo"><label for="ccMax">Valor até</label><input id="ccMax" value="'+esc(FILTROS.ccMax||'')+'" placeholder="0,00" onchange="setF(\'ccMax\',this.value)"></div>'
    + sel('ccTipo','Tipo', [['','Tudo'],['C','Entradas'],['D','Saídas']], FILTROS.ccTipo||'', '', 'onchange="setF(\'ccTipo\',this.value)"')
    + '</div>'
    + '<div class="card"><div class="tw"><table class="densa"><thead><tr><th>Data</th><th>Histórico</th><th>Baixou</th>'
    + '<th>Conta</th><th class="num">Entrada</th><th class="num">Saída</th><th class="num">Saldo acumulado</th><th></th></tr></thead><tbody>'
    + (vis.length ? vis.map(r => {
        const v = n(r.m.VALOR), d = ehDebito(r.m);
        return '<tr><td>'+dataBR(r.m.DATA)+'</td>'
          + '<td>'+esc(r.m.IDENTIFICACAO||'—')+'</td>'
          + '<td>'+r.a.quem+'</td>'
          + '<td class="mini">'+esc(r.m.BANCO||'—')+'</td>'
          + '<td class="num pos">'+(d ? '—' : nMoeda(v))+'</td>'
          + '<td class="num neg">'+(d ? nMoeda(Math.abs(v)) : '—')+'</td>'
          + '<td class="num'+(r.saldo < 0 ? ' neg' : '')+'">'+nMoeda(r.saldo)+'</td>'
          + '<td style="text-align:right"><button class="btn sm sec" onclick="desfazer(\''+r.m.ID+'\')">Desfazer</button></td></tr>';
      }).join('')
      : '<tr><td colspan="8">'+vazio('Nenhum movimento conciliado','Concilie os créditos e débitos do extrato para vê-los aqui.')+'</td></tr>')
    + '</tbody></table></div></div>'
    + '<p class="mini">O saldo acumulado soma apenas os movimentos conciliados dentro do filtro — não é o saldo da conta no banco.</p>';
}

    + (L.length ? L.map(c => '<tr><td><b>'+dataBR(c.DATA_PGTO)+'</b></td><td class="mini">'+dataBR(c.VENCIMENTO)+'</td>'
      + '<td'+(c.OBS?' title="'+esc(c.OBS)+'"':'')+'>'+esc(c.DESCRICAO)
      + (c.ORIGEM && c.ORIGEM !== 'Manual' ? '<div class="mini">'+esc(c.ORIGEM)+'</div>' : '') + '</td>'
      + '<td>'+esc(c.FAVORECIDO||'—')+'</td><td>'+esc(c.CATEGORIA||'—')+'</td>'
      + '<td class="num">'+nMoeda(c.VALOR)+'</td>'
      + '<td style="text-align:right;white-space:nowrap">'+botaoDesfazerPago(c)
      + ' <button class="btn sm per" onclick="apagarSimples(\'CONTAS_PAGAR\',\''+c.ID+'\')">Excluir</button></td></tr>').join('')
      : '<tr><td colspan="7">'+vazio('Nenhuma conta paga','As contas aparecem aqui quando o débito correspondente é conciliado no extrato.')+'</td></tr>')
    + '</tbody></table></div></div>';
}
function botaoDesfazerPago(c){
  const m = (DB.EXTRATO||[]).find(x => x.PARCELA_ID === c.ID && x.STATUS === 'Conciliado');
  return m ? '<button class="btn sm sec" onclick="desfazer(\''+m.ID+'\')">Desfazer baixa</button>'
           : '<span class="mini">—</span>';
}

</script>
