  });
  (DB.CONTAS_RECEBER||[]).filter(c => c.STATUS !== 'Recebido').forEach(c => {
    out.push({ tipo:'receber', id:c.ID, valor:n(c.VALOR), venc:c.VENCIMENTO,
      titulo:c.CLIENTE || c.DESCRICAO || '—', sub:c.CATEGORIA || 'Avulso',
      detalhe:c.DESCRICAO || '', doc:'', proc:'', nome:c.CLIENTE, pasta:'' });
  });
  return out;
}
/* candidatos para um débito na conta: contas a pagar em aberto e já liberadas */
/* Sugestão automática: só o que está liberado e com valor, para não propor
   um pagamento antes de o dinheiro do cliente ter entrado. */
function candidatosDebito(){ return memo('debito', montarDebito); }
function montarDebito(){
  return candidatosDebitoTodos().filter(c => !c.travado && c.valor > 0);
}
/* Lista completa, usada no vínculo manual: inclui os repasses ainda com ✕ e as
   contas sem boleto, porque o débito no extrato prova que o pagamento ocorreu. */
function candidatosDebitoTodos(){ return memo('debitoTodos', montarDebitoTodos); }
function montarDebitoTodos(){
  return (DB.CONTAS_PAGAR||[]).filter(c => c.STATUS !== 'Pago').map(c => {
    const lb = liberacao(c);
    return { tipo:'pagar', id:c.ID, valor:n(c.VALOR), venc:c.VENCIMENTO,
      titulo:c.FAVORECIDO || c.DESCRICAO || '—', sub:c.CATEGORIA || '',
      detalhe:c.DESCRICAO || '', doc:'', proc:'', nome:c.FAVORECIDO, pasta:'',
      travado: lb.tipo === 'nao', semBoleto: !n(c.VALOR) };
  });
}
const ehDebito = mov => n(mov.VALOR) < 0;

function sugestoes(mov, ignorarData){
  const desc = String(mov.IDENTIFICACAO||''), descNum = digitos(desc), vm = Math.abs(n(mov.VALOR));
  const res = [];
  (ehDebito(mov) ? candidatosDebito() : candidatosCredito()).forEach(c => {
    let s = 0; const por = [];
    const dif = Math.abs(c.valor - vm);
    // acima de R$ 1,00 de diferença o registro nem é sugerido
    if (dif > 1) return;
    if (dif <= 0.01){ s += 50; por.push('valor idêntico'); }
    else { s += 28; por.push('valor próximo (dif. '+moeda(dif)+')'); }

    const doc = digitos(c.doc);
    if (doc.length >= 11 && descNum.includes(doc)){ s += 40; por.push('CNPJ/CPF do cliente na descrição'); }

    const proc = digitos(c.proc);
    if (proc.length >= 6){
      const achou = trechosNum(desc, 6).some(t => proc.includes(t) || t.includes(proc.slice(0,9)));
      if (achou){ s += 45; por.push('número do processo (parcial) na descrição'); }
    }
    const nomes = String(c.nome||'').toUpperCase().split(/\s+/).filter(w => w.length > 3);
    if (nomes.length && nomes.some(w => desc.toUpperCase().includes(w))){ s += 15; por.push('nome na descrição'); }
    if (c.pasta && desc.toUpperCase().includes(String(c.pasta).toUpperCase())){ s += 20; por.push('pasta na descrição'); }

    if (!ignorarData){
      const d = diasEntre(c.venc, mov.DATA);
      if (d <= 3){ s += 12; por.push('vencimento na mesma semana'); }
      else if (d <= 15){ s += 6; }
    }
    if (s > 0) res.push({c, score:s, por});
  });
  return res.sort((a,b) => b.score - a.score).slice(0,6);
}
let SUG_ABERTAS = new Set();
function alternarSugestoes(id){
  if (SUG_ABERTAS.has(id)) SUG_ABERTAS.delete(id); else SUG_ABERTAS.add(id);
  render();
}
function boxSugestoes(mov, ignorarData, vazioTxt){
  const sg = sugestoes(mov, ignorarData);
  const deb = ehDebito(mov);
  if (!sg.length) return '<p class="mini">'
    + esc(vazioTxt || (deb ? 'Nenhuma conta a pagar em aberto compatível com este débito.'
                           : 'Sem correspondência em contas a receber.')) + '</p>';
  const abertas = SUG_ABERTAS.has(mov.ID);
  const mostra = abertas ? sg : sg.slice(0, 3);
  return mostra.map(x => {
    const det = [x.c.sub, 'venc. ' + dataBR(x.c.venc), x.c.detalhe, x.por.join('; ')].filter(Boolean).join(' · ');
    return '<div class="sug"><div class="info" title="'+esc(det)+'">'
      + '<b>'+esc(x.c.titulo)+'</b><span class="num">'+moeda(x.c.valor)+'</span>'
      + '<span class="det">'+esc(det)+'</span></div>'
      + '<span class="score '+(x.score>=80?'alto':x.score<40?'baixo':'')+'">'+x.score+'</span>'
      + '<button class="btn sm ok" onclick="conciliar(\''+mov.ID+'\',\''+x.c.id+'\')">Conciliar</button></div>';
  }).join('')
    + (sg.length > 3
        ? '<button class="maisSug" onclick="alternarSugestoes(\''+mov.ID+'\')">'
          + (abertas ? 'mostrar menos' : 'mais ' + (sg.length - 3) + ' sugestão(ões)') + '</button>'
        : '');
}

          + '<button class="btn sm" onclick="abrirConfig(\'contas\')">Cadastrar conta</button></div></div>')
    + subtabs([['pendentes','Pendentes ('+pend.length+')'],
               ['conciliados','Conciliados ('+conc.length+')'],
               ['naoid','Depósitos não identificados ('+naoId.length+')'],
               ['execucao','Acordos em execução ('+lancsEmExecucao().length+')'],
               ['semdados','Sem dados bancários ('+contasSemDados().length+')']])

function listaPendentes(pend){
  if (!pend.length) return '<div class="card">'+vazio('Nada pendente','Importe um extrato para o sistema sugerir os vínculos.')+'</div>';
  const t = FILTROS.busca, tipo = FILTROS.fTipoMov || '';
  const L = pend.filter(m => casa(m, ['IDENTIFICACAO','DATA'], t) || casaValor(m.VALOR, t))
    .filter(m => !tipo || (tipo === 'D' ? ehDebito(m) : !ehDebito(m)))
    .sort((a,b) => String(a.DATA).localeCompare(String(b.DATA)));
  const filtros = '<div class="filtros">' + campoBusca('Descrição ou valor do extrato…')
    + sel('fTipoMov','Tipo', [['','Créditos e débitos'],['C','Só créditos'],['D','Só débitos']], tipo, '', 'onchange="setF(\'fTipoMov\',this.value)"')
    + '</div>';
  if (!L.length) return filtros + '<div class="card">'+vazio('Nada neste filtro','Ajuste a busca ou o tipo de movimento.')+'</div>';
  // cada movimento na tela pesquisa todos os registros em aberto; mostrar em
  // blocos mantém a conciliação instantânea mesmo com centenas de pendências
  const passo = 20;
  const quantos = Math.min(L.length, FILTROS.pendVis || passo);
  return filtros
    + L.slice(0, quantos).map(m => '<div class="card fino"><div class="corpo conc">'
      + ladoMovimento(m)
      + '<div class="sugs">' + boxSugestoes(m) + '</div></div></div>').join('')
    + (quantos < L.length
        ? '<div style="text-align:center;margin:14px 0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">'
          + '<button class="btn sec" onclick="setF(\'pendVis\','+(quantos+passo)+')">'
          + 'Mostrar mais ' + Math.min(passo, L.length - quantos)
          + ' de ' + (L.length - quantos) + ' restantes</button>'
          + '<button class="btn sec" onclick="mostrarTodosPendentes('+L.length+')">'
          + 'Mostrar tudo (' + L.length + ')</button></div>'
        : (L.length > passo
            ? '<div style="text-align:center;margin:14px 0">'
              + '<button class="btn sec" onclick="setF(\'pendVis\','+passo+')">Mostrar menos</button></div>'
            : ''));
}

/* muitos movimentos de uma vez deixam a tela pesada: confirma antes */
function mostrarTodosPendentes(total){
  if (total > 120 && !confirm('Mostrar todos os ' + total + ' movimentos de uma vez?\n\n'
      + 'Cada movimento pesquisa os registros em aberto, então a tela pode demorar alguns segundos para desenhar.')) return;
  setF('pendVis', total);
}
function listaNaoIdentificados(L){
  if (!L.length) return '<div class="card">'+vazio('Nenhum movimento não identificado','Depósitos sem origem aparecem aqui com sugestões de pastas de mesmo valor.')+'</div>';
  const F = L.filter(m => entreDatas(m.DATA, FILTROS.niDe, FILTROS.niAte))
             .filter(m => contem(m.IDENTIFICACAO + ' ' + (m.OBS||''), FILTROS.niBusca))
             .filter(m => entreValores(Math.abs(n(m.VALOR)), FILTROS.niMin, FILTROS.niMax));
  const creditos = F.filter(m => !ehDebito(m));
  const somaCred = rd(creditos.reduce((s,m) => s + Math.abs(n(m.VALOR)), 0));
  const somaDeb = rd(F.filter(ehDebito).reduce((s,m) => s + Math.abs(n(m.VALOR)), 0));
  const datas = F.map(m => m.DATA).filter(Boolean).sort();
  const filtrando = FILTROS.niDe || FILTROS.niAte || FILTROS.niBusca || FILTROS.niMin || FILTROS.niMax;

  const topo = '<div class="kpis">'
    + kpi('Total não identificado', moeda(somaCred),
          creditos.length + ' depósito(s)' + (filtrando ? ' no filtro' : ''), creditos.length ? 'n' : '')
    + kpi('Período', datas.length ? dataBR(datas[0]) + ' a ' + dataBR(datas[datas.length-1]) : '—',
          'do mais antigo ao mais recente', 'd')
    + (somaDeb
        ? kpi('Débitos sem origem', moeda(somaDeb), F.filter(ehDebito).length + ' movimento(s)', 'b')
        : kpi('Movimentos', F.length, filtrando ? 'de ' + L.length + ' no total' : 'a identificar', 'b'))
    + '</div>'
    + '<div class="filtros">'
    + campoData('niDe','Crédito de') + campoData('niAte','até')
    + campoTexto('niBusca','Histórico ou observação','buscar…')
    + campoValor('niMin','Valor de') + campoValor('niMax','Valor até')
    + botaoLimpar(['niDe','niAte','niBusca','niMin','niMax'])
    + '</div>';

  if (!F.length) return topo + '<div class="card">'
    + vazio('Nada neste filtro','Ajuste as datas, o valor ou a busca.')+'</div>';

  return topo + F.sort((a,b) => String(a.DATA).localeCompare(String(b.DATA))).map(m =>
    '<div class="card fino"><div class="corpo conc">'
    + ladoMovimento(m, '<button class="btn sm sec" onclick="voltarPendente(\''+m.ID+'\')">Voltar para pendentes</button>'
                     + '<button class="btn sm sec" onclick="formObsMov(\''+m.ID+'\')">Observações</button>')
    + '<div class="sugs"><p class="mini" style="margin-bottom:5px">'
    + (ehDebito(m) ? 'Contas a pagar em aberto com o mesmo valor:'
                   : 'Pastas em aberto com o mesmo valor, inclusive acordos lançados depois do crédito:') + '</p>'
    + boxSugestoes(m, true, 'Nenhum registro em aberto com esse valor. Assim que o acordo for lançado, a sugestão aparece aqui.')
    + '</div></div></div>').join('');
}
/* descreve o destino de um movimento já conciliado; um movimento pode ter vários */
function alvoUnico(id){
  const p = parcDe(id);
  if (p){ const l = lancDe(p.LANC_ID);
    return {tipo:'parcela', id, p, l, quem:pastaCliente(l.PASTA, l.CLIENTE),
            resumo:(l.PASTA ? l.PASTA + ' · ' : '') + (l.CLIENTE || '—'),
            cli:n(p.VALOR_CLIENTE), esc:n(p.VALOR_ESCRITORIO)}; }
  const cp = indices().cp.get(id);
  if (cp) return {tipo:'pagar', id, cp, quem:'<b>'+esc(cp.FAVORECIDO||cp.DESCRICAO||'—')+'</b>'
            + '<div class="mini">'+esc(cp.CATEGORIA||'')+'</div>',
            resumo:(cp.FAVORECIDO || cp.DESCRICAO || '—'), cli:0, esc:0};
  const cr = indices().cr.get(id);
  if (cr) return {tipo:'receber', id, cr,
    quem: cr.PASTA ? pastaCliente(cr.PASTA, cr.CLIENTE) : '<b>'+esc(cr.CLIENTE||cr.DESCRICAO||'—')+'</b>',
    resumo:(cr.CLIENTE || cr.DESCRICAO || '—'),
    cli:n(cr.VALOR_CLIENTE), esc:n(cr.VALOR_ESCRITORIO) || n(cr.VALOR)};
  return {tipo:'', id, quem:'<span class="mini">—</span>', resumo:'—', cli:0, esc:0};
}
const idsDoMov = m => String((m && m.PARCELA_ID) || '').split('|').filter(Boolean);
function alvosDe(m){ return idsDoMov(m).map(alvoUnico); }
function alvoDe(mov){
  const L = alvosDe(mov);
  if (!L.length) return {tipo:'', quem:'<span class="mini">—</span>', cli:0, esc:0, itens:[]};
  if (L.length === 1) return Object.assign({}, L[0], {itens:L});
  return {tipo:'varios', itens:L,
    quem:'<b>'+L.length+' registros</b><div class="mini">'+esc(L.map(a => a.resumo).join(' · '))+'</div>',
    cli:rd(L.reduce((s,a) => s + n(a.cli), 0)), esc:rd(L.reduce((s,a) => s + n(a.esc), 0))};
}
function listaConciliados(L){
  const t = (FILTROS.busca||'').toLowerCase();
  const de = FILTROS.cnDe || '', ate = FILTROS.cnAte || '';
  const vmin = FILTROS.cnMin, vmax = FILTROS.cnMax;
  const F = L
    .filter(m => !de || String(m.DATA) >= de)
    .filter(m => !ate || String(m.DATA) <= ate)
    .filter(m => { const v = Math.abs(n(m.VALOR)); return (!vmin || v >= n(vmin)) && (!vmax || v <= n(vmax)); })
    .filter(m => { if (!t) return true;
      const a = alvoDe(m);
      const quem = a.tipo === 'parcela' ? [a.l.CLIENTE, a.l.PASTA].join(' ')
                 : a.tipo === 'pagar' ? [a.cp.FAVORECIDO, a.cp.DESCRICAO].join(' ')
                 : a.tipo === 'receber' ? [a.cr.CLIENTE, a.cr.DESCRICAO].join(' ') : '';
      return (String(m.IDENTIFICACAO||'') + ' ' + quem).toLowerCase().includes(t) || casaValor(m.VALOR, t); })
    .sort((a,b) => String(b.DATA).localeCompare(String(a.DATA)));
  const filtros = '<div class="filtros">' + campoBusca('Identificação, cliente, favorecido ou valor…')
    + '<div class="campo"><label for="cnDe">De</label><input type="date" id="cnDe" value="'+esc(de)+'" onchange="setF(\'cnDe\',this.value)"></div>'
    + '<div class="campo"><label for="cnAte">Até</label><input type="date" id="cnAte" value="'+esc(ate)+'" onchange="setF(\'cnAte\',this.value)"></div>'
    + '<div class="campo"><label for="cnMin">Valor de</label><input id="cnMin" value="'+esc(vmin||'')+'" placeholder="0,00" onchange="setF(\'cnMin\',this.value)"></div>'
    + '<div class="campo"><label for="cnMax">Valor até</label><input id="cnMax" value="'+esc(vmax||'')+'" placeholder="0,00" onchange="setF(\'cnMax\',this.value)"></div>'
    + '<div class="campo" style="min-width:0"><label>&nbsp;</label><button class="btn sec" onclick="limparFiltrosConc()">Limpar</button></div>'
    + '</div>';
  if (!F.length) return filtros + '<div class="card">'
    + vazio('Nada conciliado neste filtro','Ajuste as datas, o valor ou a busca — ou confirme os vínculos na aba de pendentes.')+'</div>';
  return filtros + '<div class="card"><div class="tw"><table class="densa">'
    + '<thead><tr><th>Data</th><th>Identificação</th><th class="num">Valor</th><th>Baixou</th>'
    + '<th class="num">Cliente</th><th class="num">Escritório</th><th></th></tr></thead><tbody>'
    + F.map(m => { const a = alvoDe(m);
        return '<tr>' + linhaMov(m) + '<td>'+a.quem+'</td>'
          + '<td class="num">'+(a.cli?nMoeda(a.cli):'—')+'</td><td class="num">'+(a.esc?nMoeda(a.esc):'—')+'</td>'
          + '<td style="text-align:right;white-space:nowrap">'
          + '<button class="btn sm sec" onclick="abrirAlvo(\''+m.ID+'\')">Abrir</button> '
          + '<button class="btn sm sec" onclick="desfazer(\''+m.ID+'\')">Desfazer</button></td></tr>'; }).join('')
    + '</tbody></table></div></div>';
}
/* abre o registro que recebeu a baixa deste movimento */
function abrirAlvo(movId){
  const m = (DB.EXTRATO||[]).find(x => x.ID === movId);
  if (!m) return toast('Movimento não encontrado.','erro');
  const alvos = alvosDe(m);
  if (!alvos.length) return toast('Este movimento não tem registro vinculado.','erro');
  if (alvos.length === 1) return abrirUmAlvo(alvos[0]);
  // conciliado com vários: mostra a lista para escolher
  modal('Registros deste movimento — ' + moeda(m.VALOR),
    '<p class="mini" style="margin-bottom:10px">Movimento de '+dataBR(m.DATA)+' conciliado com '
    + alvos.length + ' registros.</p>'
    + '<div class="tw"><table class="densa"><thead><tr><th>Registro</th><th class="num">Cliente</th>'
    + '<th class="num">Escritório</th><th></th></tr></thead><tbody>'
    + alvos.map((a,i) => '<tr><td>'+a.quem+'</td>'
      + '<td class="num">'+(a.cli?nMoeda(a.cli):'—')+'</td>'
      + '<td class="num">'+(a.esc?nMoeda(a.esc):'—')+'</td>'
      + '<td style="text-align:right"><button class="btn sm sec" '
      + 'onclick="fecharModal();abrirAlvoDoMov(\''+movId+'\','+i+')">Abrir</button></td></tr>').join('')
    + '</tbody></table></div>',
    '<button class="btn sec" onclick="fecharModal()">Fechar</button>', 'larga');
}
function abrirAlvoDoMov(movId, i){
  const m = (DB.EXTRATO||[]).find(x => x.ID === movId); if (!m) return;
  const a = alvosDe(m)[i]; if (a) abrirUmAlvo(a);
}
function abrirUmAlvo(a){
  if (a.tipo === 'parcela') return verParcelas(a.p.LANC_ID);
  if (a.tipo === 'receber') return formRecebida(a.id);
  if (a.tipo === 'pagar') return formCP(a.id);
  toast('Registro de origem não encontrado — ele pode ter sido excluído.','erro');
}
function limparFiltrosConc(){
  ['cnDe','cnAte','cnMin','cnMax','busca'].forEach(k => delete FILTROS[k]);
  render();
}

/* ── Conciliar ── */
/* ══════════════════ CONCILIAR ══════════════════
   Um movimento pode ser conciliado com um registro ou com vários.
   Cada rotina abaixo monta o que precisa ser gravado; quem chama junta tudo
   num único lote, para o extrato e os destinos irem para a nuvem de uma vez. */

function loteParcela(m, p, valor){
  const l = lancDe(p.LANC_ID);
  const suc = p.TIPO === 'Sucumbência';
  const sucP = suc ? valor : sucDaParcela(p, valor);
  const tarifa = suc ? 0 : tarifaDe(p, l);   // no acordo CPC a tarifa vem marcada na parcela
  const baseCom = escPrevisto(p, l, valor);          // parte do escritório, sem a tarifa
  const vEsc = rd(baseCom + tarifa);
  const vCli = rd(valor - baseCom - tarifa);

  const lote = [];
  const cpAntigo = (DB.CONTAS_PAGAR||[]).find(c => c.ID === p.CP_ID)
                || (DB.CONTAS_PAGAR||[]).find(c => c.PARCELA_ID === p.ID && c.CATEGORIA === 'Repasse a cliente');
  const cpId = vCli > 0 ? (cpAntigo ? cpAntigo.ID : uid('cp')) : '';

  lote.push({aba:'PARCELAS', registro: Object.assign({}, p, {
    STATUS:'Recebida', DATA_CREDITO:m.DATA, VALOR_CREDITADO:valor, MOV_ID:m.ID,
    VALOR_CLIENTE:vCli, VALOR_ESCRITORIO:vEsc, TARIFA:tarifa, CP_ID:cpId })});

  if (vCli > 0){
    lote.push({aba:'CONTAS_PAGAR', registro: Object.assign({}, cpAntigo || {}, {
      ID:cpId, DESCRICAO:(cpAntigo && cpAntigo.DESCRICAO) || ('Repasse ao cliente — pasta '+(l.PASTA||'—')+(p.NUM>0?' · parcela '+p.NUM:'')),
      FAVORECIDO:l.CLIENTE||'', CATEGORIA:'Repasse a cliente', VENCIMENTO:m.DATA, VALOR:vCli,
      STATUS:(cpAntigo && cpAntigo.STATUS) || 'Em aberto', DATA_PGTO:(cpAntigo && cpAntigo.DATA_PGTO) || '',
      ORIGEM:'Repasse de parcela', PARCELA_ID:p.ID, ANEXO_URL:(cpAntigo && cpAntigo.ANEXO_URL) || '',
      OBS:'Liberado — crédito de '+moeda(valor)+' conciliado em '+dataBR(m.DATA)
          +' · '+memoriaValores(valor, baseCom, tarifa, sucP) })});
  }
  (DB.REGRAS_COMISSAO||[])
    .filter(r => r.SUBCLASSE && r.SUBCLASSE === l.SUBCLASSE)
    .filter(r => regraCobrePraca(r, l.PRACA))
    .forEach(r => {
      const base = n(r.PCT_BASE) > 0 ? rd(valor * n(r.PCT_BASE) / 100) : baseCom;
      const pctAplicado = pctDaRegra(r, l.EXEC === 'SIM');
      const v = rd(base * pctAplicado / 100);
      if (v <= 0) return;
      lote.push({aba:'COMISSOES', registro:{ ID:uid('co'), PARCELA_ID:p.ID, LANC_ID:l.ID, CLIENTE:l.CLIENTE||'',
        COMISSIONADO_ID:r.COMISSIONADO_ID, BASE:base, PCT:pctAplicado, VALOR:v,
        STATUS:'A pagar', DATA:m.DATA, CP_ID:'' }});
    });
  return {lote, resumo: vCli > 0 ? moeda(vCli)+' para o cliente · '+moeda(vEsc)+' para o escritório'
                                 : 'valor integral do escritório'};
}

function lotePagamento(m, cp, valor, forcar){
  if (!forcar && liberacao(cp).tipo === 'nao')
    return {erro:'A parcela de "'+(cp.FAVORECIDO||cp.DESCRICAO||'—')+'" ainda não foi conciliada. '
      + 'Use "Vincular manualmente" se o pagamento já saiu da conta e você quer registrar a baixa.'};
  const lote = [{aba:'CONTAS_PAGAR', registro: Object.assign({}, cp, {STATUS:'Pago', DATA_PGTO:m.DATA, VALOR:valor,
    OBS:'Pago pelo débito de '+moeda(valor)+' conciliado em '+dataBR(m.DATA)})}];
  (DB.COMISSOES||[]).filter(c => c.CP_ID === cp.ID).forEach(c =>
    lote.push({aba:'COMISSOES', registro: Object.assign({}, c, {STATUS:'Paga'})}));
  return {lote, resumo:'pagamento de '+moeda(valor)+' baixado'};
}

function loteRecebimento(m, cr, valor){
  const lote = [{aba:'CONTAS_RECEBER', registro: Object.assign({}, cr, {STATUS:'Recebido', DATA_RECEB:m.DATA, VALOR:valor,
    OBS:'Recebido pelo crédito conciliado em '+dataBR(m.DATA)})}];
  comissoesDoRecebimento(Object.assign({}, cr, {VALOR:valor}), valor, m.DATA).forEach(c => lote.push(c));
  return {lote, resumo:'recebimento de '+moeda(valor)+' conciliado'};
}
/* comissões do recebimento avulso: mesmas regras das parcelas */
function comissoesDoRecebimento(cr, valor, data){
  const baseCom = rd((n(cr.VALOR_ESCRITORIO) || 0) - n(cr.TARIFA));
  if (baseCom <= 0) return [];
  return (DB.REGRAS_COMISSAO||[])
    .filter(r => r.SUBCLASSE && r.SUBCLASSE === cr.CATEGORIA)
    .filter(r => regraCobrePraca(r, cr.PRACA))
    .map(r => {
      const base = n(r.PCT_BASE) > 0 ? rd(n(valor) * n(r.PCT_BASE) / 100) : baseCom;
      const pctAplicado = pctDaRegra(r, cr.EXEC === 'SIM');
      const v = rd(base * pctAplicado / 100);
      if (v <= 0) return null;
      return {aba:'COMISSOES', registro:{ ID:uid('co'), PARCELA_ID:cr.ID, LANC_ID:'', CLIENTE:cr.CLIENTE||'',
        COMISSIONADO_ID:r.COMISSIONADO_ID, BASE:base, PCT:pctAplicado, VALOR:v,
        STATUS:'A pagar', DATA:data, CP_ID:'' }};
    }).filter(Boolean);
}

/* monta o que gravar para um destino, seja ele parcela, recebimento ou conta a pagar */
function loteDoAlvo(m, alvoId, valor, forcar){
  const p = parcDe(alvoId);
  if (p) return loteParcela(m, p, valor);
  const cp = indices().cp.get(alvoId);
  if (cp) return lotePagamento(m, cp, valor, forcar);
  const cr = indices().cr.get(alvoId);
  if (cr) return loteRecebimento(m, cr, valor);
  return {erro:'Registro de destino não encontrado.'};
}

async function conciliar(movId, alvoId, forcar){
  const m = (DB.EXTRATO||[]).find(x => x.ID === movId);
  if (!m) return toast('Movimento não encontrado.','erro');
  return conciliarVarios(movId, [{id:alvoId, valor:rd(Math.abs(n(m.VALOR))), forcar:!!forcar}]);
}

async function conciliarVarios(movId, itens){
  const m = (DB.EXTRATO||[]).find(x => x.ID === movId);
  if (!m) return toast('Movimento não encontrado.','erro');
  const total = rd(Math.abs(n(m.VALOR)));
  const sel = (itens||[]).filter(x => x.id && rd(n(x.valor)) > 0);
  if (!sel.length) return toast('Escolha ao menos um registro com valor.','erro');
  const soma = rd(sel.reduce((s,x) => s + rd(n(x.valor)), 0));
  if (Math.abs(soma - total) > 0.01)
    return toast('A soma dos vínculos ('+moeda(soma)+') precisa fechar com o movimento ('+moeda(total)+').','erro');

  let lote = [], resumos = [];
  for (const x of sel){
    const r = loteDoAlvo(m, x.id, rd(n(x.valor)), x.forcar);
    if (r.erro) return toast(r.erro,'erro');
    lote = lote.concat(r.lote);
    resumos.push(r.resumo);
  }
  lote.push({aba:'EXTRATO', registro: Object.assign({}, m,
    {STATUS:'Conciliado', PARCELA_ID: sel.map(x => x.id).join('|')})});

  salvarLoteRapido(lote);
  toast(sel.length > 1
    ? 'Movimento conciliado com ' + sel.length + ' registros.'
    : 'Conciliado — ' + resumos[0] + '.', 'ok');
}

/* ── Vincular vários registros a um movimento ── */
let VINC = {};
function formVincularVarios(movId){
  const m = (DB.EXTRATO||[]).find(x => x.ID === movId); if (!m) return;
  const deb = ehDebito(m);
  const cands = (deb ? candidatosDebito() : candidatosCredito())
    .sort((a,b) => String(a.venc).localeCompare(String(b.venc)));
  if (!cands.length) return toast(deb ? 'Não há contas a pagar liberadas para vincular.' : 'Não há registros em aberto para vincular.','erro');
  VINC = {}; FILTROS.vincBusca = '';
  modal('Vincular vários registros — ' + moeda(m.VALOR),
    '<p class="mini" style="margin-bottom:12px">Movimento de <b>'+moeda(m.VALOR)+'</b> em '+dataBR(m.DATA)
    + (m.BANCO ? ' · '+esc(m.BANCO) : '') + ' — '+esc(m.IDENTIFICACAO||'')+'</p>'
    + '<div class="campo" style="margin-bottom:12px"><label for="vincBusca">Buscar</label>'
    + '<input id="vincBusca" autocomplete="off" placeholder="cliente, pasta, favorecido, processo ou valor" '
    + 'oninput="buscaVinculos(\'' + movId + '\', this.value)"></div>'
    + '<div id="boxVinc"></div>',
    '<button class="btn sec" onclick="fecharModal()">Cancelar</button>'
    + '<button class="btn ok" onclick="confirmarVinculos(\'' + movId + '\')">Conciliar selecionados</button>', 'larga');
  pintarVinculos(movId);
  const e = document.getElementById('vincBusca'); if (e) e.focus();
}
/* a busca redesenha só a lista da janela — render() redesenharia a tela de fundo */
function buscaVinculos(movId, texto){
  FILTROS.vincBusca = texto;
  pintarVinculos(movId);
}
function pintarVinculos(movId){
  const box = document.getElementById('boxVinc'); if (!box) return;
  const m = (DB.EXTRATO||[]).find(x => x.ID === movId);
  const total = rd(Math.abs(n(m.VALOR)));
  const termo = String(FILTROS.vincBusca || '').trim().toLowerCase();
  const casaTermo = c => !termo
    || [c.titulo, c.detalhe, c.sub, c.pasta, c.proc, c.nome].join(' ').toLowerCase().includes(termo)
    || casaValor(c.valor, termo);
  const todos = (ehDebito(m) ? candidatosDebitoTodos() : candidatosCredito())
    .filter(casaTermo)
    .sort((a,b) => String(a.venc).localeCompare(String(b.venc)));
  const cands = todos.slice(0, 80);
  const soma = rd(Object.keys(VINC).reduce((s,k) => s + rd(n(VINC[k])), 0));
  const falta = rd(total - soma);

  if (!cands.length){
    box.innerHTML = vazio('Nada encontrado','Tente outro nome, a pasta, o processo ou o valor.')
      + '<div class="barraSel" style="margin-top:12px"><b>'+Object.keys(VINC).length+'</b> selecionado(s) · '
      + 'soma ' + moeda(soma) + ' de ' + moeda(total)
      + '<span style="flex:1"></span>'
      + '<button class="btn sm sec" onclick="VINC={};pintarVinculos(\''+movId+'\')">Limpar</button></div>';
    return;
  }
  box.innerHTML = '<div class="tw" style="max-height:340px;overflow:auto"><table class="densa">'
    + '<thead><tr><th style="width:34px"></th><th>Registro</th><th>Vencimento</th>'
    + '<th class="num">Em aberto</th><th class="num">Valor a usar</th></tr></thead><tbody>'
    + cands.map(c => {
        const marcado = VINC[c.id] !== undefined;
        return '<tr'+(marcado ? ' class="sel"' : '')+'>'
          + '<td><input type="checkbox" '+(marcado?'checked':'')
            + ' style="width:16px;height:16px;accent-color:var(--brand)"'
            + ' onchange="marcarVinculo(\'' + movId + '\',\'' + c.id + '\',this.checked,' + c.valor + ')"></td>'
          + '<td><b>'+esc(c.titulo)+'</b><div class="mini">'+esc(c.sub + (c.detalhe ? ' · ' + c.detalhe : ''))+'</div>'
            + (c.travado ? '<div class="mini"><span class="tag t-ni">✕ crédito do cliente ainda não conciliado</span></div>' : '')
            + (c.semBoleto ? '<div class="mini"><span class="tag t-pend">sem boleto</span></div>' : '')+'</td>'
          + '<td>'+dataBR(c.venc)+'</td>'
          + '<td class="num">'+(c.semBoleto ? '<span class="mini">—</span>' : nMoeda(c.valor))+'</td>'

function marcarVinculo(movId, id, marcado, aberto){
  if (!marcado){ delete VINC[id]; }
  else {
    const m = (DB.EXTRATO||[]).find(x => x.ID === movId);
    const total = rd(Math.abs(n(m.VALOR)));
    const usado = rd(Object.keys(VINC).reduce((s,k) => s + rd(n(VINC[k])), 0));
    const falta = rd(total - usado);
    const ab = rd(n(aberto));
    // conta sem boleto não tem valor lançado: usa o que falta do movimento
    VINC[id] = ab > 0 ? rd(Math.min(ab, falta > 0 ? falta : ab)) : rd(falta > 0 ? falta : total);
  }
  pintarVinculos(movId);
}
function confirmarVinculos(movId){
  const travados = Object.keys(VINC)
    .map(id => (indices().cp.get(id) || null))
    .filter(cp => cp && liberacao(cp).tipo === 'nao');
  if (travados.length && !confirm(travados.length + ' repasse(s) selecionado(s) ainda não tiveram o crédito '
      + 'do cliente conciliado.\n\nO débito já saiu da conta, então o pagamento aconteceu. Registrar a baixa mesmo assim?')) return;
  const itens = Object.keys(VINC).map(id => ({id, valor:VINC[id], forcar:true}));
  fecharModal();
  return conciliarVarios(movId, itens);
}

/* acha o movimento do extrato que deu baixa num registro */
function movDoRegistro(id){
  return (DB.EXTRATO||[]).find(m => m.STATUS === 'Conciliado' && idsDoMov(m).indexOf(id) > -1) || null;
}
/* desfaz a baixa de um registro: ele volta para contas a receber ou a pagar
   e o movimento volta para a fila da conciliação */
async function desconciliarRegistro(id){
  const mov = movDoRegistro(id);
  if (mov){
    const juntos = idsDoMov(mov);
    if (juntos.length > 1 && !confirm('Este movimento do extrato foi conciliado com ' + juntos.length
        + ' registros de uma vez. Desconciliar devolve todos eles e o movimento inteiro volta para a conciliação.\n\nContinuar?')) return;
    return desfazer(mov.ID);
  }
  // registro dado como recebido sem movimento vinculado
  const a = alvoUnico(id);
  if (!a.tipo) return toast('Registro não encontrado.','erro');
  if (!confirm('Este registro está baixado sem movimento vinculado no extrato. Devolvê-lo para contas a '
      + (a.tipo === 'pagar' ? 'pagar' : 'receber') + '?')) return;
  const r = reverterAlvo(a);
  if (r.erro) return toast(r.erro,'erro');
  if (r.apagar && r.apagar.length){
    r.apagar.forEach(x => { DB[x.aba] = (DB[x.aba]||[]).filter(y => y.ID !== x.id); });
  }
  enfileirar(r.lote, r.apagar || []);
  r.lote.forEach(it => {
    const L = DB[it.aba] || (DB[it.aba] = []);
    const j = L.findIndex(x => x.ID === it.registro.ID);
    if (j >= 0) L[j] = it.registro; else L.push(it.registro);
  });
  invalidarIdx(); render();
  toast('Registro devolvido para contas a ' + (a.tipo === 'pagar' ? 'pagar' : 'receber') + '.','ok');
}

/* Vincula um registro. Se o valor não bater com o extrato, pergunta se o
   registro deve passar a valer o que realmente caiu na conta. */
function vincularUm(movId, alvoId, valorRegistro, travado){
  const m = (DB.EXTRATO||[]).find(x => x.ID === movId); if (!m) return;
  const mov = rd(Math.abs(n(m.VALOR)));
  const reg = rd(n(valorRegistro));
  if (travado){
    const cp = indices().cp.get(alvoId) || {};
    const lb = liberacao(cp);
    if (!confirm('A parcela do cliente "' + (cp.FAVORECIDO || '—') + '" ainda não foi conciliada'
        + (lb.p ? ' (falta o crédito de ' + moeda(lb.p.VALOR) + ')' : '')
        + '.\n\nO débito de ' + moeda(mov) + ' já saiu da conta, então o pagamento aconteceu. '
        + 'Registrar a baixa mesmo assim?')) return;
  }
  if (Math.abs(mov - reg) <= 0.01){ fecharModal(); return conciliar(movId, alvoId, travado); }

  const dif = rd(mov - reg);
  modal('Valores diferentes',
    '<p>O registro está lançado com <b>'+moeda(reg)+'</b> e o extrato traz <b>'+moeda(mov)+'</b>'
    + ' — uma diferença de <b class="'+(dif>0?'pos':'neg')+'">'+moeda(Math.abs(dif))+'</b>'
    + (dif > 0 ? ' a mais' : ' a menos') + '.</p>'
    + '<p style="margin-top:10px">Deseja alterar o valor do registro para o valor do extrato e conciliar?</p>'
    + '<p class="mini" style="margin-top:10px">Alterando, o rateio entre cliente e escritório é recalculado na mesma '
    + 'proporção. Mantendo, o registro fica com o valor lançado e a conciliação usa o valor do extrato.</p>',
    '<button class="btn sec" onclick="fecharModal()">Cancelar</button>'
    + '<button class="btn sec" onclick="fecharModal();conciliar(\''+movId+'\',\''+alvoId+'\','+(travado?'1':'0')+')">Manter '+moeda(reg)+'</button>'
    + '<button class="btn ok" onclick="fecharModal();ajustarEConciliar(\''+movId+'\',\''+alvoId+'\','+(travado?'1':'0')+')">'
    + 'Sim, usar '+moeda(mov)+'</button>', 'estreita');
}
async function ajustarEConciliar(movId, alvoId, forcar){
  const m = (DB.EXTRATO||[]).find(x => x.ID === movId); if (!m) return;
  const novo = rd(Math.abs(n(m.VALOR)));
  const lote = [];
  const escala = (v, f) => String(v == null ? '' : v).trim() === '' ? v : rd(n(v) * f);

  const p = parcDe(alvoId);
  if (p){
    const antigo = n(p.VALOR) || novo;
    const f = antigo ? novo / antigo : 1;
    lote.push({aba:'PARCELAS', registro: Object.assign({}, p, {
      VALOR: novo, ESC_PREV: escala(p.ESC_PREV, f), SUCUMBENCIA: escala(p.SUCUMBENCIA, f) })});
  } else {
    const cr = indices().cr.get(alvoId);
    if (cr){
      const antigo = n(cr.VALOR) || novo;
      const f = antigo ? novo / antigo : 1;
      lote.push({aba:'CONTAS_RECEBER', registro: Object.assign({}, cr, {
        VALOR: novo, VALOR_ESCRITORIO: escala(cr.VALOR_ESCRITORIO, f),
        VALOR_CLIENTE: escala(cr.VALOR_CLIENTE, f) })});
    } else {
      const cp = indices().cp.get(alvoId);
      if (cp) lote.push({aba:'CONTAS_PAGAR', registro: Object.assign({}, cp, {VALOR: novo})});
    }
  }
  if (lote.length) salvarLoteRapido(lote);   // o registro já fica com o valor novo
  toast('Valor do registro ajustado para ' + moeda(novo) + '.','ok');
  return conciliar(movId, alvoId, forcar);
}

/* ── Desfazer ── */
function reverterAlvo(a){
  const lote = [], apagar = [];
  if (a.tipo === 'parcela'){
    const p = a.p, l = a.l;
    const cp = (DB.CONTAS_PAGAR||[]).find(c => c.ID === p.CP_ID || (c.PARCELA_ID === p.ID && c.CATEGORIA === 'Repasse a cliente'));
    if (cp && cp.STATUS === 'Pago')
      return {erro:'O repasse ao cliente de "'+(l.CLIENTE||'')+'" já foi pago. Desfaça primeiro a conciliação desse pagamento.'};
    if (cp){
      const tar = tarifaDe(p, l);
      lote.push({aba:'CONTAS_PAGAR', registro: Object.assign({}, cp, {
        VENCIMENTO:p.VENCIMENTO, VALOR:rd(n(p.VALOR) - escPrevisto(p, l) - tar),
        STATUS:'Em aberto', DATA_PGTO:'',
        OBS:'Valor previsto sobre a parcela de '+moeda(p.VALOR)+' · '
            + memoriaValores(n(p.VALOR), escPrevisto(p, l), tar,
                p.TIPO === 'Sucumbência' ? n(p.VALOR) : n(p.SUCUMBENCIA))
            + ' · aguardando o crédito da parcela' })});
    }
    (DB.COMISSOES||[]).filter(c => c.PARCELA_ID === p.ID && c.STATUS !== 'Paga')
      .forEach(c => apagar.push({aba:'COMISSOES', id:c.ID}));
    lote.push({aba:'PARCELAS', registro: Object.assign({}, p, {STATUS:'A receber', DATA_CREDITO:'', VALOR_CREDITADO:'',
      MOV_ID:'', VALOR_CLIENTE:'', VALOR_ESCRITORIO:'', TARIFA:''})});

  } else if (a.tipo === 'pagar'){
    lote.push({aba:'CONTAS_PAGAR', registro: Object.assign({}, a.cp, {STATUS:'Em aberto', DATA_PGTO:'',
      OBS:'Baixa desfeita em '+dataBR(hoje())})});
    (DB.COMISSOES||[]).filter(c => c.CP_ID === a.cp.ID).forEach(c =>
      lote.push({aba:'COMISSOES', registro: Object.assign({}, c, {STATUS:'Enviada'})}));

  } else if (a.tipo === 'receber'){
    lote.push({aba:'CONTAS_RECEBER', registro: Object.assign({}, a.cr, {STATUS:'Em aberto', DATA_RECEB:''})});
    (DB.COMISSOES||[]).filter(c => c.PARCELA_ID === a.cr.ID && c.STATUS !== 'Paga')
      .forEach(c => apagar.push({aba:'COMISSOES', id:c.ID}));
  }
  return {lote, apagar};
}

async function desfazer(movId, semPerguntar){
  const m = (DB.EXTRATO||[]).find(x => x.ID === movId); if (!m) return;
  const alvos = alvosDe(m);
  const quantos = alvos.length;
  if (!semPerguntar && !confirm(quantos > 1
      ? 'Desfazer a conciliação deste movimento com ' + quantos + ' registros? Todos voltam ao estado anterior.'
      : 'Desfazer? O registro volta ao estado anterior e as comissões geradas são removidas.')) return;

  let lote = [], apagar = [];
  for (const a of alvos){
    const r = reverterAlvo(a);
    if (r.erro) return toast(r.erro,'erro');
    lote = lote.concat(r.lote); apagar = apagar.concat(r.apagar);
  }
  lote.push({aba:'EXTRATO', registro: Object.assign({}, m, {STATUS:'Pendente', PARCELA_ID:''})});
  apagar.forEach(x => { DB[x.aba] = (DB[x.aba]||[]).filter(y => y.ID !== x.id); });
  lote.forEach(it => {
    const L = DB[it.aba] || (DB[it.aba] = []);
    const j = L.findIndex(x => x.ID === it.registro.ID);
    if (j >= 0) L[j] = it.registro; else L.push(it.registro);
  });
  render();
  enfileirar(lote, apagar);
  toast('Conciliação desfeita.','ok');
}

function pintarVinculoUm(movId){
  const box = document.getElementById('boxVincUm'); if (!box) return;
  const m = (DB.EXTRATO||[]).find(x => x.ID === movId); if (!m) return;
  const deb = ehDebito(m);

  const casaTermo = c => {
    if (!t) return true;
    const texto = (c.titulo + ' ' + c.sub + ' ' + c.detalhe).toLowerCase();
    if (texto.includes(t)) return true;
    if (dt && digitos(nMoeda(c.valor)).includes(dt)) return true;   // acha por 1000 ou 1.000,00
    return false;
  };
  const todos = (deb ? candidatosDebitoTodos() : candidatosCredito()).filter(casaTermo)
    .sort((a,b) => Math.abs(a.valor - alvo) - Math.abs(b.valor - alvo)

  const L = todos.slice(0, 60);

    box.innerHTML = vazio(t ? 'Nada encontrado' : (deb ? 'Nenhuma conta a pagar liberada' : 'Nenhum registro em aberto'),

/* mostra os campos de rateio quando a categoria escolhida divide com o cliente */
function montaRateio(){
  const box = document.getElementById('boxRateio'); if (!box) return;
  const rep = document.getElementById('boxRepasse');
  if (catAcordo(val('ncCat'))){
    if (rep){ rep.innerHTML = ''; rep.style.display = 'none'; }
    return montaAcordo(box);
  }
  if (!catRateia(val('ncCat'))){
    box.innerHTML = ''; box.dataset.modo = '';
    if (rep){ rep.innerHTML = ''; rep.style.display = 'none'; }
    return;
  }
  box.dataset.modo = 'rateio';
  const total = rd(n(val('ncValor')));
  box.innerHTML = '<div class="secao-form">Divisão do valor</div>'
    + '<div class="grade">'
    + inp('ncEsc','Valor do escritório (R$)', nMoeda(total), '', 'text', 'oninput="sincronizaRateio(\'esc\')"')
    + inp('ncCli','Valor do cliente (R$)', nMoeda(0), '', 'text', 'oninput="sincronizaRateio(\'cli\')"')
    + '<div class="check"><input type="checkbox" id="ncTarifaOn" onchange="sincronizaRateio()">'
      + '<label for="ncTarifaOn">Deduzir tarifa bancária</label></div>'
    + inp('ncTarifaV','Valor da tarifa (R$)', nMoeda(tarifaPadrao()), '', 'text', 'oninput="sincronizaRateio()"')
    + '</div>'
    + '<p class="mini" id="avisoRateio" style="margin-top:4px">Total do crédito: '+moeda(total)+'. Ao digitar um lado, o outro é ajustado.</p>';
  montaRepasse();
  sincronizaRateio('esc');
}
/* a tarifa sai da parte do cliente e entra na do escritório, como nas parcelas de acordo */
function tarifaDoRateio(){
  return val('ncTarifaOn') ? rd(n(val('ncTarifaV'))) : 0;
}
function sincronizaRateio(origem){
  const total = rd(n(val('ncValor')));
  const eEsc = document.getElementById('ncEsc'), eCli = document.getElementById('ncCli');
  if (!eEsc || !eCli) return;
  if (origem === 'esc') eCli.value = nMoeda(rd(total - n(eEsc.value)));
  else if (origem === 'cli') eEsc.value = nMoeda(rd(total - n(eCli.value)));
  const cli = rd(n(eCli.value)), esc = rd(n(eEsc.value));
  const tar = tarifaDoRateio();
  const escF = rd(esc + tar), cliF = rd(cli - tar);
  const campoTar = document.getElementById('ncTarifaV');
  if (campoTar) campoTar.disabled = !val('ncTarifaOn');

  const aviso = document.getElementById('avisoRateio');
  if (aviso) aviso.innerHTML = 'Total do crédito: <b>'+moeda(total)+'</b> — escritório <b>'+pctSobre(esc, total)+'</b> = '+moeda(esc)
    + (tar ? ' + tarifa = <b>'+moeda(escF)+'</b>' : '')
    + ' · cliente <b>'+pctSobre(cli, total)+'</b> = '+moeda(cli)
    + (tar ? ' − tarifa = <b>'+moeda(cliF)+'</b>' : '')
    + (tar ? '<br>Tarifa de '+moeda(tar)+' deduzida do cliente e revertida ao escritório.' : '')
    + (escF < 0 || cliF < 0 ? ' <span class="neg">— um dos lados ficou negativo</span>' : '');

  const rep = document.getElementById('boxRepasse');
  if (rep){
    rep.style.display = cliF > 0 ? 'block' : 'none';
    const campoValor = document.getElementById('rpValor');
    if (campoValor && document.activeElement !== campoValor) campoValor.value = nMoeda(cliF);
  }
}
/* Categoria de acordo parcelado: abre os campos do lançamento dentro da conciliação.
   Reaproveita os mesmos ids do formulário de lançamento, para gravar pela mesma rotina. */
function montaAcordo(box){
  const cpc = catCPC(val('ncCat'));
  const modo = cpc ? 'acordo-cpc' : 'acordo';
  // o acordo CPC tem outro formulário: trocar entre os dois precisa remontar,
  // senão os campos do anterior ficam na tela
  if (box.dataset.modo === modo) return;       // já montado, não perde o que foi digitado
  if (box.dataset.modo === 'acordo' || box.dataset.modo === 'acordo-cpc') PARC_TMP = [];
  box.dataset.modo = modo;
  const total = nMoeda(rd(n(val('ncValor'))));
  // pasta, cliente, praça e EXEC vêm dos campos de cima; aqui só viajam escondidos
  box.innerHTML = '<div class="grade">'
    + '<input type="hidden" id="lcPasta"><input type="hidden" id="lcCliente">'
    + '<input type="hidden" id="lcPraca"><input type="hidden" id="lcDoc"><input type="hidden" id="lcProc">'
    + '<input type="checkbox" id="lcExec" style="display:none">'
    + (cpc ? '' : '<div class="secao-form">Dados do acordo</div>')
    + (cpc ? '' :
        inp('lcDataAcordo','Data do acordo', val('ncVenc') || hoje(), '', 'date')
      + sel('lcAudiencia','Audiência', [['','— selecione —']].concat(AUDIENCIAS.map(a => [a,a])), '')
      + inp('lcAdvogado','Advogado que fez o acordo',''))
    + '<div class="secao-form">Parcelas</div>'
    + inp('lcQtd','Quantidade de parcelas', cpc ? 3 : 1, '', 'number',
          'min="1" max="24" oninput="' + (cpc ? 'montarCPC()' : 'recalcParcelas()') + '"')
    + inp('lcPrim','1º vencimento', val('ncVenc') || hoje(), '', 'date',
          'oninput="' + (cpc ? 'montarCPC()' : 'recalcParcelas()') + '"')
    + inp('lcTarifaV','Valor da tarifa bancária (R$)', nMoeda(tarifaPadrao()), '', 'text',
          'oninput="pintarParcelas()"')
    + (cpc ? '' :
        inp('lcTotal','Valor total do acordo (R$)', total, '', 'text', 'oninput="recalcParcelas()"')
      + inp('lcPctCli','% do cliente', 70, '', 'number', 'step="0.01" oninput="espelhaPct(1)"')
      + inp('lcPctEsc','% do escritório', 30, '', 'number', 'step="0.01" oninput="espelhaPct(2)"')
      + inp('lcSuc','Honorários de sucumbência (R$)','', '', 'text', 'oninput="recalcParcelas()"')
      + '<div class="check"><input type="checkbox" id="lcTarifa" checked><label for="lcTarifa">Deduzir tarifa bancária da parte do cliente</label></div>')
    + '<div class="full" id="boxParcelas"></div>'
    + '<input type="hidden" id="lcSub" value="'+esc(val('ncCat'))+'">'
    + '<input type="hidden" id="lcObs" value="">'
    + '</div>'
    + (cpc ? '' : '<p class="mini" style="margin-top:6px">O crédito deste movimento será conciliado com a parcela '
        + 'de valor correspondente. As demais ficam em contas a receber, com o repasse em contas a pagar.</p>');
  PARC_TMP = [];
  if (cpc) montarCPC(); else recalcParcelas();
}
/* leva para os campos escondidos o que foi digitado na parte de cima do formulário */
function espelharCamposAcordo(){
  const põe = (id, v) => { const e = document.getElementById(id); if (e) e.value = v; };
  põe('lcSub', val('ncCat'));
  põe('lcObs', val('ncObs'));
  põe('lcPasta', val('ncPasta'));
  põe('lcCliente', val('ncQuem'));
  põe('lcPraca', val('ncPraca'));
  põe('lcDoc', '');
  põe('lcProc', '');
  const ex = document.getElementById('lcExec');
  if (ex) ex.checked = !!val('ncExec');
}

/* o favorecido do repasse acompanha o cliente enquanto não for editado à mão */
function sincronizaFavorecido(){
  const f = document.getElementById('rpFav');
  if (f && !f.dataset.tocado) f.value = val('ncQuem');
}
async function gravarNovoNaConciliacao(movId){
  const m = (DB.EXTRATO||[]).find(x => x.ID === movId); if (!m) return;
  const deb = ehDebito(m);
  if (!val('ncDesc')) return toast('Informe a descrição.','erro');
  const valor = (!deb && catCPC(val('ncCat')))
    ? rd(Math.abs(n(m.VALOR)))          // no CPC o valor é o do próprio movimento
    : rd(n(val('ncValor')));
  if (!valor) return toast('Informe o valor.','erro');
  const id = uid(deb ? 'cp' : 'cr');
  const lote = [];

  if (deb){
    const fav = garantirFavorecido(tit(val('ncQuem')), val('ncCat'));
    if (fav) lote.push(fav);
    lote.push({aba:'CONTAS_PAGAR', registro:{ID:id, DESCRICAO:tit(val('ncDesc')), FAVORECIDO:tit(val('ncQuem')),
      CATEGORIA:val('ncCat'), SUBCATEGORIA:val('ncSubcat'), PASTA: tit(val('ncPastaCP')),
      VENCIMENTO:proximoDiaUtil(val('ncVenc')), VALOR:valor,
      STATUS:'Em aberto', DATA_PGTO:'', ORIGEM:'Lançado na conciliação', PARCELA_ID:'', ANEXO_URL:'',
      OBS:val('ncObs'), SEM_DADOS:''}});
  } else if (catAcordo(val('ncCat'))){
    espelharCamposAcordo();
    const marcada = (PARC_TMP.find(p => p.EXT && p.ATIVA) || {}).NUM;   // escolhida na tabela
    const lanc = await gravarLanc('', {semFechar:true});
    if (!lanc) return;
    const ps = (DB.PARCELAS||[]).filter(p => p.LANC_ID === lanc.ID && p.STATUS !== 'Recebida')
      .sort((a,b) => String(a.VENCIMENTO).localeCompare(String(b.VENCIMENTO)));
    const alvo = (marcada ? ps.find(p => n(p.NUM) === n(marcada)) : null)
              || ps.find(p => Math.abs(n(p.VALOR) - valor) <= 1) || ps[0];
    fecharModal();
    if (!alvo) return toast('Lançamento salvo, mas não há parcela para conciliar.','erro');
    return conciliar(movId, alvo.ID);

  } else {
    const rateia = catRateia(val('ncCat'));
    const tar = rateia ? tarifaDoRateio() : 0;
    const escBruto = rateia ? rd(n(val('ncEsc'))) : valor;
    const cliBruto = rateia ? rd(n(val('ncCli'))) : 0;
    const esc = rd(escBruto + tar), cli = rd(cliBruto - tar);
    if (rateia){
      if (Math.abs(rd(escBruto + cliBruto) - valor) > 0.01)
        return toast('A soma do escritório com o cliente ('+moeda(rd(escBruto+cliBruto))+') tem que fechar com o valor do crédito ('+moeda(valor)+').','erro');
      if (esc < 0 || cli < 0) return toast('Com a tarifa, um dos lados ficou negativo. Revise os valores.','erro');
    }
    const dadosCR = {DESCRICAO:tit(val('ncDesc')), CLIENTE:tit(val('ncQuem')), PASTA:tit(val('ncPasta')),
      PRACA:val('ncPraca'), FILIAL:'', EXEC: val('ncExec') ? 'SIM' : 'NAO'};
    let cpId = '';
    if (cli > 0){
      const vRep = rd(n(val('rpValor'))) || cli;
      if (!val('rpFav')) return toast('Informe o favorecido do repasse ao cliente.','erro');
      cpId = uid('cp');
      const favRep = garantirFavorecido(tit(val('rpFav')), val('rpCat') || 'Repasse a cliente');
      // o vínculo com o recebimento fica no CP_ID da conta a receber, gravada logo abaixo
      if (favRep) lote.push(favRep);
      lote.push({aba:'CONTAS_PAGAR', registro:{ID:cpId,
        DESCRICAO: descricaoRepasse(dadosCR),
        FAVORECIDO:tit(val('rpFav')), CATEGORIA:val('rpCat') || 'Repasse a cliente', VENCIMENTO:val('rpVenc') || m.DATA,
        VALOR:vRep, STATUS:'Em aberto', DATA_PGTO:'', ORIGEM:'Repasse de recebimento', PARCELA_ID:id, ANEXO_URL:'',
        OBS: (val('rpObs') ? val('rpObs') + ' · ' : '')
             + obsRepasse(dadosCR, valor, esc, cli, tar, m.DATA)}});
    }
    lote.push({aba:'CONTAS_RECEBER', registro: Object.assign({}, dadosCR, {ID:id,
      CATEGORIA:val('ncCat'), SUBCATEGORIA:val('ncSubcat'),
      VENCIMENTO:proximoDiaUtil(val('ncVenc')), VALOR:valor, STATUS:'Em aberto', DATA_RECEB:'',
      ORIGEM:'Lançado na conciliação', ANEXO_URL:'', OBS:val('ncObs'),
      VALOR_ESCRITORIO:esc, VALOR_CLIENTE:cli, CP_ID:cpId, TARIFA:tar})});
  }

  fecharModal();
  try{
    await salvarLoteRapido(lote);
    await conciliar(movId, id);
  }catch(e){}
}
/* ── Histórico de importações ── */
/* movimentos antigos não têm lote: são agrupados pela data e conta da importação */
const chaveLote = m => m.LOTE || ('antigo|' + (m.IMPORTADO_EM||'') + '|' + (m.BANCO||''));
function lotesImportados(){
  const mapa = {};
  (DB.EXTRATO||[]).forEach(m => {
    const k = chaveLote(m);
    const g = mapa[k] || (mapa[k] = { chave:k, arquivo:m.ARQUIVO || '', banco:m.BANCO || '',
      quando:m.IMPORTADO_EM || '', movs:[] });
    g.movs.push(m);
    if (m.ARQUIVO && !g.arquivo) g.arquivo = m.ARQUIVO;
  });
  return Object.values(mapa).map(g => {
    g.total = g.movs.reduce((s,m) => s + n(m.VALOR), 0);
    g.conciliados = g.movs.filter(m => m.STATUS === 'Conciliado').length;
    g.pendentes = g.movs.filter(m => m.STATUS === 'Pendente').length;
    g.naoId = g.movs.filter(m => m.STATUS === 'Nao identificado').length;
    const datas = g.movs.map(m => m.DATA).filter(Boolean).sort();
    g.de = datas[0] || ''; g.ate = datas[datas.length-1] || '';
    return g;
  }).sort((a,b) => String(b.quando).localeCompare(String(a.quando)));
}
function historicoImportacoes(){
  const f = FILTROS.hist || (FILTROS.hist = {});
  const termo = String(f.busca||'').toLowerCase();
  const todos = lotesImportados();
  const L = todos
    .filter(g => !f.conta || g.banco === f.conta)
    .filter(g => !f.de || String(g.quando||'').slice(0,10) >= f.de)
    .filter(g => !f.ate || String(g.quando||'').slice(0,10) <= f.ate)
    .filter(g => !f.sit
      || (f.sit === 'conc' && g.conciliados)
      || (f.sit === 'pend' && g.pendentes)
      || (f.sit === 'naoid' && g.naoId))
    .filter(g => !termo || (String(g.arquivo||'') + ' ' + String(g.banco||'')).toLowerCase().includes(termo));

  const filtros = '<div class="filtros">'
    + '<div class="campo"><label for="hiBusca">Arquivo ou conta</label>'
      + '<input id="hiBusca" value="'+esc(f.busca||'')+'" placeholder="nome do arquivo…" '
      + 'oninput="FILTROS.hist.busca=this.value;historicoImportacoes()"></div>'
    + '<div class="campo"><label for="hiDe">Importado de</label>'
      + '<input type="date" id="hiDe" value="'+esc(f.de||'')+'" onchange="FILTROS.hist.de=this.value;historicoImportacoes()"></div>'
    + '<div class="campo"><label for="hiAte">até</label>'
      + '<input type="date" id="hiAte" value="'+esc(f.ate||'')+'" onchange="FILTROS.hist.ate=this.value;historicoImportacoes()"></div>'
    + sel('hiConta','Conta bancária', opcoesContas(true), f.conta||'', '',
          'onchange="FILTROS.hist.conta=this.value;historicoImportacoes()"')
    + sel('hiSit','Situação', [['','Todas'],['conc','Com conciliados'],['pend','Com pendentes'],['naoid','Com não identificados']],
          f.sit||'', '', 'onchange="FILTROS.hist.sit=this.value;historicoImportacoes()"')
    + '<div class="campo" style="min-width:0"><label>&nbsp;</label>'
      + '<button class="btn sec" onclick="FILTROS.hist={};historicoImportacoes()">Limpar</button></div>'
    + '</div>'
    + (L.length !== todos.length
        ? '<p class="mini" style="margin-bottom:8px">Mostrando '+L.length+' de '+todos.length+' importações.</p>' : '');

  const corpo = filtros + (L.length
    ? '<div class="tw"><table class="densa"><thead><tr><th>Importado em</th><th>Arquivo</th><th>Conta</th>'
      + '<th>Período</th><th class="num">Movs.</th><th class="num">Soma</th><th>Situação</th><th></th></tr></thead><tbody>'
      + L.map(g => '<tr><td>'+esc(g.quando ? dataBR(g.quando) + (g.quando.length > 10 ? ' ' + g.quando.slice(11) : '') : '—')+'</td>'
        + '<td><b>'+esc(g.arquivo || 'Importação anterior')+'</b></td>'
        + '<td>'+esc(g.banco || '—')+'</td>'
        + '<td class="mini">'+dataBR(g.de)+' a '+dataBR(g.ate)+'</td>'
        + '<td class="num">'+g.movs.length+'</td>'
        + '<td class="num">'+nMoeda(g.total)+'</td>'
        + '<td style="white-space:nowrap">'
              + (g.conciliados ? '<button class="tagbtn t-ok" onclick="detalheLote(\''+esc(g.chave).replace(/'/g,"\\'")+'\',\'Conciliado\')">'
                  + g.conciliados+' conciliados</button> ' : '')
              + (g.pendentes ? '<button class="tagbtn t-pend" onclick="detalheLote(\''+esc(g.chave).replace(/'/g,"\\'")+'\',\'Pendente\')">'
                  + g.pendentes+' pendentes</button> ' : '')
              + (g.naoId ? '<button class="tagbtn t-ni" onclick="detalheLote(\''+esc(g.chave).replace(/'/g,"\\'")+'\',\'Nao identificado\')">'
                  + g.naoId+' não identificados</button>' : '')+'</td>'
        + '<td style="text-align:right"><button class="btn sm per" onclick="excluirImportacao(\''+esc(g.chave).replace(/'/g,"\\'")+'\')">Excluir</button></td></tr>').join('')
      + '</tbody></table></div>'
      + '<p class="mini" style="margin-top:10px">Excluir uma importação apaga os movimentos dela. '
      + 'Movimentos já conciliados travam a exclusão — clique em <b>conciliados</b> para ver quais são '
      + 'e desfazer a conciliação de cada um.</p>'
    : vazio(todos.length ? 'Nada neste filtro' : 'Nenhuma importação',
            todos.length ? 'Ajuste as datas, a conta ou a busca.'
                         : 'Os extratos importados aparecem aqui, com a opção de excluir cada arquivo.'));
  modal('Histórico de importações', corpo, '<button class="btn sec" onclick="fecharModal()">Fechar</button>', 'larga');
}
/* lista os movimentos de uma importação numa situação, para poder agir sobre eles */
function detalheLote(chave, situacao){
  const g = lotesImportados().find(x => x.chave === chave);
  if (!g) return toast('Importação não encontrada.','erro');
  const L = g.movs.filter(m => m.STATUS === situacao)
    .sort((a,b) => String(a.DATA).localeCompare(String(b.DATA)));
  const rotulo = situacao === 'Conciliado' ? 'conciliados'
               : situacao === 'Pendente' ? 'pendentes' : 'não identificados';
  const linha = m => {
    const a = situacao === 'Conciliado' ? alvoDe(m) : null;
    return '<tr><td>'+dataBR(m.DATA)+'</td>'
      + '<td>'+esc(m.IDENTIFICACAO||'—')+'</td>'
      + '<td class="num '+(n(m.VALOR)<0?'neg':'')+'">'+nMoeda(m.VALOR)+'</td>'
      + (situacao === 'Conciliado' ? '<td>'+a.quem+'</td>' : '')
      + '<td style="text-align:right;white-space:nowrap">'
      + (situacao === 'Conciliado'
          ? '<button class="btn sm sec" onclick="fecharModal();abrirAlvo(\''+m.ID+'\')">Abrir</button> '
            + '<button class="btn sm per" onclick="desfazerEVoltar(\''+m.ID+'\',\''+esc(chave).replace(/'/g,"\\'")+'\')">Desconciliar</button>'
          : '<button class="btn sm sec" onclick="fecharModal();irPara(\'conciliacao\','
            + (situacao === 'Pendente' ? '\'pendentes\'' : '\'naoid\'') + ')">Ver na conciliação</button>')
      + '</td></tr>';
  };
  modal('Movimentos ' + rotulo + ' — ' + (g.arquivo || 'importação anterior'),
    (situacao === 'Conciliado'
      ? '<p class="mini" style="margin-bottom:10px">Para excluir esta importação, é preciso desconciliar todos estes '
        + L.length + ' movimento(s). Cada um volta para a fila de pendentes e o registro de destino volta para as listas.</p>'
      : '<p class="mini" style="margin-bottom:10px">' + L.length + ' movimento(s) nesta situação.</p>')
    + '<div class="tw" style="max-height:420px;overflow:auto"><table class="densa"><thead><tr>'
    + '<th>Data</th><th>Histórico</th><th class="num">Valor</th>'
    + (situacao === 'Conciliado' ? '<th>Baixou</th>' : '') + '<th></th></tr></thead><tbody>'
    + (L.length ? L.map(linha).join('')
       : '<tr><td colspan="5" class="mini">Nenhum movimento nesta situação.</td></tr>')
    + '</tbody></table></div>',
    '<button class="btn sec" onclick="fecharModal();historicoImportacoes()">Voltar ao histórico</button>'
    + (situacao === 'Conciliado' && L.length
        ? '<button class="btn per" onclick="desconciliarLoteTodo(\''+esc(chave).replace(/'/g,"\\'")+'\')">'
          + 'Desconciliar os ' + L.length + '</button>' : ''), 'larga');
}
/* desfaz um e reabre a lista, para seguir desconciliando sem procurar de novo */
async function desfazerEVoltar(movId, chave){
  await desfazer(movId);
  const g = lotesImportados().find(x => x.chave === chave);
  if (g && g.conciliados) detalheLote(chave, 'Conciliado');
  else historicoImportacoes();
}
async function desconciliarLoteTodo(chave){
  const g = lotesImportados().find(x => x.chave === chave);
  if (!g) return;
  const L = g.movs.filter(m => m.STATUS === 'Conciliado');
  if (!L.length) return toast('Nada a desconciliar.','ok');
  if (!confirm('Desconciliar os ' + L.length + ' movimento(s) desta importação?\n\n'
    + 'Cada registro de destino volta para contas a receber ou a pagar, e as comissões não pagas são removidas.')) return;

function parseOFX(txt){

    const valor = n(g('TRNAMT').replace(',', '.'));
    const desc = [g('MEMO'), g('NAME'), g('CHECKNUM')].filter(Boolean).join(' — ');
    if (data && valor) out.push({DATA:data, IDENTIFICACAO:desc || g('TRNTYPE'), VALOR:rd(valor)});
  });

async function tabelaDeCSV(txt){
  const sep = (txt.split('\n')[0].match(/;/g)||[]).length >= (txt.split('\n')[0].match(/,/g)||[]).length ? ';' : ',';
  return txt.split(/\r?\n/).filter(l => l.trim()).map(l => l.split(sep).map(c => c.replace(/^"|"$/g,'').trim()));
}
function parseTabela(rows){
  if (!rows || !rows.length) return [];
  let iD = -1, iI = -1, iV = -1, ini = 0;
  for (let r=0; r<Math.min(12, rows.length); r++){
    const cab = rows[r].map(c => String(c||'').toLowerCase());
    const acha = alvos => cab.findIndex(c => alvos.some(a => c.includes(a)));
    const d = acha(['data','dt ','lançamento','lancamento']);
    const i = acha(['identific','descri','histór','histor','memo','detalhe']);
    const v = acha(['valor','montante','crédito','credito','r$']);
    if (d >= 0 && v >= 0){ iD = d; iI = i; iV = v; ini = r+1; break; }
  }
  if (iD < 0){ iD = 0; iI = 1; iV = 2; ini = 0; }
  const out = [];
  for (let r=ini; r<rows.length; r++){
    const row = rows[r] || [];
    const data = isoDe(row[iD]);
    const valor = n(row[iV]);
    if (!data || !valor) continue;
    out.push({DATA:data, IDENTIFICACAO:String(iI >= 0 ? (row[iI]||'') : '').trim(), VALOR:rd(valor)});
  }
  return out;
}
/* ══════════════════ BOLETO: LINHA DIGITÁVEL ══════════════════
   Lê o PDF do boleto e procura a linha digitável impressa (47 dígitos na
   cobrança bancária, 48 na arrecadação). Não achando, tenta o código de
   barras de 44 dígitos e calcula a linha a partir dele. */
function mod10(num){
  let soma = 0, peso = 2;
  for (let i = String(num).length - 1; i >= 0; i--){
    let x = Number(String(num)[i]) * peso;
    if (x > 9) x -= 9;
    soma += x;
    peso = peso === 2 ? 1 : 2;
  }
  return (10 - (soma % 10)) % 10;
}
/* converte o código de barras de 44 dígitos na linha digitável de 47 */
function linhaDeBarras(cb){
  const d = String(cb).replace(/\D/g,'');
  if (d.length !== 44) return '';
  const banco = d.slice(0,3), moeda = d.slice(3,4), dvGeral = d.slice(4,5);
  const fatorValor = d.slice(5,19), livre = d.slice(19);
  const c1 = banco + moeda + livre.slice(0,5);
  const c2 = livre.slice(5,15);
  const c3 = livre.slice(15,25);
  return c1 + mod10(c1) + c2 + mod10(c2) + c3 + mod10(c3) + dvGeral + fatorValor;
}
/* confere os dígitos verificadores dos três campos da linha de 47 */
function linha47Valida(d){
  if (d.length !== 47) return false;
  return mod10(d.slice(0,9)) === Number(d[9])
      && mod10(d.slice(10,20)) === Number(d[20])
      && mod10(d.slice(21,31)) === Number(d[31]);
}
/* junta grupos de dígitos vizinhos da mesma linha até fechar 44, 47 ou 48.
   Trabalhar linha a linha evita que a busca atravesse o PDF inteiro e
   some datas, CNPJ e valores num número que não existe. */
function candidatosNumericos(linha){
  const grupos = String(linha||'').match(/\d+/g) || [];
  const out = [];
  for (let i = 0; i < grupos.length; i++){
    let acc = '';
    for (let j = i; j < grupos.length; j++){
      acc += grupos[j];
      if (acc.length > 48) break;
      if (acc.length === 44 || acc.length === 47 || acc.length === 48) out.push(acc);
    }
  }
  return out;
}
function acharLinhaDigitavel(txt){
  const linhas = String(txt||'').split(/\r?\n/);
  const cands = [];
  linhas.forEach((l, i) => {
    candidatosNumericos(l).forEach(d => cands.push(d));
    // a linha digitável às vezes quebra em duas linhas do PDF
    if (linhas[i+1]) candidatosNumericos(l + ' ' + linhas[i+1]).forEach(d => cands.push(d));
  });
  const de = t => cands.filter(d => d.length === t);
  // 1º: cobrança bancária de 47 dígitos, moeda 9 na 4ª posição e DVs conferidos
  const certa = de(47).find(d => d[3] === '9' && linha47Valida(d));
  if (certa) return {linha: certa, origem: 'impressa no boleto'};
  // 2º: arrecadação de 48 dígitos, que começa com 8
  const arrec = de(48).find(d => d[0] === '8');
  if (arrec) return {linha: arrec, origem: 'impressa no boleto'};
  // 3º: só o código de barras impresso — calcula a linha a partir dele
  const barras = de(44).find(d => d[3] === '9');
  if (barras){
    const l = linhaDeBarras(barras);
    if (l) return {linha: l, origem: 'calculada pelo código de barras'};
  }
  // 4º: 47 dígitos sem os DVs fechando, como último recurso
  const solta = de(47).find(d => d[3] === '9');
  if (solta) return {linha: solta, origem: 'lida do boleto — confira antes de pagar'};
  return null;
}
/* formata para leitura: 47 dígitos nos cinco campos habituais */
function formatarLinha(d){
  const s = String(d||'').replace(/\D/g,'');
  if (s.length === 47)
    return s.slice(0,5)+'.'+s.slice(5,10)+' '+s.slice(10,15)+'.'+s.slice(15,21)+' '
         + s.slice(21,26)+'.'+s.slice(26,32)+' '+s.slice(32,33)+' '+s.slice(33);
  if (s.length === 48)
    return s.replace(/(\d{12})(?=\d)/g, '$1 ').trim();
  return s;
}

async function textoPDF(f){
  if (typeof pdfjsLib === 'undefined') throw new Error('leitor de PDF indisponível — verifique a conexão.');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise;
  let txt = '';
  for (let p=1; p<=doc.numPages; p++){
    const c = await (await doc.getPage(p)).getTextContent();
    let y = null, linha = [];
    c.items.forEach(it => {
      const ny = Math.round(it.transform[5]);
      if (y !== null && Math.abs(ny - y) > 3){ txt += linha.join(' ') + '\n'; linha = []; }
      y = ny; linha.push(it.str);
    });
    txt += linha.join(' ') + '\n';
  }
  return txt;
}
function parseLinhas(txt){
  const out = [];
  txt.split(/\r?\n/).forEach(l => {
    const linha = l.replace(/\s+/g,' ').trim(); if (!linha) return;
    const md = linha.match(/(\d{2}[\/.-]\d{2}[\/.-]\d{2,4})/); if (!md) return;
    const valores = linha.match(/-?\s?R?\$?\s?\d{1,3}(?:\.\d{3})*,\d{2}(?:\s?[DC])?/g);
    if (!valores) return;
    const bruto = valores[valores.length-1];
    let v = n(bruto);
    if (/D\s*$/.test(bruto.trim()) || /^-/.test(bruto.trim())) v = -Math.abs(v);
    const desc = linha.replace(md[0],'').replace(bruto,'').replace(/\s+/g,' ').trim();
    const data = isoDe(md[0]);
    if (data && v) out.push({DATA:data, IDENTIFICACAO:desc.slice(0,120), VALOR:rd(v)});
  });
  return out;
}
function lerColado(){
  const txt = (document.getElementById('impTexto')||{}).value || '';
  if (!txt.trim()){ toast('Cole o extrato na caixa de texto.','erro'); return; }
  try{
    const linhas = parseColado(txt);
    if (!linhas.length){
      $('#impPrevia').innerHTML = '<div class="erro">Nenhum movimento reconhecido. Cada linha precisa de uma data e um valor — por exemplo: 03/09/2026 TED RECEBIDA 1.000,00</div>';
      $('#btnImp').disabled = true; return;
    }
    IMP_BRUTO = linhas; IMP_NOME = 'Texto colado'; previaImport();
  }catch(e){ $('#impPrevia').innerHTML = '<div class="erro">'+esc(e.message)+'</div>'; }
}
function parseColado(txt){
  const linhas = txt.split(/\r?\n/).filter(l => l.trim());
  const sep = linhas.filter(l => l.includes('\t')).length >= linhas.length/2 ? '\t'
            : linhas.filter(l => l.includes(';')).length >= linhas.length/2 ? ';' : null;
  if (sep){
    const rows = linhas.map(l => l.split(sep).map(c => c.replace(/^"|"$/g,'').trim()));
    const r = parseTabela(rows);
    if (r.length) return r;
  }
  const r2 = parseLinhas(txt);
  if (r2.length) return r2;
  // último recurso: separado por 2+ espaços
  const rows = linhas.map(l => l.trim().split(/\s{2,}/));
  return parseTabela(rows);
}

function alternarConferencia(){
  const e = document.getElementById('impTudo');
  if (e) e.value = e.value ? '' : '1';
  previaImport();
}
function previaImport(){
  const linhas = IMP_BRUTO;
  const banco = val('impBanco');
  if (!banco){
    $('#impPrevia').innerHTML = '<div class="erro">Escolha a conta bancária deste extrato.</div>';
    $('#btnImp').disabled = true; return;
  }
  // A conferência é por CONTAGEM, não por presença: se a conta já tem 1 movimento
  // igual e o arquivo traz 3, entram os 2 que faltam. Assim vários lançamentos
  // idênticos no mesmo dia são importados, e reimportar o mesmo arquivo não duplica.
  const semConferir = !!val('impTudo');
  const existentes = {};
  (DB.EXTRATO||[]).forEach(m => {
    const k = m.HASH + '|' + (m.BANCO||'');
    existentes[k] = (existentes[k] || 0) + 1;
  });
  const usados = {};
  IMP = []; IMP_IGNORADOS = [];
  let repetidos = 0;
  linhas.forEach(l => {
    const h = hashMov(l.DATA, l.VALOR, l.IDENTIFICACAO);
    const k = h + '|' + banco;
    usados[k] = (usados[k] || 0) + 1;
    if (!semConferir && usados[k] <= (existentes[k] || 0)){
      repetidos++; IMP_IGNORADOS.push(l); return;
    }
    IMP.push(Object.assign({}, l, {HASH:h}));
  });
  const total = IMP.reduce((s,m) => s + n(m.VALOR), 0);
  $('#impPrevia').innerHTML =
    '<div class="kpis" style="margin:14px 0 10px"><div class="kpi d"><div class="rot">Movimentos novos</div><div class="val">'+IMP.length+'</div></div>'
    + '<div class="kpi b"><div class="rot">Já existentes nesta conta</div><div class="val">'+repetidos+'</div></div>'
    + '<div class="kpi p"><div class="rot">Soma</div><div class="val" style="font-size:17px">'+moeda(total)+'</div></div></div>'
    + '<div class="seg" style="margin-bottom:10px">'
      + '<button class="'+(semConferir?'on knao':'')+'" onclick="alternarConferencia()">'
      + (semConferir ? '✓ Importando tudo, sem conferir repetição' : 'Importar tudo, sem conferir repetição') + '</button>'
      + '</div>'
    + (repetidos && !semConferir
        ? '<div class="card" style="border-left:3px solid var(--brass);margin-bottom:10px"><div class="corpo">'
          + '<b>'+repetidos+' movimento(s) ficaram de fora</b> porque a conta já tem outro igual em data, valor e histórico. '
          + '<span class="mini">Se forem lançamentos diferentes que por acaso coincidem, use "Importar tudo" acima.</span>'
          + '<div class="tw" style="max-height:180px;overflow:auto;margin-top:8px"><table class="densa">'
          + '<thead><tr><th>Data</th><th>Histórico</th><th class="num">Valor</th></tr></thead><tbody>'
          + IMP_IGNORADOS.slice(0,80).map(l => '<tr><td>'+dataBR(l.DATA)+'</td>'
            + '<td>'+esc(tit(l.IDENTIFICACAO)||'—')+'</td>'
            + '<td class="num '+(n(l.VALOR)<0?'neg':'')+'">'+nMoeda(l.VALOR)+'</td></tr>').join('')
          + '</tbody></table></div>'
          + (IMP_IGNORADOS.length > 80 ? '<p class="mini">Mostrando os 80 primeiros.</p>' : '')
          + '</div></div>'
        : '')
    + '<div class="tw" style="max-height:280px;overflow:auto"><table><thead><tr><th>Data</th><th>Identificação</th><th class="num">Valor</th></tr></thead><tbody>'
    + IMP.slice(0,150).map(m => '<tr><td>'+dataBR(m.DATA)+'</td><td>'+esc(tit(m.IDENTIFICACAO)||'—')+'</td><td class="num '+(n(m.VALOR)<0?'neg':'')+'">'+nMoeda(m.VALOR)+'</td></tr>').join('')
    + '</tbody></table></div>' + (IMP.length > 150 ? '<p class="mini">Mostrando as 150 primeiras linhas.</p>' : '');
  $('#btnImp').disabled = IMP.length === 0;
}
async function confirmarImport(){
  if (!IMP.length) return;
  const banco = val('impBanco');

  carregandoOn('Importando '+IMP.length+' movimentos…');

}

/* acha as colunas pelo cabeçalho, em qualquer ordem */
function mapaColunasCP(rows){
  const alvos = [
    ['venc',  ['vencimento','vence','data de venc','data']],
    ['valor', ['valor','montante','r$','total']],
    ['fav',   ['favorecido','fornecedor','beneficiario','credor','pagar a','nome']],
    ['cat',   ['categoria','classificacao','classe','tipo','conta']],
    ['desc',  ['descricao','historico','discriminacao']],
    ['obs',   ['observacao','observacoes','obs']]
  ];
  for (let r = 0; r < Math.min(12, rows.length); r++){
    const cab = (rows[r]||[]).map(semAcento);
    const mapa = {}, usadas = new Set();
    alvos.forEach(([chave, termos]) => {
      for (const termo of termos){
        const i = cab.findIndex((c, idx) => !usadas.has(idx) && c && c.includes(termo));
        if (i >= 0){ mapa[chave] = i; usadas.add(i); return; }
      }
    });
    if (mapa.valor !== undefined && (mapa.venc !== undefined || mapa.fav !== undefined))
      return {mapa, inicio: r + 1};
  }
  return null;
}
function parseTabelaCP(rows){
  const m = mapaColunasCP(rows);
  if (!m) throw new Error('cabeçalho não reconhecido. Confira se há colunas de vencimento, favorecido, categoria, valor e observações.');
  const pega = (linha, chave) => m.mapa[chave] === undefined ? '' : String(linha[m.mapa[chave]] || '').trim();
  const out = [];
  for (let r = m.inicio; r < rows.length; r++){
    const linha = rows[r] || [];
    const valor = n(pega(linha, 'valor'));
    const venc = isoDe(pega(linha, 'venc'));
    const fav = tit(pega(linha, 'fav'));
    if (!valor && !fav) continue;
    const cat = tit(pega(linha, 'cat'));
    const desc = tit(pega(linha, 'desc'));
    out.push({ VENCIMENTO: venc, FAVORECIDO: fav, CATEGORIA: cat, VALOR: rd(valor),
               DESCRICAO: desc || cat || 'Conta a pagar', OBS: pega(linha, 'obs') });
  }
  return out;
}

/* transforma um texto colado em linhas e colunas */
function rowsColadas(txt){
  const linhas = String(txt||'').split(/\r?\n/).filter(l => l.trim());
  if (!linhas.length) return [];
  const sep = linhas.filter(l => l.includes('\t')).length >= linhas.length/2 ? '\t'
            : linhas.filter(l => l.includes(';')).length >= linhas.length/2 ? ';' : null;
  if (sep) return linhas.map(l => l.split(sep).map(c => c.replace(/^"|"$/g,'').trim()));
  return linhas.map(l => l.trim().split(/\s{2,}/));
}

function parseTabelaAcordos(rows){
  // a ordem importa: as colunas mais específicas são reservadas antes das genéricas
  const alvos = [
    ['primeiro',     ['data primeira','primeira parcela','1a parcela','inicio das parcelas','vencimento']],
    ['valorParcela', ['valor da parcela','valor parcela','parcela r$']],
    ['valorTotal',   ['valor acordo','valor do acordo','valor total','acordo r$','valor']],
    ['qtd',          ['parcelas','qtd','quantidade','n de parcelas']],
    ['sucumbencia',  ['sucumb','honorarios sucumb']],
    ['dataAcordo',   ['data do acordo','data acordo','data']],
    ['audiencia',    ['audi']],
    ['advogado',     ['advog','responsavel']],
    ['praca',        ['praca','comarca','vara']],
    ['pasta',        ['pasta']],
    ['cliente',      ['cliente','reclamante','autor','nome']],
    ['pctCli',       ['% cliente','pct cliente','percentual cliente']],
    ['categoria',    ['categoria','classe']],
    ['processo',     ['processo']],
    ['obs',          ['observ','obs']]
  ];
  let mapa = null, inicio = 0;
  for (let r = 0; r < Math.min(12, rows.length); r++){
    const cab = (rows[r]||[]).map(semAcento);
    const m = {}, usadas = new Set();
    alvos.forEach(([chave, termos]) => {
      for (const termo of termos){
        const i = cab.findIndex((c, idx) => !usadas.has(idx) && c && c.includes(termo));
        if (i >= 0){ m[chave] = i; usadas.add(i); return; }
      }
    });
    if (m.valorTotal !== undefined && (m.cliente !== undefined || m.pasta !== undefined)){
      mapa = m; inicio = r + 1; break;
    }
  }
  if (!mapa) throw new Error('cabeçalho não reconhecido. Confira se há colunas de pasta, cliente e valor do acordo.');

  const pega = (linha, chave) => mapa[chave] === undefined ? '' : String(linha[mapa[chave]] || '').trim();
  const out = [];
  for (let r = inicio; r < rows.length; r++){
    const linha = rows[r] || [];
    const valorTotal = n(pega(linha,'valorTotal'));
    const cliente = pega(linha,'cliente'), pasta = pega(linha,'pasta');
    if (!valorTotal && !cliente && !pasta) continue;
    const pctCli = n(pega(linha,'pctCli')) || pctClientePadrao();
    out.push({
      pasta, cliente, processo: pega(linha,'processo'),
      praca: tit(pega(linha,'praca')), advogado: pega(linha,'advogado'),
      audiencia: tit(pega(linha,'audiencia')),
      dataAcordo: isoDe(pega(linha,'dataAcordo')),
      primeiro: isoDe(pega(linha,'primeiro')) || isoDe(pega(linha,'dataAcordo')) || hoje(),
      valorTotal: rd(valorTotal), sucumbencia: rd(n(pega(linha,'sucumbencia'))),
      qtd: Math.max(1, parseInt(n(pega(linha,'qtd'))) || 1),
      valorParcela: rd(n(pega(linha,'valorParcela'))),
      pctCli, pctEsc: rd(100 - pctCli),
      categoria: tit(pega(linha,'categoria')) || catAcordoPadrao(),
      obs: pega(linha,'obs')
    });
  }
  return out;
}
function previaImportAcordos(linhas){
  if (linhas) IMPAC_BRUTO = linhas.map(l => Object.assign({}, l));
  const pular = !!val('iacPular');
  const repetir = !!val('iacRepetir');
  IMPAC = []; IMPAC_AVISOS = []; IMPAC_RELATORIO = [];
  const pastas = new Set((DB.LANCAMENTOS||[]).map(l => semAcento(l.PASTA) + '|' + rd(l.VALOR_TOTAL)));
  let repetidos = 0, divergentes = 0;
  const anotar = (l, situacao, acao) => IMPAC_RELATORIO.push({
    pasta:l.pasta, cliente:l.cliente, data:l.dataAcordo, valorAcordo:l.valorAcordoOriginal != null ? l.valorAcordoOriginal : l.valorTotal,
    qtd:l.qtd, valorParcela:l.valorParcela, soma:rd(n(l.valorParcela) * l.qtd),
    sucumbencia:l.sucumbencia, situacao, acao});

  IMPAC_BRUTO.map(l => Object.assign({}, l)).forEach(l => {
    // a sucumbência é cobrada junto: as parcelas dividem o valor total do acordo
    if (l.sucumbencia > l.valorTotal){
      IMPAC_AVISOS.push('Pasta ' + (l.pasta||'—') + ': sucumbência de ' + moeda(l.sucumbencia)
        + ' maior que o acordo de ' + moeda(l.valorTotal) + ' — linha ignorada.');
      anotar(l, 'Sucumbência maior que o acordo', 'Não importada');
      return;
    }
    // quando a soma das parcelas discorda da coluna do acordo, vale a soma das parcelas:
    // é ela que será recebida na conta e conciliada no extrato
    if (l.valorParcela && l.qtd){
      const soma = rd(l.valorParcela * l.qtd);
      const p = 'Pasta ' + (l.pasta||'—') + ': ';
      if (Math.abs(soma - l.valorTotal) > 0.05){
        divergentes++;
        l.valorAcordoOriginal = l.valorTotal;
        const comSuc = Math.abs(soma - rd(l.valorTotal + l.sucumbencia)) <= 0.05;
        const situacao = comSuc ? 'Acordo sem a sucumbência: ' + moeda(l.valorTotal) + ' + '
                                  + moeda(l.sucumbencia) + ' = ' + moeda(soma)
                                : l.qtd + ' x ' + moeda(l.valorParcela) + ' = ' + moeda(soma)
                                  + ', acordo informado ' + moeda(l.valorTotal);
        if (pular){
          IMPAC_AVISOS.push(p + situacao + ' — não importada.');
          anotar(l, situacao, 'Não importada');
          return;
        }
        IMPAC_AVISOS.push(p + situacao + ' — lançada como ' + moeda(soma) + ', o valor das parcelas.');
        anotar(l, situacao, 'Importada por ' + moeda(soma));
        l.valorTotal = soma;
      }
    }
    // só agora, com o valor definitivo, checa se o acordo já está no sistema
    const chave = semAcento(l.pasta) + '|' + rd(l.valorTotal);
    if (l.pasta && pastas.has(chave) && !repetir){
      repetidos++;
      anotar(l, 'Já cadastrada no sistema', 'Ignorada');
      return;
    }
    pastas.add(chave);
    IMPAC.push(l);
  });

  const total = IMPAC.reduce((s,l) => s + l.valorTotal, 0);
  $('#iacPrevia').innerHTML =
    '<div class="kpis" style="margin:14px 0 10px">'
    + '<div class="kpi d"><div class="rot">Acordos a importar</div><div class="val">'+IMPAC.length+'</div></div>'
    + '<div class="kpi b"><div class="rot">Já cadastrados (ignorados)</div><div class="val">'+repetidos+'</div></div>'
    + '<div class="kpi '+(divergentes?'n':'')+'"><div class="rot">Com divergência de cálculo</div><div class="val">'+divergentes+'</div></div>'
    + '<div class="kpi p"><div class="rot">Soma dos acordos</div><div class="val" style="font-size:17px">'+moeda(total)+'</div></div></div>'
    + (IMPAC_RELATORIO.length || repetidos
        ? '<div class="seg" style="margin-bottom:12px">'
          + '<button class="'+(pular?'on knao':'')+'" onclick="alternarPularDivergentes()">'
          + (pular ? '✓ Divergências fora da importação' : 'Não importar as divergências') + '</button>'
          + '<button class="'+(repetir?'on kok':'')+'" onclick="alternarRepetidas()">'
          + (repetir ? '✓ Importando as repetidas' : 'Importar as repetidas também') + '</button>'
          + (IMPAC_RELATORIO.length
              ? '<button onclick="exportarRelatorioAcordos()">Baixar relatório<span>'+IMPAC_RELATORIO.length+'</span></button>'
              : '')
          + '</div>'
        : '')
    + (IMPAC_AVISOS.length ? '<div class="erro">' + IMPAC_AVISOS.slice(0,6).map(esc).join('<br>')
        + (IMPAC_AVISOS.length > 6 ? '<br>e mais ' + (IMPAC_AVISOS.length-6) + '…' : '') + '</div>' : '')
    + '<div class="tw" style="max-height:280px;overflow:auto"><table class="densa"><thead><tr>'
    + '<th>Pasta / cliente</th><th>Acordo</th><th>Audiência</th><th>Advogado</th><th>Praça</th>'
    + '<th class="num">Valor</th><th class="num">Sucumbência</th><th>Parcelas</th>'
    + '<th class="num">Escritório</th><th class="num">Cliente</th><th>Observações</th></tr></thead><tbody>'
    + IMPAC.slice(0,150).map(l => {
        const base = rd(l.valorTotal - l.sucumbencia);   // parte rateável, fora a sucumbência
        const esc2 = rd(l.sucumbencia + base * l.pctEsc / 100), cli = rd(base * l.pctCli / 100);
        return '<tr><td>'+pastaCliente(tit(l.pasta), tit(l.cliente))+'</td>'
          + '<td>'+dataBR(l.dataAcordo)+'</td><td>'+esc(l.audiencia||'—')+'</td>'
          + '<td>'+esc(tit(l.advogado)||'—')+'</td><td>'+esc(l.praca||'—')+'</td>'
          + '<td class="num">'+nMoeda(l.valorTotal)+'</td><td class="num">'+nMoeda(l.sucumbencia)+'</td>'
          + '<td>'+l.qtd+'x a partir de '+dataBR(l.primeiro)+'</td>'
          + '<td class="num">'+nMoeda(esc2)+'</td><td class="num">'+nMoeda(cli)+'</td>'
          + '<td class="mini">'+esc(l.obs||'')+'</td></tr>';
      }).join('')
    + '</tbody></table></div>' + (IMPAC.length > 150 ? '<p class="mini">Mostrando os 150 primeiros.</p>' : '');
  $('#btnImpAc').disabled = IMPAC.length === 0;
